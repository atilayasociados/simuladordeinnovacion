  call('apiEstado', TOK).then(function (v) { if (!v || v.modelo !== 'VR') throw 'Esta simulación usa el motor anterior, que fue retirado. Pide a tu docente el código de una simulación nueva.'; VR_iniciar(v); })
    .catch(function (e) {
      $('nav').style.display = 'none'; $('pie').style.display = 'none';
      $('meta').innerHTML = '<a href="#" class="ax-salir" onclick="pantallaLogin();return false">Salir</a>';
      $('app').innerHTML = '<div class="msg err">' + esc(e) + '</div>';
      if (/sesión/.test(e)) setTimeout(pantallaLogin, 1500);
    });
}
// Mientras el trimestre está cerrado, revisa cada 30 s si el docente ya lo abrió y actualiza sola.
var VIGIA = null;
function vigilarApertura(activar) {
  if (!activar) { if (VIGIA) { clearInterval(VIGIA); VIGIA = null; } return; }
  if (VIGIA) return;
  VIGIA = setInterval(function () {
    if (!TOK || ROL === 'docente' || document.hidden || !VV) return;
    call('apiEstado', TOK).then(function (v) {
      if (v.partida.estado !== 'abierto' || (v.partida.t === VV.partida.t && VV.partida.estado === 'abierto')) return;
      vigilarApertura(false); VR_iniciar(v); aviso('El docente abrió el trimestre ' + v.partida.t + ': ya pueden decidir.', 'ok');
    }).catch(function () { });
  }, 30000);
}

// ===================== Docente =====================
var ATABS = [['simulaciones', 'Simulaciones'], ['partida', 'Partida'], ['equipos', 'Equipos'], ['vida', 'Vida real'], ['ranking', 'Ranking'], ['resultados', 'Resultados de la clase']];
var SIMS = null, SIMID = null;
function cargarAdmin() {
  call('apiAdmin', TOK, 'simulaciones').then(function (r) {
    SIMS = r;

    if (!SIMID && act.length) SIMID = act[act.length - 1].simId;
    if (SIMID && !act.some(function (x) { return x.simId === SIMID; })) SIMID = act.length ? act[act.length - 1].simId : null;
    if (SIMID && ['simulaciones', 'docentes', 'cuenta'].indexOf(ATAB) < 0) return call('apiAdmin', TOK, 'resumen', { simId: SIMID }).then(function (x) { ADM = x; renderAdmin(); });
    ADM = null; renderAdmin();
  }).catch(function (e) { aviso(e, 'err'); });
}

  $('nav').innerHTML = tabs.map(function (t) { return '<button class="' + (ATAB === t[0] ? 'on' : '') + '" onclick="irA(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('');
  if (['simulaciones', 'docentes', 'cuenta'].indexOf(ATAB) < 0 && !ADM) { $('app').innerHTML = '<div class="card"><p>Primero cree o seleccione una simulación en la pestaña Simulaciones.</p></div>'; return; }
  var f = { docentes: AX_aDocentes, cuenta: AX_aCuenta, simulaciones: aSimulaciones, partida: aPartida, equipos: AX_aEquipos, ranking: aRanking, vida: VR_aPanel, resultados: aResultados }[ATAB] || aSimulaciones;
  $('app').innerHTML = f();
  if (ATAB === 'vida') VR_cargarPanel(); if (ATAB === 'ranking') cargarRanking();  if (ATAB === 'resultados') cargarResultadosClase(); if (ATAB === 'equipos') AX_cargarEquipos(); if (ATAB === 'docentes') AX_cargarDocentes(); if (ATAB === 'cuenta') AX_cargarCuenta();

function irA(t) { ATAB = t; cargarAdmin(); }
function elegirSim(id) { SIMID = id; ATAB = 'partida'; cargarAdmin(); }
function adm(accion, datos, recargar) {

}
function aSimulaciones() {

archivo">💾 Backup</button><button class="btn sec sim-del" onclick="SIM_eliminar(\'' + s.simId + '\')" title="Borrar definitivamente">✕ Eliminar</button></div></td></tr>'; }).join('') + '</table></div>' : '<p class="muted">' + (ARC.length ? 'No hay simulaciones activas. Las archivadas están más abajo.' : 'Aún no hay simulaciones.') + '</p>') + '</div>';
  if (ARC.length) h += '<div class="card"><h2>Simulaciones archivadas (' + ARC.length + ')</h2><p class="muted">Los equipos no pueden ingresar. Los datos se conservan hasta que las elimine.</p><div class="scroll"><table><tr><th>Simulación</th><th>Materia</th>' + (SIMS.yo && SIMS.yo.superadmin ? '<th>Docente</th>' : '') + '<th>Código</th><th>Trimestre</th><th class="n">Equipos</th><th class="n">Estudiantes</th><th></th></tr>' + ARC.map(function (s) { return '<tr><td>' + esc(s.nombre) + '</td><td>' + esc(s.sigla) + '</td>' + (SIMS.yo && SIMS.yo.superadmin ? '<td>' + esc(s.docente) + '</td>' : '') + '<td><span class="ax-codigo">' + esc(s.codigo) + '</span></td><td>' + (s.t > SIMS.total ? 'Terminada' : 'T' + s.t) + '</td><td class="n">' + s.equipos + '</td><td class="n">' + s.integrantes + '</td><td><div class="sim-acc"><button class="btn sec" onclick="adm(\'desarchivar\',{simId:\'' + s.simId + '\'})">↩ Desarchivar</button><button class="btn sec" onclick="SIM_backup(\'' + s.simId + '\')">💾 Backup</button><button class="btn sec sim-del" onclick="SIM_eliminar(\'' + s.simId + '\')">✕ Eliminar</button></div></td></tr>'; }).join('') + '</table></div></div>';
  h += '<div class="card"><h2>Nueva simulación</h2><div class="grid g3"><div><label>Nombre</label><input type="text" id="snom" placeholder="Innovación — Grupo T"></div><div><label>Materia (sigla)</label><input type="text" id="ssig" placeholder="COM505T"></div><div><label>Máximo de integrantes por equipo</label><select id="smax">' + [1, 2, 3, 4, 5].map(function (n) { return '<option' + (n === 5 ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div></div><div style="margin-top:10px"><button class="btn" onclick="adm(\'crearSimulacion\',{nombre:$(\'snom\').value,sigla:$(\'ssig\').value,maxIntegrantes:$(\'smax\').value})">Crear simulación y generar código</button></div><p class="muted">El sistema genera un código como INN-A2B3. Compártalo con los estudiantes junto con el enlace del simulador: con él registran su equipo e ingresan.</p></div>';

}
// ---------- archivar, respaldo, restaurar y eliminar ----------
function SIM_get(id) { return SIMS.lista.filter(function (s) { return s.simId === id; })[0]; }
function SIM_archivar(id) {
  var s = SIM_get(id);
  AX_confirmar('Archivar "' + s.nombre + '"', 'Los equipos ya no podrán ingresar y la simulación pasará a la lista de archivadas. Sus datos se conservan y puede desarchivarla cuando quiera.', '📦 Archivar', function () { adm('archivar', { simId: id }); });
}
function SIM_backup(id) {
  aviso('Preparando el respaldo…');
  return call('apiAdmin', TOK, 'respaldo', { simId: id }).then(function (r) {
    var f = 'respaldo_' + String(r.simulacion.codigo).replace(/[^A-Za-z0-9-]/g, '') + '_' + String(r.creado).slice(0, 10) + '.json';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(r)], { type: 'application/json' })); a.download = f;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    aviso('Respaldo descargado: ' + f + ' (' + r.simulacion.equipos + ' equipos). Guárdelo en un lugar seguro: contiene nombres y registros de los estudiantes.', 'ok');
    return true;
  }).catch(function (e) { aviso(e, 'err'); return false; });
}
function SIM_eliminar(id) {
  var s = SIM_get(id);
  var d = AX_modal('<h3>Eliminar "' + esc(s.nombre) + '"</h3><p>Se borrarán <b>definitivamente</b> la simulación, sus ' + s.equipos + ' equipos, ' + s.integrantes + ' estudiantes, decisiones, resultados, bitácoras y evaluaciones. <b>No se puede deshacer.</b></p><p>Si cree que la necesitará después, descargue antes un respaldo: podrá restaurarla con él.</p><div class="inline"><button class="btn sec" id="simDB">💾 Descargar respaldo primero</button></div><label for="simDC" style="margin-top:10px">Para confirmar, escriba el código <span class="ax-codigo">' + esc(s.codigo) + '</span></label><input type="text" id="simDC" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px"><div class="inline" style="margin-top:10px"><button class="btn sec" id="simDNo">Cancelar</button><button class="btn ax-rojo peligro" id="simDSi" disabled>✕ Eliminar definitivamente</button></div>');
  var inp = d.querySelector('#simDC'), si = d.querySelector('#simDSi'); inp.focus();
  var norm = function (x) { return String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  inp.oninput = function () { si.disabled = norm(inp.value) !== norm(s.codigo); };
  d.querySelector('#simDB').onclick = function () { SIM_backup(id); };
  d.querySelector('#simDNo').onclick = function () { d.remove(); };
  si.onclick = function () { var v = inp.value; d.remove(); if (SIMID === id) SIMID = null; adm('eliminarSimulacion', { simId: id, confirmar: v }); };
}
function SIM_restaurar() {
  var f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json';
  f.onchange = function () {
    var file = f.files && f.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      var R = null; try { R = JSON.parse(rd.result); } catch (e) { }
      if (!R || R.tipo !== 'simulador-innovacion-respaldo' || !R.simulacion) { aviso('El archivo elegido no es un respaldo del Simulador de Innovación.', 'err'); return; }
      var S = R.simulacion, existe = SIMS.lista.some(function (x) { return x.simId === S.simId; });
      var d = AX_modal('<h3>Restaurar una simulación</h3><p><b>' + esc(S.nombre) + '</b> · ' + esc(S.sigla || '') + '<br>Código: <span class="ax-codigo">' + esc(S.codigo) + '</span> · Trimestre ' + esc(S.trimestre) + ' · ' + S.equipos + ' equipos · ' + S.integrantes + ' estudiantes<br><span class="muted">Respaldo del ' + esc(String(R.creado).slice(0, 10)) + '</span></p><p>' + (existe ? 'Esta simulación todavía existe: se creará una <b>copia</b> con el nombre "(restaurada)" y, si el código está en uso, uno nuevo. La original no se modifica.' : 'Se recreará la simulación con sus equipos, contraseñas, decisiones y resultados tal como estaban en el respaldo.') + ' Quedará con el acceso cerrado.</p><div class="inline"><button class="btn sec" id="simRNo">Cancelar</button><button class="btn" id="simRSi">📂 Restaurar</button></div>');
      d.querySelector('#simRNo').onclick = function () { d.remove(); };
      d.querySelector('#simRSi').onclick = function () { d.remove(); aviso('Restaurando…'); adm('restaurarSimulacion', { respaldo: R }, false).then(function (r) { if (r && r.simId) SIMID = r.simId; cargarAdmin(); }); };
    };
    rd.readAsText(file);
  };
  f.click();
}
function aPartida() {
  var p = ADM.partida, env = ADM.equipos.filter(function (e) { return e.envio === 'enviado'; }).length;
  return (ADM.motorRetirado ? '<div class="msg err">Esta simulación usa el motor anterior, que fue retirado. Sus datos se conservan: en la pestaña Simulaciones puede descargar su respaldo, archivarla o eliminarla. Para jugar, cree una simulación nueva.</div>' : '') + '<div class="card"><h2>Parámetros de configuración</h2><div class="grid g4"><div class="kpi"><div class="v" style="letter-spacing:3px">' + esc(p.codigo) + '</div><div class="l">Código para los estudiantes</div></div><div class="kpi"><div class="v">' + (p.t > ADM.total ? 'Fin' : 'T' + p.t) + '</div><div class="l">Trimestre actual</div></div><div class="kpi"><div class="v">' + esc(p.estado) + '</div><div class="l">Estado del trimestre</div></div><div class="kpi"><div class="v">' + env + ' / ' + ADM.equipos.length + '</div><div class="l">Equipos que enviaron</div></div></div>' +
    '<div class="grid g4" style="margin-top:10px"><div><label>Nombre</label><input type="text" id="pnom" value="' + esc(p.nombre) + '"></div><div><label>Sigla</label><input type="text" id="psig" value="' + esc(p.sigla) + '"></div><div><label>Máximo de integrantes</label><select id="pmax">' + [1, 2, 3, 4, 5].map(function (n) { return '<option' + (n === p.maxIntegrantes ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div></div>' +
    '<div class="grid g2" style="margin-top:10px"><div><label>Código de la simulación (4 a 12 letras, números o guiones)</label><input type="text" id="pcod" value="' + esc(p.codigo) + '" maxlength="12" style="text-transform:uppercase;letter-spacing:2px"></div><div class="muted" style="align-self:end">Si lo cambia, avise a los equipos: lo necesitan para registrarse y para ingresar.</div></div>' +
    '<label class="chk" style="margin-top:8px"><input type="checkbox" id="preg"' + (p.registroAbierto ? ' checked' : '') + '> Registro de equipos abierto (los estudiantes pueden registrarse y agregar integrantes)</label>' +
    '<div style="margin-top:8px"><button class="btn sec" onclick="adm(\'editarSimulacion\',{codigo:$(\'pcod\').value,nombre:$(\'pnom\').value,sigla:$(\'psig\').value,maxIntegrantes:$(\'pmax\').value,registroAbierto:$(\'preg\').checked})">Guardar parámetros</button></div></div>' +
    '<div class="card"><h2>Control del trimestre</h2><div class="inline"><button class="btn sec" onclick="adm(\'abrir\')">Abrir trimestre</button><button class="btn sec" onclick="adm(\'cerrar\')">Cerrar trimestre</button><button class="btn" onclick="if(confirm(\'¿Procesar el trimestre ' + p.t + ' para todos los equipos de esta simulación?\'))adm(\'procesar\')">Procesar trimestre ' + p.t + '</button><button class="btn sec" onclick="if(confirm(\'¿Deshacer el último trimestre procesado?\'))adm(\'retroceder\')">Deshacer último procesamiento</button></div>' +
    '<p class="muted">Flujo sugerido: los equipos se registran con el código → cierre el registro → abra el T1 → los equipos envían → cierre → procese (abre el siguiente trimestre) → debriefing.</p></div>' +
    '<div class="card"><h2>Reiniciar simulación</h2><p class="muted">Borra decisiones, estados, resultados y bitácoras de esta simulación. Conserva equipos e integrantes.</p><div class="inline"><input type="text" id="conf" placeholder="Escriba REINICIAR" style="max-width:220px"><label class="chk"><input type="checkbox" id="nsem"> Nueva semilla</label><button class="btn peligro" onclick="adm(\'reiniciar\',{confirmar:$(\'conf\').value,nuevaSemilla:$(\'nsem\').checked})">Reiniciar</button></div></div>';
}
function aRanking() { return '<div class="card"><h2>Ranking y debriefing</h2><div id="rk" class="muted">Cargando…</div></div>'; }
function cargarRanking() {
  call('apiAdmin', TOK, 'ranking', { simId: SIMID }).then(function (r) {
    if (!r.filas.length) { $('rk').innerHTML = 'Aún no hay trimestres procesados.'; return; }

      r.filas.map(function (d, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(d.nombre) + '</td><td class="n"><b>' + d.puntaje + '</b></td><td class="n">' + kbs(d.valor) + '</td><td class="n">' + kbs(d.valorSinInnovar) + '</td><td class="n">' + kbs(d.utilidadAcum) + '</td><td class="n">' + kbs(d.utilidadSinInnovar) + '</td><td class="n">' + d.roi + '</td><td class="n">' + pct(d.vitalidad) + '</td><td class="n">' + pct(d.cuotaCrecimiento) + '</td><td class="n">' + d.resiliencia + '</td><td class="n">' + d.madurez + '</td><td class="n">' + d.clima + '</td></tr>'; }).join('') + '</table></div><p class="muted">Preguntas para el debriefing: ¿qué decisiones explican la diferencia entre el primero y el último? ¿Quién recuperó primero la inversión frente a la empresa que no innovó? ¿Qué equipo leyó mejor las señales del disruptor?</p>';
  }).catch(function (e) { $('rk').innerHTML = esc(e); });
}
function aResultados() { return '<div class="card"><h2>Resultados de la clase por trimestre</h2><div id="rc" class="muted">Cargando…</div><p class="muted">Los mismos datos están en la hoja "Resultados" para exportarlos.</p></div>'; }
function cargarResultadosClase() {
  call('apiAdmin', TOK, 'resultados', { simId: SIMID }).then(function (L) {
    if (!L.length) { $('rc').innerHTML = 'Sin resultados.'; return; }
    var cols = ['equipo', 'trimestre', 'ventas', 'utilidadNeta', 'caja', 'cuotaTotal', 'vitalidad', 'clima', 'madurez', 'gastoInnovacion', 'ventasSinInnovar', 'utilidadSinInnovar'];

  });
}

<script>
// ===================== Acceso v2.3 (cliente) =====================
var AXS = { logos: [], manual: '', inv: null, pend: null, reg: null, eq: null, doc: null };
var AX_PIE = 'UAGRM - Ingeniería Comercial – COM505T Innovación – Profesor Jhonny David Atila Lijerón';
function AX_$(id) { return document.getElementById(id); }
function AX_inicio() {
  document.body.classList.add('ax-on');
  AX_$('ax').innerHTML = AX_marco('<p class="ax-center" style="color:#a8c0d8">Cargando…</p>');
  call('apiAXInicio', (typeof AX_INV !== 'undefined' && AX_INV) || '').then(function (r) {
    AXS.logos = r.logos || []; AXS.manual = r.manual || ''; AXS.inv = r.invitacion;
    AX_mostrar(AXS.inv ? 'alta' : 'ingresar');
  }).catch(function (e) { AX_mostrar('ingresar'); AX_err(e); });
}
function AX_cab() {
  var lg = [0, 1, 2].map(function (i) { var s = AXS.logos[i]; var alt = ['UAGRM', 'Ciencias Económicas', 'Ingeniería Comercial'][i]; return '<div class="ax-logo">' + (s ? '<img src="' + s + '" alt="Logo ' + alt + '">' : '<span>' + alt + '</span>') + '</div>'; }).join('');
  return '<div class="ax-logos">' + lg + '</div><div class="ax-title">Simulador de Innovación</div><div class="ax-sub">Innovación</div><div class="ax-sub2">Empresas que compiten en un mismo mercado · 12 trimestres de decisiones</div>';
}
function AX_marco(cuerpo, ancho) {
  return '<div class="ax-wrap"><div class="ax-card' + (ancho ? ' ax-wide' : '') + '">' + AX_cab() + cuerpo + '</div><div class="ax-foot">' + esc(AX_PIE) + '</div></div>';
}
function AX_pw(id, ph, ac) { return '<div class="ax-pw"><input class="ax-in" type="password" id="' + id + '" placeholder="' + esc(ph || '') + '" autocomplete="' + (ac || 'current-password') + '"><button type="button" class="ax-eye" aria-label="Mostrar u ocultar la contraseña" onclick="AX_ojo(\'' + id + '\')">👁</button></div>'; }
function AX_ojo(id) { var e = AX_$(id); e.type = e.type === 'password' ? 'text' : 'password'; }
function AX_err(m) { var e = AX_$('axErr'); if (e) { e.className = 'ax-err'; e.textContent = m || ''; } }
function AX_info(m) { var e = AX_$('axErr'); if (e) { e.className = 'ax-info'; e.textContent = m || ''; } }
function AX_busy(btn, on, txt) { if (!btn) return; if (on) { btn.dataset.t = btn.textContent; btn.textContent = 'Procesando…'; btn.disabled = true; } else { btn.textContent = txt || btn.dataset.t || btn.textContent; btn.disabled = false; } }
function AX_enter(ev, fn) { if (ev.key === 'Enter') { ev.preventDefault(); fn(); } }
function AX_cerrar() { document.body.classList.remove('ax-on'); AX_$('ax').innerHTML = ''; }

function AX_mostrar(modo, msg) {
  document.body.classList.add('ax-on');
  var h = '', ancho = false;
  if (modo === 'ingresar') {
    h = '<h2>Ingresar</h2><label for="axU">Nombre de equipo · Correo del profesor</label><input class="ax-in" id="axU" autocomplete="username" oninput="AX_codVis()" onkeydown="AX_enter(event,AX_ingresar)">' +
      '<label for="axP">Contraseña</label>' + AX_pw('axP', '') +
      '<div id="axCodBox"><label for="axC">Código de simulación</label><input class="ax-in ax-code" id="axC" placeholder="INN-XXXX" autocomplete="off" oninput="this.value=this.value.toUpperCase()" onkeydown="AX_enter(event,AX_ingresar)"><p class="ax-hint">📌 Te lo da tu docente. Los docentes no lo necesitan.</p></div>' +
      '<button class="ax-btn" id="axGo" onclick="AX_ingresar()">Ingresar →</button><div id="axErr" class="ax-err"></div>' +
      '<p class="ax-center"><button class="ax-link" onclick="AX_mostrar(\'recuperar\')">¿Olvidaste tu contraseña?</button></p>' +
      '<div class="ax-div">¿Primera vez?</div><button class="ax-ghost" onclick="AX_mostrar(\'registro\')">Registrar mi equipo</button>' +
      (AXS.manual ? '<a class="ax-ghost" href="' + esc(AXS.manual) + '" target="_blank" rel="noopener">📘 Ver Manual del Estudiante</a>' : (typeof abrirManualPublico === 'function' ? '<button class="ax-ghost" onclick="abrirManualPublico()">📘 Ver Manual del Estudiante</button>' : ''));
  } else if (modo === 'registro') {
    ancho = true; AXS.reg = { ok: false, max: 5 };
    h = '<h2>Registrar mi equipo</h2><label for="axRn">Nombre del equipo o empresa</label><input class="ax-in" id="axRn" maxlength="40" placeholder="Ejemplo: Lácteos Andinos">' +
      '<p class="ax-hint">📌 Es el nombre con el que ingresarán y competirán.</p>' +
      '<div class="ax-2col"><div><label for="axRp">Contraseña</label>' + AX_pw('axRp', 'Mínimo 4 caracteres', 'new-password') + '</div><div><label for="axRp2">Confirmar contraseña</label>' + AX_pw('axRp2', '', 'new-password') + '</div></div>' +
      '<label for="axRc">Código de simulación</label><input class="ax-in ax-code" id="axRc" placeholder="INN-XXXX" autocomplete="off" oninput="this.value=this.value.toUpperCase();AX_validarCod()"><div id="axRcm"></div>' +
      '<div class="ax-inth"><b>INTEGRANTES DEL EQUIPO</b><button class="ax-add" id="axAdd" onclick="AX_fila()">+ Agregar integrante</button></div><div id="axFilas"></div>' +
      '<p class="ax-hint">📌 El número de registro es obligatorio; el teléfono es opcional.</p>' +
      '<div class="ax-warn">⚠ Guarda bien tu contraseña — la necesitarás en cada ronda.</div>' +
      '<button class="ax-green" id="axGo" onclick="AX_registrar()">✓ Registrar Equipo</button><div id="axErr" class="ax-err"></div>' +
      '<button class="ax-back" onclick="AX_mostrar(\'ingresar\')">← Volver</button>';
  } else if (modo === 'recuperar') {
    h = '<h2>Recuperar contraseña</h2><div class="ax-warn">Equipos: pedí a tu docente una contraseña temporal. Con ella ingresas y el sistema te pedirá crear una nueva.</div>' +
      '<label for="axRe">Docentes: tu correo</label><input class="ax-in" id="axRe" type="email" autocomplete="username" onkeydown="AX_enter(event,AX_verPregunta)"><button class="ax-btn" id="axGoP" onclick="AX_verPregunta()">Ver mi pregunta de seguridad</button>' +
      '<div id="axPreg"></div><div id="axErr" class="ax-err"></div><button class="ax-back" onclick="AX_mostrar(\'ingresar\')">← Volver</button>';
  } else if (modo === 'cambiar') {
    var min = AXS.pend && AXS.pend.tipo === 'docente' ? 6 : 4;
    h = '<h2>Crea tu contraseña</h2><p class="ax-hint" style="text-align:center">📌 Ingresaste con una contraseña temporal. Crea una nueva para continuar (mínimo ' + min + ' caracteres).</p>' +
      '<label for="axN1">Contraseña nueva</label>' + AX_pw('axN1', '', 'new-password') + '<label for="axN2">Confirmar contraseña nueva</label>' + AX_pw('axN2', '', 'new-password') +
      '<button class="ax-btn" id="axGo" onclick="AX_cambiarTemp()">Guardar y continuar →</button><div id="axErr" class="ax-err"></div><button class="ax-back" onclick="AX_mostrar(\'ingresar\')">← Volver</button>';
  } else if (modo === 'quien') {
    var P = AXS.pend || {};
    h = '<h2>¿Quién eres?</h2><p class="ax-hint" style="text-align:center">📌 ' + esc(P.equipo || 'Tu equipo') + ': elige tu nombre para que tus aportes queden registrados a tu nombre.</p>' +
      (P.integrantes || []).map(function (i) { return '<button class="ax-pick" onclick="AX_elegir(\'' + esc(i.registro) + '\')">' + esc(i.nombre) + ' <span style="color:#88b0cc;font-size:12px">· ' + esc(i.registro) + '</span></button>'; }).join('') +
      '<div id="axErr" class="ax-err"></div><button class="ax-back" onclick="AX_mostrar(\'ingresar\')">← Volver</button>';
  } else if (modo === 'alta') {
    var I = AXS.inv || {};

function VR_inicio() {
  var u = VR_ultimo(), b = u ? u.balance : VV.empresa.balanceInicial, h = '';
  h += '<div class="card"><h2>Tu comité de innovación</h2><p>Son el comité de innovación de <b>' + esc(VV.empresa.nombre) + '</b>, una láctea de Santa Cruz que hoy vende una leche chocolatada UHT de 1 litro a Bs 17,00 en supermercados. Compiten con los demás equipos y con dos marcas fijas: <b>Cupesí</b> (diferenciador, chocolatada sin lactosa con edulcorantes) y <b>Motacú</b> (líder en costos). Cada trimestre deciden su comité, sus proyectos (con Gantt y dos compuertas) y la gestión comercial de sus productos.</p>' +
    '<p class="muted">Todos los datos del simulador tienen fuente: precios de góndola de Santa Cruz, costos de Leche Gloria, preferencias de Brodock et al. (2021), elasticidades publicadas. Consulten el informe del macroentorno.</p></div>';
  h += '<div class="grid g4">' +
    '<div class="kpi"><div class="v">' + (u ? vrBs(u.resultados.ventas) : '—') + '</div><div class="l">Ventas del último trimestre</div></div>' +
    '<div class="kpi"><div class="v">' + (u ? vrBs(u.resultados.utilidadNeta) : '—') + '</div><div class="l">Utilidad neta del último trimestre</div></div>' +
    '<div class="kpi"><div class="v">' + vrBs(b.caja) + '</div><div class="l">Caja</div></div>' +
    '<div class="kpi"><div class="v">' + (u ? vrBs(u.cajaDisponibleLanzamiento) : '—') + '</div><div class="l">Caja disponible para lanzar (sobre el saldo mínimo)</div></div></div>';
  h += '<div class="card"><h2>Presupuesto de innovación del año</h2><p>' + vrBs(VV.empresa.presupuestoAnual) + ' (0,8 % de las ventas del año anterior). Paga los sueldos del comité según su dedicación, el desarrollo y el registro sanitario. Los estudios de mercado se pagan aparte, como gasto de ventas.</p><div id="vr-costos">' + VR_costosHtml() + '</div></div>';
  if (u) {
    var porP = u.operacion.porProducto;
    h += '<div class="card"><h2>Trimestre ' + u.t + ': operación por producto</h2><div class="scroll"><table><tr><th>Producto</th><th class="n">Demanda (L)</th><th class="n">Producción (L)</th><th class="n">Ventas (L)</th><th class="n">Ventas perdidas (L)</th><th class="n">Vencido (L)</th><th class="n">Ventas (Bs)</th></tr>' +
      Object.keys(porP).map(function (id) { var r = porP[id], n = VR_nomProd(id); var venc = r.semanas.reduce(function (s, w) { return s + w.vencido; }, 0); return '<tr><td>' + esc(n) + '</td><td class="n">' + vrN(r.demanda) + '</td><td class="n">' + vrN(r.produccion) + '</td><td class="n">' + vrN(r.litros) + '</td><td class="n">' + vrN(r.perdidas) + '</td><td class="n">' + vrN(venc) + '</td><td class="n">' + vrN(r.ventas) + '</td></tr>'; }).join('') + '</table></div>' +
      (u.operacion.recorteCapacidad > 0 ? '<p class="msg err">La planta no alcanzó: la producción planificada se recortó ' + vrP(u.operacion.recorteCapacidad) + ' por la capacidad (' + vrN(u.operacion.capacidadSemanal) + ' L por semana).</p>' : '') + '</div>';
  }
  var ev = [];
  (VV.innov.proyectos || []).forEach(function (p) {
    var r = p.resultados || {};
    if (r.compuerta1) ev.push(p.nombre + ': compuerta 1 ' + (r.compuerta1.aprobada ? 'aprobada' : 'no aprobada (proyecto detenido)') + ' en la semana ' + r.compuerta1.semana + '.');
    if (r.compuerta2) ev.push(p.nombre + ': compuerta 2 ' + (r.compuerta2.aprobada ? 'aprobada' : 'no aprobada (proyecto detenido)') + ' en la semana ' + r.compuerta2.semana + '.');
    if (p.estado === 'lanzado') ev.push(p.nombre + ': lanzado en el trimestre ' + p.trimestreLanzamiento + '.');
  });
  if (ev.length) h += '<div class="card"><h2>Hitos de sus proyectos</h2><ul>' + ev.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  return h;
}
function VR_costosHtml() {
  if (!VREV) return '<p class="muted">Calculando…</p>';
  var c = VREV.costosTrimestre;
  return '<div class="scroll"><table><tr><th>Este trimestre</th><th class="n">Bs</th></tr><tr><td>Sueldos del comité (según dedicación)</td><td class="n">' + vrN(c.comite) + '</td></tr><tr><td>Desarrollo</td><td class="n">' + vrN(c.desarrollo) + '</td></tr><tr><td>Registro sanitario</td><td class="n">' + vrN(c.registroSanitario) + '</td></tr><tr><td><b>Total con cargo al presupuesto de innovación</b></td><td class="n"><b>' + vrN(c.totalInnovacion) + '</b></td></tr><tr><td>Estudios de mercado (gasto de ventas)</td><td class="n">' + vrN(c.estudios) + '</td></tr></table></div>';
}
function VR_nomProd(id) { var n = id; VV.empresa.productos.forEach(function (p) { if (p.id === id) n = p.nombre; }); return n; }

// ---------- Informes ----------
function VR_informes() {
  var I = VV.informes, h = '';
  if ((I.noticias || []).length) h += '<div class="card"><h2>Noticias que afectan a todas las empresas</h2>' + I.noticias.map(function (n) { return '<p><b>Trimestre ' + n.trimestre + ': ' + esc(n.titulo) + '.</b> ' + esc(n.texto) + ' <span class="muted">Fuente: ' + esc(n.fuente) + '</span></p>'; }).join('') + '</div>';
  h += '<div class="card"><h2>Informe del macroentorno (gratis)</h2><div class="scroll"><table>' + I.macro.map(function (m) { return '<tr><th>' + esc(m.ambito) + '</th><td>' + esc(m.texto) + '</td></tr>'; }).join('') + '</table></div></div>';
  h += '<div class="card"><h2>Informe de la industria (gratis)</h2><p>Mercado de leche saborizada de Santa Cruz: entre ' + vrN(I.industria.mercadoAproxLitrosTrim[0]) + ' y ' + vrN(I.industria.mercadoAproxLitrosTrim[1]) + ' litros por trimestre (aproximado). La cifra exacta por segmento y la participación por marca están en el estudio de mercado.</p>' +
    '<h3>Góndola: productos visibles y precio al consumidor</h3><div class="scroll"><table><tr><th>Empresa</th><th>Producto</th><th class="n">Precio (Bs/L)</th><th>Endulzante</th><th class="n">Azúcar añadida (g/100 ml)</th><th class="n">Grasa (%)</th><th class="n">Proteína (g/100 ml)</th><th class="n">Tamaño (ml)</th></tr>' +
    I.industria.gondola.map(function (g) { return '<tr><td>' + esc(g.empresa) + '</td><td>' + esc(g.producto) + '</td><td class="n">' + vrN(g.precioConsumidor * 1000 / (g.tamanoMl || 1000), 2) + '</td><td>' + esc((g.endulzante || []).map(function (e) { return VR_END[e] || e; }).join(' + ')) + '</td><td class="n">' + vrN(g.azucarAnadida100ml, 1) + '</td><td class="n">' + vrN(g.grasa100ml, 1) + '</td><td class="n">' + vrN(g.proteina100ml, 1) + '</td><td class="n">' + vrN(g.tamanoMl) + '</td></tr>'; }).join('') + '</table></div>' +
    '<h3>Canales</h3><div class="scroll"><table><tr><th>Canal</th><th class="n">Margen del comerciante</th><th class="n">Cobro a la empresa</th></tr>' + Object.keys(I.industria.canales).map(function (k) { var c = I.industria.canales[k]; return '<tr><td>' + VR_CAN[k] + '</td><td class="n">' + vrP(c.margen) + '</td><td class="n">' + (c.diasCobro ? c.diasCobro + ' días' : 'al contado') + '</td></tr>'; }).join('') + '</table></div><p class="muted">Costo de distribución: ' + vrP(I.industria.costoDistribucionPct) + ' de las ventas de la empresa en los tres canales.</p></div>';
  h += '<div class="card"><h2>Estudio de mercado y competencia (de pago)</h2><p>Una consultora mide lo que pasó en el mercado durante el trimestre. Cuesta <b>' + vrBs(VV.cat.estudios.mercado) + '</b> (gasto de ventas, no sale del presupuesto de innovación). Si lo marcan, lo reciben <b>en esta misma sección, cuando el docente procese el trimestre</b>, con estos datos de cada producto del mercado (los de todos los equipos, Cupesí y Motacú):</p><ul>' +
    '<li>Litros vendidos y participación de mercado.</li><li>Litros vendidos en cada segmento (lo natural, cuidan calorías, promedio) y tamaño de cada segmento.</li>' +
    '<li>Precio al consumidor en supermercado, tienda de barrio y mercado.</li><li>Publicidad del trimestre (la de Cupesí y Motacú, estimada por la consultora).</li><li>Mensaje del frente del envase.</li></ul>' +
    '<p class="muted">Sin el estudio solo ven el rango aproximado del mercado y la góndola (arriba). Los otros estudios de pago (del consumidor, prueba de concepto y prueba de producto) se compran dentro de cada proyecto, en su Gantt.</p>' +
    (VR_puedeEditar() ? '<label class="chk"><input type="checkbox"' + (DD.estudioMercado ? ' checked' : '') + ' onchange="VR_set(\'estudioMercado\', this.checked)"> Comprar el estudio de mercado este trimestre</label>' : '') + VR_estudiosMercado() + '</div>';
  return h;
}
function VR_estudiosMercado() {
  var E = VV.informes.estudiosMercado || {}, ks = Object.keys(E).sort(function (a, b) { return Number(b.slice(1)) - Number(a.slice(1)); });
  if (!ks.length) return '<p class="muted">Todavía no compraron estudios de mercado.</p>';
  var e = E[ks[0]], CAN = { supermercado: 'Supermercado', tienda: 'Tienda de barrio', mercado: 'Mercado' }, cs = Object.keys(CAN), algunaEst = false;
  var MSJ = {}; (VV.cat.mensajes || []).forEach(function (m) { MSJ[m.clave] = m.nombre; });
  return '<h3>Estudio del trimestre ' + e.trimestre + '</h3><div class="scroll"><table><tr><th>Producto</th><th class="n">Litros</th><th class="n">Participación</th>' + Object.keys(VR_SEG).map(function (s) { return '<th class="n">' + VR_SEG[s] + ' (L)</th>'; }).join('') + '</tr>' +
    e.productos.map(function (p) { return '<tr><td>' + esc(VR_nomMercado(p.producto)) + '</td><td class="n">' + vrN(p.litros) + '</td><td class="n">' + vrP(p.cuota) + '</td>' + Object.keys(VR_SEG).map(function (s) { return '<td class="n">' + vrN(p.porSegmento[s]) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '<tr><td><b>Mercado</b></td><td class="n"><b>' + vrN(e.mercadoLitrosTrim) + '</b></td><td class="n">100 %</td>' + Object.keys(VR_SEG).map(function (s) { return '<td class="n">' + vrN(e.segmentos[s]) + '</td>'; }).join('') + '</tr></table></div>' +
    '<h3>Precios al consumidor por canal y publicidad del trimestre</h3><div class="scroll"><table><tr><th>Producto</th>' + cs.map(function (c) { return '<th class="n">' + CAN[c] + ' (Bs/envase)</th>'; }).join('') + '<th class="n">Publicidad (Bs)</th><th>Mensaje frontal</th></tr>' +
    e.productos.map(function (p) { var pc = p.preciosConsumidor || {}; if (p.publicidadEstimada) algunaEst = true;
      return '<tr><td>' + esc(VR_nomMercado(p.producto)) + '</td>' + cs.map(function (c) { return '<td class="n">' + (pc[c] ? vrN(pc[c], 2) : 'no vende') + '</td>'; }).join('') + '<td class="n">' + (p.publicidadTrim == null ? '—' : vrN(p.publicidadTrim) + (p.publicidadEstimada ? ' *' : '')) + '</td><td>' + esc(MSJ[p.mensaje] || 'Sin mensaje frontal') + '</td></tr>'; }).join('') + '</table></div>' +
    (algunaEst ? '<p class="muted">* Publicidad estimada por la consultora: ventas del competidor por la proporción de publicidad sobre ventas de Leche Gloria 2024. Los precios de los competidores son los de góndola, iguales en todos los canales.</p>' : '') +
    (ks.length > 1 ? '<p class="muted">Estudios anteriores: ' + ks.slice(1).join(', ') + '.</p>' : '');
}
function VR_nomMercado(id) {
  if (id === 'cupesi') return 'Cupesí'; if (id === 'motacu') return 'Motacú';
  var m = /^E(\d+)-(.*)$/.exec(id); if (!m) return id;
  var mio = VV.equipo.motorId === 'E' + m[1];
  return (mio ? 'Tu empresa' : 'Lácteos Chiquitano ' + m[1]) + ' · ' + (m[2] === 'actual' ? 'producto actual' : 'producto nuevo ' + m[2]);
}

// ---------- Comité ----------
function VR_comite() {
  var ed = VR_puedeEditar(), S = VV.cat.sueldos;
  var h = '<div class="card"><h2>Integrantes del comité (sección 0)</h2><p>Entre 1 y 5 personas. No trabajan solo en innovación: fijen qué porcentaje de su tiempo dedican al comité. Ese porcentaje de su sueldo se carga cada semana al presupuesto de innovación, y limita cuánta carga pueden tomar en el Gantt.</p>' +
    '<p class="muted">Sueldos de referencia (INE, 2020): jefe o gerente ' + vrBs(S.jefe) + ' al mes; profesional ' + vrBs(S.profesional) + ' al mes.</p><div class="scroll"><table><tr><th>#</th><th>Nombre o rol</th><th>Cargo</th><th class="n">Dedicación (%)</th><th class="n">Costo trimestral</th><th></th></tr>';
  DD.comite.forEach(function (m, i) {
    var costo = S[m.cargo] * m.dedicacion * 12 / 52 * 13;
    h += '<tr><td>' + (i + 1) + '</td><td><input type="text" value="' + esc(m.nombre) + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'comite.' + i + '.nombre\', this.value)"></td>' +
      '<td><select' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'comite.' + i + '.cargo\', this.value, false, true)"><option value="jefe"' + (m.cargo === 'jefe' ? ' selected' : '') + '>Jefe o gerente</option><option value="profesional"' + (m.cargo === 'profesional' ? ' selected' : '') + '>Profesional</option></select></td>' +
      '<td class="n"><input type="number" min="0" max="100" step="5" style="max-width:90px" value="' + Math.round(m.dedicacion * 100) + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'comite.' + i + '.dedicacion\', Number(this.value) / 100, false, true)"></td>' +
      '<td class="n">' + vrN(costo) + '</td><td>' + (ed && DD.comite.length > 1 ? '<button class="btn sec" onclick="DD.comite.splice(' + i + ',1);VR_render();VR_revisar()">Quitar</button>' : '') + '</td></tr>';
  });
  h += '</table></div>' + (ed && DD.comite.length < 5 ? '<button class="btn sec" onclick="DD.comite.push({nombre:\'Integrante ' + (DD.comite.length + 1) + '\',cargo:\'profesional\',dedicacion:0.2});VR_render();VR_revisar()">Agregar integrante</button>' : '') + '</div>';
  return h;
}

// ---------- Proyectos ----------
function VR_proy() { for (var i = 0; i < DD.proyectos.length; i++) if (DD.proyectos[i].id === VPROY) return DD.proyectos[i]; return null; }
function VR_proyIdx() { for (var i = 0; i < DD.proyectos.length; i++) if (DD.proyectos[i].id === VPROY) return i; return -1; }
function VR_nuevoProyecto() {
  var n = 1; while (DD.proyectos.some(function (p) { return p.id === 'P' + n; })) n++;
  var s0 = VV.cat.semanaInicio, act = VV.empresa.productos[0];
  DD.proyectos.push({ id: 'P' + n, nombre: 'Proyecto ' + n, clase: '', justificacionClase: '', idea: { problema: '', paraQuien: '', propuesta: '' }, segmentoObjetivo: '', muestra: 400, reemplazaProductoActual: false,
    producto: { endulzante: (act.endulzante || ['azucar_cana']).slice(), azucarAnadida100ml: act.azucarAnadida100ml, grasa100ml: act.grasa100ml, proteina100ml: act.proteina100ml, tamanoMl: act.tamanoMl, conservacion: 'uht' },
    hoja: [{ descripcion: 'Leche cruda', categoria: 'contenido', tipo: 'variable', rubro: 'leche_cruda', cantidad: 1 }, { descripcion: 'Envase e insumos', categoria: 'envase', tipo: 'variable', rubro: 'insumos_envase_actual', cantidad: 1 }, { descripcion: 'Planta actual', categoria: 'mano_de_obra', tipo: 'variable', rubro: 'mano_obra_planta_actual', cantidad: 1 }],
    plan: { precioEmpresa: vrR(act.precioEmpresa), mezcla: { supermercado: 1, tienda: 0, mercado: 0 }, publicidad: Math.round(act.publicidadRef), produccionSemanal: 0 },
    gantt: [{ nombre: 'Estudio del consumidor', tipo: 'estudio_consumidor', inicio: s0, duracion: 5, responsable: 0, carga: 0.1 }, { nombre: 'Prueba de concepto', tipo: 'prueba_concepto', inicio: s0 + 5, duracion: 5, responsable: 0, carga: 0.1 }],
    compuerta1: { semana: s0 + 10, continuar: true }, compuerta2: { semana: 0, continuar: true } });
  VPROY = 'P' + n; VR_render(); VR_revisar();
}
function VR_proyectos() {
  var ed = VR_puedeEditar(), h = '<div class="card"><h2>Proyectos de innovación (secciones 3 y 4)</h2><p>Idea libre: escriban qué problema resuelven, para quién y qué proponen. Cada proyecto pasa por dos compuertas con criterios publicados: la <b>compuerta 1</b> (paso al desarrollo) y la <b>compuerta 2</b> (paso al lanzamiento). Planifíquenlo en semanas con su Gantt.</p><div class="inline">' +
    DD.proyectos.map(function (p) { return '<button class="btn ' + (p.id === VPROY ? '' : 'sec') + '" onclick="VPROY=\'' + p.id + '\';VR_render()">' + esc(p.nombre) + ' · ' + esc(VR_EST[p.estado || 'exploracion'] || p.estado) + '</button>'; }).join('') +
    (ed && DD.proyectos.length < 8 ? '<button class="btn sec" onclick="VR_nuevoProyecto()">+ Nuevo proyecto</button>' : '') + '</div></div>';
  var p = VR_proy();
  if (!p) return h + '<div class="card"><p class="muted">Todavía no tienen proyectos. Creen uno para empezar.</p></div>' + VR_solicitudes();
  var i = VR_proyIdx(), base = 'proyectos.' + i + '.', cerrado = p.estado === 'detenido' || p.estado === 'lanzado', e = ed && !cerrado, eIdea = e && !p.c1Aprobada;
  function txt(path, val, ph, eds) { return '<textarea rows="2"' + (eds ? '' : ' disabled') + ' placeholder="' + esc(ph) + '" onchange="VR_set(\'' + base + path + '\', this.value)">' + esc(val || '') + '</textarea>'; }
  function num(path, val, step, eds, rer) { return '<input type="number" step="' + (step || 'any') + '" value="' + (val === null || val === undefined ? '' : val) + '"' + (eds ? '' : ' disabled') + ' onchange="VR_set(\'' + base + path + '\', this.value, true' + (rer ? ', true' : '') + ')">'; }
  h += '<div class="card"><h2>' + esc(p.nombre) + ' <span class="tag">' + esc(VR_EST[p.estado || 'exploracion'] || '') + '</span></h2>' +
    '<div class="grid g2"><div><label>Nombre del proyecto</label><input type="text" value="' + esc(p.nombre) + '"' + (e ? '' : ' disabled') + ' onchange="VR_set(\'' + base + 'nombre\', this.value, false, true)"></div>' +
    '<div><label>Segmento objetivo</label><select' + (eIdea ? '' : ' disabled') + ' onchange="VR_set(\'' + base + 'segmentoObjetivo\', this.value)"><option value="">Elegir…</option>' + Object.keys(VR_SEG).map(function (s) { return '<option value="' + s + '"' + (p.segmentoObjetivo === s ? ' selected' : '') + '>' + VR_SEG[s] + '</option>'; }).join('') + '</select></div></div>' +
    '<div class="grid g3"><div><label>¿Qué problema resuelve?</label>' + txt('idea.problema', p.idea.problema, 'Problema del cliente', eIdea) + '</div><div><label>¿Para quién?</label>' + txt('idea.paraQuien', p.idea.paraQuien, 'Cliente o usuario', eIdea) + '</div><div><label>¿Qué proponen?</label>' + txt('idea.propuesta', p.idea.propuesta, 'Propuesta (producto, forma de venta, canal o modelo de negocio)', eIdea) + '</div></div>' +
    '<div class="grid g2"><div><label>Clase de innovación</label><select' + (eIdea ? '' : ' disabled') + ' onchange="VR_set(\'' + base + 'clase\', this.value)"><option value="">Elegir…</option><option value="incremental"' + (p.clase === 'incremental' ? ' selected' : '') + '>Incremental: hacer mejor lo que hacemos (solo rubros del banco)</option><option value="radical"' + (p.clase === 'radical' ? ' selected' : '') + '>Radical: hacer algo diferente (puede pedir rubros nuevos)</option></select></div><div><label>Justificación de la clase</label>' + txt('justificacionClase', p.justificacionClase, 'Por qué es incremental o radical', eIdea) + '</div></div>' +
    '<label class="chk"><input type="checkbox"' + (p.reemplazaProductoActual ? ' checked' : '') + (e ? '' : ' disabled') + ' onchange="VR_set(\'' + base + 'reemplazaProductoActual\', this.checked)"> Es una mejora del producto actual (al lanzarse lo reemplaza en lugar de sumarse)</label>' +
    (e ? '<div style="margin-top:8px"><button class="btn peligro" onclick="if(confirm(\'¿Detener este proyecto? No se puede deshacer.\')){VR_set(\'' + base + 'detener\', true, false, true)}">' + (p.detener ? 'Se detendrá al enviar' : 'Detener el proyecto') + '</button></div>' : '') + '</div>';
  // producto
  var pr = p.producto;
  h += '<div class="card"><h2>Producto propuesto</h2><p class="muted">Atributos por 100 ml, como en la etiqueta. El mercado los valora con las preferencias de cada segmento (Brodock et al., 2021); la porción de referencia es de 240 ml.</p><label>Endulzante (uno o varios)</label><div class="inline">' +
    Object.keys(VR_END).map(function (k) { var on = pr.endulzante.indexOf(k) >= 0; return '<label class="chk"><input type="checkbox"' + (on ? ' checked' : '') + (e ? '' : ' disabled') + ' onchange="VR_endulzante(' + i + ',\'' + k + '\', this.checked)"> ' + VR_END[k] + '</label>'; }).join('') + '</div>' +

    h += '<div class="grid g4"><div><label>Tipo</label><select' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'solicitudes.' + j + '.tipo\', this.value)"><option value="rubro"' + (s.tipo !== 'atributo' ? ' selected' : '') + '>Rubro nuevo</option><option value="atributo"' + (s.tipo === 'atributo' ? ' selected' : '') + '>Atributo nuevo</option></select></div><div><label>Nombre</label><input type="text" value="' + esc(s.nombre) + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'solicitudes.' + j + '.nombre\', this.value)"></div><div><label>Unidad</label><input type="text" value="' + esc(s.unidad || '') + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'solicitudes.' + j + '.unidad\', this.value)"></div><div><label>Para qué lo necesitan / estudio que lo respalda</label><input type="text" value="' + esc(s.justificacion || '') + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'solicitudes.' + j + '.justificacion\', this.value)"></div></div>';
  });
  if (ed && DD.solicitudes.length < 10) h += '<button class="btn sec" onclick="DD.solicitudes.push({tipo:\'rubro\',nombre:\'\',unidad:\'\',justificacion:\'\',proyecto:VPROY||\'\'});VR_render()">Agregar solicitud</button>';
  if (todas.length) h += '<h3>Respuestas del docente</h3><ul>' + todas.map(function (s) { return '<li>' + esc(s.nombre) + ': ' + (s.estado === 'aprobado' ? (s.tipo === 'atributo' ? '✅ atributo aprobado: ya pueden elegirlo en el producto' : '✅ incorporado al banco') : '❌ rechazado' + (s.motivo ? ' (' + esc(s.motivo) + ')' : '')) + '</li>'; }).join('') + '</ul>';
  return h + '</div>';
}

// ---------- Productos ----------
function VR_productos() {
  var ed = VR_puedeEditar(), h = '<div class="card"><h2>Productos en el mercado (sección 5)</h2><p>Para cada producto deciden el precio a la empresa, los canales, la publicidad del trimestre y cuánto producir por semana. Producir de menos pierde ventas; producir de más deja inventario que vence a las 16 semanas (UHT). Capacidad de la planta: ' + vrN(VV.empresa.capacidadSemanal) + ' unidades por semana entre todos los productos.</p></div>';
  VV.empresa.productos.forEach(function (p) {
    if (!p.activo) return;
    var d = DD.comercial[p.id], base = 'comercial.' + p.id + '.';
    h += '<div class="card"><h2>' + esc(p.nombre) + '</h2><p class="muted">Inventario: ' + vrN(p.inventarioLitros) + ' unidades · costo variable ' + vrBs(p.costoVariable, 2) + ' por unidad · publicidad de referencia ' + vrBs(p.publicidadRef) + ' por trimestre.</p>' +
      '<div class="grid g4"><div><label>Precio a la empresa (Bs)</label><input type="number" step="0.01" value="' + d.precioEmpresa + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'' + base + 'precioEmpresa\', this.value, true, true)"></div>' +
      '<div><label>Publicidad del trimestre (Bs)</label><input type="number" step="1000" value="' + d.publicidad + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'' + base + 'publicidad\', this.value, true)"></div>' +
      '<div><label>Producción semanal (vacío = lo que se espera vender)</label><input type="number" step="100" value="' + (d.produccionSemanal === null || d.produccionSemanal === undefined ? '' : d.produccionSemanal) + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'' + base + 'produccionSemanal\', this.value === \'\' ? null : Number(this.value))"></div>' +
      '<div><label>Precio al consumidor</label><div class="calc">' + Object.keys(VR_CAN).filter(function (c) { return d.mezcla[c] > 0; }).map(function (c) { return VR_CAN[c] + ': ' + vrBs(d.precioEmpresa / (1 - VV.informes.industria.canales[c].margen), 2); }).join('<br>') + '</div></div></div>' +
      '<label>Canales (% de las ventas)</label><div class="grid g3">' + Object.keys(VR_CAN).map(function (c) { return '<div><label class="muted">' + VR_CAN[c] + ' (margen ' + vrP(VV.informes.industria.canales[c].margen) + ', cobro ' + (VV.informes.industria.canales[c].diasCobro ? VV.informes.industria.canales[c].diasCobro + ' días' : 'al contado') + ')</label><input type="number" min="0" max="100" value="' + Math.round((d.mezcla[c] || 0) * 100) + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'' + base + 'mezcla.' + c + '\', Number(this.value) / 100, false, true)"></div>'; }).join('') + '</div></div>';
  });
  h += '<div class="card"><h2>Nota del equipo (opcional)</h2><textarea rows="3"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'nota\', this.value)">' + esc(DD.nota || '') + '</textarea></div>';
  return h;
}

// ---------- Estados financieros ----------
function VR_estados() {
  var H = VV.empresa.historial;
  if (!H.length) return VR_anio0(true);
  var cols = H.map(function (h) { return 'T' + h.t; });
  function fila(n, f, neg) { return '<tr><td>' + n + '</td>' + H.map(function (h) { var v = f(h); return '<td class="n">' + vrN(neg ? -v : v) + '</td>'; }).join('') + '</tr>'; }
  function cab() { return '<tr><th></th>' + cols.map(function (c) { return '<th class="n">' + c + '</th>'; }).join('') + '</tr>'; }
  var R = function (k) { return function (h) { return h.resultados[k] || 0; }; }, B = function (k) { return function (h) { return h.balance[k]; }; }, F = function (k) { return function (h) { return h.flujo[k]; }; }, C = function (k) { return function (h) { return h.costeoVariable[k]; }; };
  var h = '<div class="card"><h2>Estado de resultados (costeo por absorción, NIC 2)</h2><div class="scroll"><table>' + cab() +
    fila('Ventas', R('ventas')) + fila('Costo de ventas', R('costoVentas'), true) + fila('Capacidad no absorbida', R('capacidadNoAbsorbida'), true) + fila('Bajas por vencimiento', R('bajasVencimiento'), true) + fila('<b>Utilidad bruta</b>', R('utilidadBruta')) +
    fila('Distribución', R('distribucion'), true) + fila('Publicidad', R('publicidad'), true) + fila('Administración', R('administracion'), true) + fila('Fijos de productos nuevos', R('fijosProductosNuevos'), true) + fila('Depreciación de inversiones nuevas', R('depreciacionInversionesNuevas'), true) +
    fila('Innovación (comité, desarrollo, registro)', R('innovacion'), true) + fila('Investigación de mercados', R('investigacionMercados'), true) + fila('<b>Utilidad operativa</b>', R('utilidadOperativa')) + fila('Intereses', R('intereses'), true) + fila('Impuesto (IUE 25 %)', R('impuesto'), true) + fila('<b>Utilidad neta</b>', R('utilidadNeta')) + '</table></div></div>';
  h += '<div class="card"><h2>Balance general</h2><div class="scroll"><table>' + cab() + fila('Caja', B('caja')) + fila('Cuentas por cobrar', B('cxc')) + fila('Inventario', B('inventario')) + fila('Activo fijo neto', B('activoFijo')) + fila('<b>Total activo</b>', B('activo')) + fila('Cuentas por pagar', B('cxp')) + fila('Deuda financiera', B('deuda')) + fila('Capital', B('capital')) + fila('Resultados acumulados', B('resultadosAcumulados')) + fila('<b>Total pasivo y patrimonio</b>', function (x) { return x.balance.pasivo + x.balance.patrimonio; }) + '</table></div></div>';
  h += '<div class="card"><h2>Flujo de efectivo (método directo)</h2><div class="scroll"><table>' + cab() + fila('Cobros a clientes', F('cobros')) + fila('Pagos a proveedores', F('pagosProveedores'), true) + fila('Pagos de gastos', F('pagosGastos'), true) + fila('Intereses', F('intereses'), true) + fila('Impuesto', F('impuesto'), true) + fila('<b>Flujo operativo</b>', F('flujoOperativo')) + fila('Inversión (reposición y proyectos)', F('inversion'), true) + fila('Préstamo automático', F('prestamo')) + fila('<b>Variación de caja</b>', F('variacionCaja')) + '</table></div></div>';
  h += '<div class="card"><h2>Informe interno: costeo variable y conciliación</h2><div class="scroll"><table>' + cab() + fila('Margen de contribución', C('margenContribucion')) + fila('Costos fijos de fabricación del período', C('costosFijosFabricacion'), true) + fila('Utilidad operativa (costeo variable)', C('utilidadOperativa')) + fila('Utilidad operativa (absorción)', R('utilidadOperativa')) + fila('Diferencia: costos fijos que quedan en el inventario', C('conciliacion')) + '</table></div><p class="muted">Producir más de lo que se vende sube la utilidad por absorción porque parte de los costos fijos queda en el inventario; el costeo variable lo muestra.</p></div>';
  var u = H[H.length - 1], prods = Object.keys(u.operacion.porProducto);
  h += '<div class="card"><h2>Operación semana a semana del trimestre ' + u.t + '</h2>' + prods.map(function (id) {
    var r = u.operacion.porProducto[id];
    return '<h3>' + esc(VR_nomProd(id)) + '</h3><div class="scroll"><table><tr><th>Semana</th><th class="n">Producción</th><th class="n">Demanda</th><th class="n">Ventas</th><th class="n">Perdidas</th><th class="n">Vencido</th><th class="n">Inventario final</th></tr>' +
      r.semanas.map(function (w) { return '<tr><td>' + w.semana + '</td><td class="n">' + vrN(w.produccion) + '</td><td class="n">' + vrN(w.demanda) + '</td><td class="n">' + vrN(w.ventas) + '</td><td class="n">' + vrN(w.perdidas) + '</td><td class="n">' + vrN(w.vencido) + '</td><td class="n">' + vrN(w.inventarioLitros) + '</td></tr>'; }).join('') + '</table></div>';
  }).join('') + '</div>';
  return h + VR_anio0(false);
}
/** Estados del Año 0: punto de partida de todas las empresas. */
function VR_anio0(inicio) {
  var A = VV.empresa.anio0; if (!A) return '';
  var r = A.resultados, b = A.balance, q = 4;
  function f(n, v, neg, neg2) { return '<tr><td>' + n + '</td><td class="n">' + vrN(neg ? -v : v) + '</td><td class="n">' + vrN((neg ? -v : v) / q) + '</td></tr>'; }
  var h = (inicio ? '<div class="card"><p>Así terminó su empresa el <b>Año 0</b>, antes de que el comité empiece a decidir. Los estados de cada trimestre aparecerán aquí, a la par de estos, después de que el docente procese el trimestre 1.</p></div>' : '') +
    '<div class="card"><h2>Estado de resultados del Año 0</h2><p class="muted">Ventas de ' + vrN(A.litros) + ' litros a ' + vrBs(A.precioEmpresa, 2) + ' por litro (precio a la empresa). Costos y gastos con las proporciones del estado de resultados auditado de Leche Gloria S.A. 2024 aplicadas a sus ventas.</p><div class="scroll"><table><tr><th></th><th class="n">Año 0</th><th class="n">Promedio por trimestre</th></tr>' +
    f('Ventas', r.ventas) + f('Costo de ventas', r.costoVentas, true) + f('<b>Utilidad bruta</b>', r.utilidadBruta) +
    f('Distribución', r.distribucion, true) + f('Publicidad', r.publicidad, true) + f('Administración (incluye depreciación administrativa)', r.administracion, true) +
    f('<b>Utilidad operativa</b>', r.utilidadOperativa) + f('Intereses (8 % anual)', r.intereses, true) + f('Utilidad antes de impuesto', r.utilidadAntesImpuesto) + f('Impuesto (IUE 25 %)', r.impuesto, true) + f('<b>Utilidad neta</b>', r.utilidadNeta) + '</table></div></div>';
  var corr = b.caja + b.cxc + b.inventario, pas = b.cxp + b.deuda;
  h += '<div class="card"><h2>Balance general al cierre del Año 0</h2><div class="scroll"><table>' +
    '<tr><th colspan="2">Activo</th></tr>' + [['Caja', b.caja], ['Cuentas por cobrar', b.cxc], ['Inventario', b.inventario], ['<b>Activo corriente</b>', corr], ['Activo fijo neto', b.activoFijo], ['<b>Total activo</b>', b.activo]].map(function (x) { return '<tr><td>' + x[0] + '</td><td class="n">' + vrN(x[1]) + '</td></tr>'; }).join('') +
    '<tr><th colspan="2">Pasivo y patrimonio</th></tr>' + [['Cuentas por pagar a proveedores', b.cxp], ['Deuda financiera (8 % anual)', b.deuda], ['<b>Total pasivo</b>', pas], ['Capital', A.capital], ['Resultados acumulados', A.resultadosAcumulados], ['<b>Total patrimonio</b>', b.patrimonio], ['<b>Total pasivo y patrimonio</b>', pas + b.patrimonio]].map(function (x) { return '<tr><td>' + x[0] + '</td><td class="n">' + vrN(x[1]) + '</td></tr>'; }).join('') +
    '</table></div><p class="muted">Proporciones del balance auditado de Leche Gloria S.A. 2024 aplicadas a sus ventas (banco de datos, sección 11).</p></div>';
  return h;
}
function VR_tabla(f) { return '<div class="scroll"><table>' + f.map(function (x) { return '<tr><td>' + x[0] + '</td><td class="n">' + vrN(x[1]) + '</td></tr>'; }).join('') + '</table></div>'; }

// ===================== Docente: panel "Vida real" =====================
var VRP = null;
function VR_aPanel() { return '<div id="vrpanel"><div class="card"><p class="muted">Cargando…</p></div></div>'; }
function VR_cargarPanel() {
  call('apiAdmin', TOK, 'vrPanel', { simId: SIMID }).then(function (r) { VRP = r; $('vrpanel').innerHTML = VR_htmlPanel(r); }).catch(function (e) { $('vrpanel').innerHTML = '<div class="msg err">' + esc(e) + '</div>'; });
}
function VR_htmlPanel(r) {
  if (!r.equipos || !r.equipos.length) return '<div class="card"><p>Todavía no hay equipos registrados.</p></div>';
  var h = '<div class="card"><h2>Simulador vida real · estado de los equipos</h2><p class="muted">Trimestre ' + Math.min(r.t, r.horizonte) + ' de ' + r.horizonte + '. Indicadores de rendición de cuentas: resultado comercial (ventas de productos nuevos), retorno de la innovación y calidad del proceso (compuertas evaluadas).</p><div class="scroll"><table><tr><th>Equipo</th><th class="n">Ventas último trim.</th><th class="n">Utilidad neta</th><th class="n">Caja</th><th class="n">Ventas de productos nuevos</th><th class="n">Retorno</th><th class="n">Proceso</th><th>Productos</th><th>Proyectos</th></tr>' +
    r.equipos.map(function (e) {
      var i = e.indicadores || {};
      return '<tr><td>' + esc(e.nombre) + '</td><td class="n">' + (e.ventas === null ? '—' : vrN(e.ventas)) + '</td><td class="n">' + (e.utilidadNeta === null ? '—' : vrN(e.utilidadNeta)) + '</td><td class="n">' + vrN(e.caja) + '</td><td class="n">' + (e.indicadores ? vrP(i.vitalidad) : '—') + '</td><td class="n">' + (e.indicadores ? vrN(i.retorno, 2) : '—') + '</td><td class="n">' + (e.indicadores ? vrP(i.proceso) : '—') + '</td><td>' + esc(e.productos.join(', ')) + '</td><td>' +
        e.proyectos.map(function (p) { return esc(p.nombre) + ' (' + esc(p.clase || 'sin clase') + ', ' + esc(VR_EST[p.estado] || p.estado) + (p.c1 !== null ? ', C1 ' + (p.c1 ? '✅' : '❌') : '') + (p.c2 !== null ? ', C2 ' + (p.c2 ? '✅' : '❌') : '') + ')'; }).join('<br>') + '</td></tr>';
    }).join('') + '</table></div></div>';
  h += '<div class="card"><h2>Entorno y azar de la partida (solo docente)</h2><p>Leche cruda: Bs ' + vrN(r.precioLeche, 2) + ' por litro.</p>' +
    ((r.eventos || []).length ? '<p>Eventos ocurridos: ' + r.eventos.map(function (e) { return 'T' + e.trimestre + ' ' + esc(e.titulo); }).join('; ') + '.</p>' : '<p class="muted">Todavía no ocurrió ningún evento del calendario (la leche sube en el trimestre 7).</p>') +
    ((r.reacciones || []).length ? '<p>Cupesí respondió con más publicidad en: ' + r.reacciones.map(function (x) { return 'T' + x.trimestre + ' (+' + vrP(x.aumento) + ')'; }).join(', ') + '.</p>' : '<p class="muted">Cupesí todavía no respondió a ningún aumento de publicidad (lo hace con probabilidad 37 %; Steenkamp et al., 2005).</p>') +
    ((r.factores || []).length ? '<p>Productos lanzados: venta real frente a lo que mostró la prueba (1 = igual; Kahn, 2002): ' + r.factores.map(function (f) { return esc(f.nombre) + ': ' + f.productos.map(function (p) { return esc(p.nombre) + ' ×' + vrN(p.factorReal, 2); }).join(', '); }).join(' · ') + '.</p>' : '') + '</div>';
  var sol = [];
  r.equipos.forEach(function (e) { (e.solicitudes || []).forEach(function (s) { sol.push({ e: e, s: s }); }); });
  h += '<div class="card"><h2>Solicitudes de rubros y atributos nuevos (proyectos radicales)</h2>' + (sol.length ? '<div class="scroll"><table><tr><th>Equipo</th><th>Tipo</th><th>Nombre</th><th>Unidad</th><th>Para qué</th><th>Estado</th></tr>' + sol.map(function (x) { return '<tr><td>' + esc(x.e.nombre) + '</td><td>' + (x.s.tipo === 'atributo' ? 'Atributo' : 'Rubro') + '</td><td>' + esc(x.s.nombre) + '</td><td>' + esc(x.s.unidad) + '</td><td>' + esc(x.s.justificacion) + '</td><td>' + esc(x.s.estado) + (x.s.estado === 'pendiente' ? ' <button class="btn sec" onclick="VR_rechazar(\'' + esc(x.e.equipoId) + '\',\'' + esc(String(x.s.nombre).replace(/'/g, '')) + '\',\'' + (x.s.tipo === 'atributo' ? 'vrAtributo' : 'vrRubro') + '\')">Rechazar</button>' : '') + '</td></tr>'; }).join('') + '</table></div>' : '<p class="muted">No hay solicitudes.</p>') +
    '<h3>Incorporar un rubro al banco (para todos los equipos)</h3><div class="grid g4"><div><label>Nombre</label><input type="text" id="vrrn"></div><div><label>Unidad</label><input type="text" id="vrru" placeholder="kg, unidad, mes…"></div><div><label>Precio (Bs por unidad)</label><input type="number" id="vrrp" step="any"></div><div><label>Fuente verificable</label><input type="text" id="vrrf" placeholder="Cotización, página web, estudio…"></div></div>' +
    '<button class="btn" style="margin-top:8px" onclick="adm(\'vrRubro\',{nombre:$(\'vrrn\').value,unidad:$(\'vrru\').value,precio:$(\'vrrp\').value,fuente:$(\'vrrf\').value},false).then(VR_cargarPanel)">Incorporar al banco</button><p class="muted">El nombre debe coincidir con el de la solicitud para marcarla como atendida.</p>' +
    '<h3>Aprobar un atributo nuevo del producto (para todos los equipos)</h3><p class="muted">Solo con un estudio que dé la utilidad del atributo en cada segmento, en la misma escala de Brodock et al. (2021): el mensaje «premium» vale cerca de +20 y «polifenoles» cerca de −28.</p><div class="grid g4"><div><label>Nombre</label><input type="text" id="vran"></div><div><label>Utilidad · Natural</label><input type="number" id="vra1" step="any"></div><div><label>Utilidad · Cuida calorías</label><input type="number" id="vra2" step="any"></div><div><label>Utilidad · Promedio</label><input type="number" id="vra3" step="any"></div></div><div class="grid g2"><div><label>Estudio (fuente verificable)</label><input type="text" id="vraf"></div><div><label>Rubro de costo que exige (clave, opcional)</label><input type="text" id="vrar" placeholder="nuevo:…"></div></div>' +
    '<button class="btn" style="margin-top:8px" onclick="adm(\'vrAtributo\',{nombre:$(\'vran\').value,natural:$(\'vra1\').value,calorias:$(\'vra2\').value,promedio:$(\'vra3\').value,fuente:$(\'vraf\').value,rubro:$(\'vrar\').value},false).then(VR_cargarPanel)">Aprobar atributo</button>' +
    (Object.keys(r.atributosAprobados || {}).length ? '<h3>Atributos aprobados</h3><ul>' + Object.keys(r.atributosAprobados).map(function (k) { var a = r.atributosAprobados[k]; return '<li>' + esc(a.nombre) + ': natural ' + vrN(a.u.natural, 1) + ', calorías ' + vrN(a.u.calorias, 1) + ', promedio ' + vrN(a.u.promedio, 1) + ' · ' + esc(a.fuente) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  return h;
}
function VR_rechazar(equipoId, nombre, accion) {
  var m = prompt('Motivo del rechazo (lo verá el equipo):', ''); if (m === null) return;
  adm(accion || 'vrRubro', { equipoId: equipoId, nombre: nombre, rechazar: true, motivo: m }, false).then(VR_cargarPanel);
}
function VR_htmlRanking(r) {
  return '<p>Indicadores al cierre de T' + r.t + '. Puntaje (decisión del docente): resultado comercial 35 %, retorno 35 %, calidad del proceso 30 %, normalizados en la clase.</p><div class="scroll"><table><tr><th>#</th><th>Equipo</th><th class="n">Puntaje</th><th class="n">Ventas de productos nuevos (último año)</th><th class="n">Retorno de la innovación</th><th class="n">Proceso</th><th class="n">Utilidad acumulada</th><th class="n">Caja</th></tr>' +
    r.filas.map(function (d, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(d.nombre) + '</td><td class="n"><b>' + d.puntaje + '</b></td><td class="n">' + vrN(d.vitalidad, 1) + ' %</td><td class="n">' + vrN(d.retorno, 2) + '</td><td class="n">' + vrN(d.proceso, 1) + ' %</td><td class="n">' + vrN(d.utilidadAcum) + '</td><td class="n">' + vrN(d.caja) + '</td></tr>'; }).join('') + '</table></div>';
}
</script>

  <script>AX_inicio();</script>
