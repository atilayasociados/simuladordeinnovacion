function AX_confirmar(tit, txt, ok, fn) {

function AX_mostrarClave(tit, clave, nota) {

function AX_copiar(t) {
  function fb() { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); AX_toast('Copiado: ' + t); } catch (e) { AX_toast('Seleccione y copie: ' + t); } a.remove(); }
  try { navigator.clipboard.writeText(t).then(function () { AX_toast('Copiado: ' + t); }, fb); } catch (e) { fb(); }
}
function AX_eqApi(accion, datos) { datos = datos || {}; datos.simId = SIMID; return call('apiAXEquipos', TOK, accion, datos); }

function AX_csv() {
  var r = AXS.eq, filas = [['N', 'Equipo', 'Estado', 'Apellido paterno', 'Apellido materno', 'Nombres', 'Registro', 'Telefono']];
  r.equipos.forEach(function (e) { var est = (e.temporal ? 'contraseña temporal' : 'activo') + (e.bloqueado ? ' / edición bloqueada' : ''); e.integrantes.forEach(function (i) { filas.push([e.n, e.nombre, est, i.apPaterno, i.apMaterno, i.nombres, i.registro, i.celular]); }); if (!e.integrantes.length) filas.push([e.n, e.nombre, est, '', '', '', '', '']); });

function AX_aCuenta() { return '<div id="axCta"><div class="card"><p class="muted">Cargando…</p></div></div>'; }

  call('apiAXCuenta', TOK, 'ver').then(function (d) {
    AX_$('axCta').innerHTML = '<div class="card"><h2>Mi cuenta</h2><p><b>' + esc(d.nombre) + '</b> · ' + esc(d.email) + ' · ' + (d.rol === 'superadmin' ? 'Superadministrador' : 'Profesor') + '</p></div>' +

      '<div class="card"><h2>Pregunta de seguridad</h2><p class="muted">Sirve para recuperar la contraseña desde la pantalla de ingreso.' + (d.tieneRespuesta ? ' Pregunta actual: ' + esc(d.pregunta) : ' Aún no la configuró.') + '</p><div class="grid g4"><div><label for="axCp">Pregunta</label><input type="text" id="axCp" value="' + esc(d.pregunta) + '"></div><div><label for="axCr">Respuesta</label><input type="text" id="axCr"></div><div><label for="axCk">Contraseña actual</label><input type="password" id="axCk"></div></div><div style="margin-top:10px"><button class="btn" onclick="AX_ctaPreg()">Guardar pregunta</button></div></div>';

function AX_ctaClave() {
  var n = AX_$('axCn').value;

}
function AX_ctaPreg() { call('apiAXCuenta', TOK, 'pregunta', { pregunta: AX_$('axCp').value, respuesta: AX_$('axCr').value, clave: AX_$('axCk').value }).then(function (r) { AX_toast(r.mensaje); AX_cargarCuenta(); }).catch(function (e) { AX_toast(e, 'err'); }); }

function VR_iniciar(v) {

    comite: b && b.comite ? b.comite : JSON.parse(JSON.stringify(v.innov.comite || [])),
    proyectos: b && b.proyectos ? b.proyectos : JSON.parse(JSON.stringify(v.innov.proyectos || [])),
    solicitudes: b && b.solicitudes ? b.solicitudes : (v.innov.solicitudes || []).filter(function (s) { return s.estado === 'pendiente'; }),

  // los proyectos guardados en el servidor mandan sobre el borrador en lo ya ocurrido
  var srv = {}; (v.innov.proyectos || []).forEach(function (p) { srv[p.id] = p; });
  DD.proyectos.forEach(function (p) { var q = srv[p.id]; if (q) { p.resultados = q.resultados; p.estado = q.estado; p.c1Aprobada = q.c1Aprobada; p.c2Aprobada = q.c2Aprobada; } });
  (v.innov.proyectos || []).forEach(function (q) { if (!DD.proyectos.some(function (p) { return p.id === q.id; })) DD.proyectos.push(JSON.parse(JSON.stringify(q))); });
  v.empresa.productos.forEach(function (p) {
    if (!p.activo) return;
    // el simulador no pone ni repite valores: las casillas empiezan vacías y lo no escrito vale cero (decisión del docente, 24-nov-2026)
    if (!DD.comercial[p.id]) DD.comercial[p.id] = { precioEmpresa: '', mezcla: { supermercado: '', tienda: '', mercado: '' }, publicidad: '', produccionSemanal: '' };
  });

  VR_render(); VR_revisar();

}

// ---------- cada aviso, en el lugar donde se corrige ----------
var VR_ERRS = [];
function VR_errBox(l, pid) { return '<div class="vr-errs" data-l="' + l + '"' + (pid ? ' data-p="' + pid + '"' : '') + '></div>'; }
function VR_lugarError(t) {
  t = String(t || '');
  var low = t.toLowerCase(), cur = VPROY || (DD.proyectos[0] && DD.proyectos[0].id) || null;
  if (/^el comit|^integrante \d+:/.test(low) || /^el plan del año gasta/.test(low)) return { tab: 'comite', l: 'comite' };
  if (/queda sobreasignado/.test(low)) return { tab: 'proyectos', p: cur, l: 'gantt' };
  if (/^solo se puede comprar un estudio de consumidor/.test(low)) { var ids = t.match(/\bP\d+\b/g); return { tab: 'proyectos', p: ids ? ids[ids.length - 1] : cur, l: 'idea' }; }
  var pr = null; DD.proyectos.forEach(function (x) { var n = x.nombre || ''; if (n && (t.indexOf(n + ':') === 0 || t.indexOf(n + ' · ') === 0) && (!pr || n.length > pr.nombre.length)) pr = x; });
  if (pr) {
    var rest = t.slice(pr.nombre.length), et = rest.indexOf(' · ') === 0 ? rest.slice(3, rest.indexOf(':') > 0 ? rest.indexOf(':') : undefined).toLowerCase() : '';
    var l = 'idea';
    if (et) {
      if (/azúcar|grasa|proteína|tamaño|endulzante|conservación/.test(et)) l = 'producto';
      else if (/^fila/.test(et)) l = 'hoja';
      else if (/precio a la empresa|canales|publicidad|producción semanal/.test(et)) l = 'plan';
      else l = 'gantt';
    } else if (/compuerta|estudio del consumidor|prueba|desarrollo|lanzamiento|registro sanitario|actividad/.test(low)) l = 'gantt';
    else if (/muestra/.test(low)) l = 'producto';
    return { tab: 'proyectos', p: pr.id, l: l };
  }
  var pd = null; VV.empresa.productos.forEach(function (x) { var n = x.nombre || x.id; if (t.indexOf(n + ' · ') === 0 || t.indexOf(n + ':') === 0) pd = x; });
  if (pd) return { tab: /produc(ción|ir)|capacidad|inventario/i.test(t.replace(pd.nombre, '')) ? 'produccion' : 'marketing', l: 'prod-' + pd.id };
  return { tab: VTAB, l: '' };
}
function VR_pintarErrores() {
  var cajas = document.querySelectorAll('.vr-errs'); if (!cajas.length) return;
  var errs = VREV ? VREV.errores || [] : [];
  Array.prototype.forEach.call(cajas, function (c) {
    var l = c.getAttribute('data-l'), pid = c.getAttribute('data-p');
    var mios = errs.filter(function (e) { var u = VR_lugarError(e); return u.l === l && (!pid || u.p === pid); });
    c.innerHTML = mios.length ? '<div class="msg err"><b>Corrijan aquí:</b><br>' + mios.map(esc).join('<br>') + '</div>' : '';
  });
}
function VR_irError(n) {
  var e = VR_ERRS[n]; if (e === undefined) return;
  var u = VR_lugarError(e);
  if (u.p) VPROY = u.p;
  var m = VR_menuDe(u.tab); VTAB = u.tab; VR_ULT[m[0]] = u.tab; VR_render();
  var sel = '.vr-errs[data-l="' + u.l + '"]' + (u.p && u.l !== 'comite' ? '[data-p="' + u.p + '"]' : '');
  var box = u.l ? document.querySelector(sel) : null, card = box ? (box.closest('.card') || box) : null;
  if (card) { var nv = $('nav'), alto = nv ? nv.offsetHeight : 0; window.scrollTo({ top: card.getBoundingClientRect().top + window.pageYOffset - alto - 12, behavior: 'smooth' }); card.classList.add('sn-flash'); setTimeout(function () { card.classList.remove('sn-flash'); }, 2500); }
  else window.scrollTo(0, 0);
}
function VR_decision() {
  var d = JSON.parse(JSON.stringify(DD));
  d.proyectos.forEach(function (p) { delete p.resultados; delete p.c1Aprobada; delete p.c2Aprobada; delete p.lanzamientoPendiente; });
  return d;
}
function VR_revisar() {

    call('apiEstimar', TOK, VR_decision()).then(function (r) { VREV = r; VR_pie(); var h = $('vr-hoja'); if (h && VTAB === 'proyectos') h.innerHTML = VR_hojaResumen(VR_proy()); var c = $('vr-costos'); if (c) c.innerHTML = VR_costosHtml(); }).catch(function () { });

function VR_guardar(enviar) {
  if (enviar && !confirm('Una vez enviadas, las decisiones de este trimestre NO se pueden corregir. ¿Enviarlas ahora?')) return;

}

function VR_nomMercado(id) {

    h += '<tr><td>' + (i + 1) + '</td><td><input type="text" value="' + esc(m.nombre) + '"' + (ed ? '' : ' disabled') + ' onchange="VR_set(\'comite.' + i + '.nombre\', this.value)"></td>' +

  });
  h += '</table></div>' + (ed && DD.comite.length < 5 ? '<button class="btn sec" onclick="DD.comite.push({nombre:\'Integrante ' + (DD.comite.length + 1) + '\',cargo:\'profesional\',dedicacion:0.2});VR_render();VR_revisar()">Agregar integrante</button>' : '') + '</div>';

/** Cuánto del presupuesto anual se lleva el comité (decisión del docente, 17-nov-2026: se mantiene el 0,8 % y se avisa qué alcanza). */
function VR_comiteAlcance() {
  var S = VV.cat.sueldos, P = VV.empresa.presupuestoAnual || 0, anual = 0;
  DD.comite.forEach(function (m) { anual += (S[m.cargo] || 0) * (m.dedicacion || 0) * 12; });
  var pct = P > 0 ? anual / P : 0, exceso = anual > P;
  return '<div class="ayuda" style="margin-top:12px' + (exceso ? ';border-left-color:#FF4C00' : '') + '"><b>💡 En palabras sencillas</b>' +
    '<p>Su presupuesto de innovación de este año es <b>' + vrBs(P) + '</b> (0,8 % de las ventas del año anterior). Con la dedicación que pusieron, el comité cuesta <b>' + vrBs(anual) + ' al año</b>: el ' + vrP(pct) + ' del presupuesto.</p>' +
    '<p>Como referencia, a tiempo completo un profesional cuesta ' + vrBs(S.profesional * 12) + ' al año y un jefe ' + vrBs(S.jefe * 12) + '. Por eso en una empresa de este tamaño el comité trabaja a tiempo parcial. Lo que no usen en sueldos queda para desarrollo y registro sanitario; los estudios de mercado se pagan aparte, como gasto de ventas.</p>' +
    (exceso ? '<p><b>El comité cuesta más que todo el presupuesto del año:</b> bajen la dedicación o el número de personas.</p>' : '') + '</div>';
}

function SN_paso(t) { for (var i = 0; i < SN_PASOS.length; i++) if (SN_PASOS[i][0] === t) return i; return -1; }
function SN_nombre(t) { var n = t; VR_MENU.forEach(function (m) { m[2].forEach(function (x) { if (x[0] === t) n = x[1]; }); }); return n; }
function SN_hero(t) {
  var m = VR_menuDe(t), i = SN_paso(t);
  var jour = '<div class="sn-jour" role="navigation" aria-label="Recorrido del trimestre">' + VR_MENU.map(function (g, k) { return (k ? '<b aria-hidden="true"></b>' : '') + '<a href="#" class="' + (g[0] === m[0] ? 'cur' : '') + '"' + (g[0] === m[0] ? ' aria-current="step"' : '') + ' onclick="VR_ir(\'' + g[0] + '\');return false">' + SN_ico(SN_GICO[g[0]]) + esc(g[1]) + '</a>'; }).join('') + '</div>';
  return '<div class="sn-hero"><div class="pic">' + SN_ico(SN_SICO[t]) + '</div><div><small>' + esc(m[1]) + (i >= 0 ? ' · Paso ' + (i + 1) + ' de ' + SN_PASOS.length : '') + '</small><h2>' + esc(SN_nombre(t)) + '</h2>' + (i >= 0 ? '<p>' + esc(SN_PASOS[i][1]) + '</p>' : '') + '</div></div>';
}
function SN_siguiente(t) {
  var i = SN_paso(t); if (i < 0) return '';
  var x = SN_PASOS[i];
  return '<div class="sn-nxt"><span class="ic">' + SN_ico('compass') + '</span><div><small>Tu siguiente paso</small><b>' + esc(x[2]) + '</b><p>' + esc(x[3]) + '</p><button type="button" class="sn-btn" onclick="VR_ir(\'' + x[4] + '\')">Ir a ' + esc(VR_menuDe(x[4])[1]) + ' → ' + esc(SN_nombre(x[4])) + '</button></div></div>';
}
