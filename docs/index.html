  ['ojo', 'Una sola persona registra al equipo. Si otro integrante registra el mismo equipo otra vez, tendrán dos empresas distintas y se dividirá el trabajo. Antes de registrar, pónganse de acuerdo.'],
  ['h', 'Ingresar en cada clase'],
  ['pasos', ['Escriban el <b>nombre del equipo</b>, la <b>contraseña</b> y el <b>código de simulación</b>.',
    'En <b>¿Quién eres?</b> cada uno elige su propio nombre. Así sus ideas, votos y bitácoras quedan registrados a su nombre y el docente puede ver quién aportó.',
    'Al terminar, presionen <b>Salir</b> (arriba a la derecha), sobre todo en computadoras compartidas.']],
  ['p', 'La sesión dura 6 horas. Después de 5 intentos fallidos, el ingreso se bloquea por 15 minutos.'],
  ['h', 'Si olvidan la contraseña'],
  ['p', 'Pidan a su docente una <b>contraseña temporal</b>. Al ingresar con ella, el simulador les pedirá crear una nueva. El docente no puede ver su contraseña: solo puede reemplazarla.'],
  ['h', 'Mi equipo'],
  ['p', 'En <b>Situación → Mi equipo</b> ven a los integrantes, pueden agregar a uno que faltó en el registro y cambiar la contraseña del equipo.'],
  ['ir', [['Ir a Mi equipo', 'equipo']]]
]},
{ id: 'pantalla', t: 'Cómo se usa la pantalla', r: 'Menús, barra superior, pie con costos, guardar y enviar.', b: [
  ['h', 'Barra superior'],
  ['p', 'Muestra su nombre y su equipo, el trimestre en curso (por ejemplo, <i>Trimestre 3 de 20, año 1</i>), si el trimestre está <b>Abierto</b> o <b>Cerrado</b>, el <b>presupuesto de innovación</b> que les queda y el botón Salir.'],
  ['h', 'Los cuatro menús'],
  ['tabla', ['Menú', 'Para qué sirve'], [
    ['Situación', 'Dónde está su empresa: el caso, los indicadores actuales, el mercado y la competencia, y su equipo.'],
    ['Decidir', 'La hoja de decisiones del trimestre, en seis pasos y la evaluación de conceptos de otros equipos.'],
    ['Resultados', 'Qué pasó al procesar el trimestre: resumen, informes de investigación, evaluación de sus conceptos y estados financieros.'],
    ['Aprender', 'Este manual, los temas de innovación, el glosario y la bitácora del equipo.']]],
  ['h', 'El pie de la pantalla'],
  ['p', 'Mientras están en Decidir, abajo aparece una barra con el <b>costo estimado de innovación</b> de lo que van eligiendo, las <b>semanas-persona</b> que consumen sus proyectos y capacitaciones (tienen 12 por trimestre) y avisos en amarillo si algo falta o se pasan. Revísenla antes de enviar.'],
  ['h', 'Guardar y enviar'],
  ['lista', ['<b>Guardar borrador</b>: guarda lo que llevan. Cualquier integrante puede seguir desde otra computadora.',
    '<b>Enviar decisiones</b>: entrega las decisiones del trimestre. Pueden volver a enviar cuantas veces quieran mientras el trimestre esté abierto: <b>vale el último envío</b>.',
    '<b>Actualizar</b>: trae lo último que guardaron sus compañeros (por ejemplo, sus ideas o votos).']],
  ['ojo', 'Si dos integrantes editan la misma pantalla a la vez, cada uno guarda lo suyo y puede pisar al otro. Repártanse las pantallas o guarden y actualicen seguido.'],
  ['h', 'Dónde deciden'],
  ['p', 'Todo lo que el equipo escribe o elige tiene <b>fondo amarillo</b>: campos, listas, casillas y la caja de decisión de los proyectos. Las tareas de cada proyecto están en un recuadro de fondo amarillo claro con borde dorado. Lo que está en blanco o en celeste es información: léanla, pero no se edita.'],
  ['h', 'Ayudas dentro de cada pantalla'],
  ['p', 'Los recuadros celestes explican cada decisión. Sus enlaces <b>Aprender: unidad N</b> y <b>Glosario</b> llevan a la teoría. Arriba de cada pantalla hay un enlace a la sección de este manual que la explica.']
]},
{ id: 'caso', t: 'El caso y sus unidades', r: 'Producto, precios por litro, segmentos, competidores y finanzas.', b: [
  ['h', 'La empresa'],
  ['p', 'Todas las empresas del curso parten iguales: el mismo producto, el mismo presupuesto y la misma participación. Venden alrededor de Bs 2 millones por trimestre, tienen gastos fijos de Bs 500.000 por trimestre y ganan dinero, pero si no cambian nada sus ventas irán cayendo.'],
  ['h', 'Todo se mide en litros'],
  ['p', 'El mercado se cuenta en <b>litros</b> (unos 2 millones por trimestre). Los precios y costos del simulador están en <b>Bs por litro</b>, salvo cuando la pantalla dice "por unidad" (una botella o envase de un tamaño dado).'],
  ['ej', 'La leche saborizada de 1 litro se vende a <b>Bs 9 por litro</b>. Una botella de 330 ml (0,33 litros) que se vende a Bs 6,60 equivale a Bs 6,60 ÷ 0,33 = <b>Bs 20 por litro</b>.'],
  ['h', 'Litros y unidades (envases)'],
  ['p', 'En el negocio actual y en las decisiones de <b>5. Productos</b> todo va por litro. En los proyectos, desde Especificar, el precio y las ventas se escriben <b>por unidad</b> (un envase), porque así se vende; la pantalla muestra al lado a cuánto equivale por litro.'],
  ['tabla', ['Envase', 'Litros por unidad', 'Unidades por litro', 'De precio por unidad a precio por litro'], [
    ['200 ml', '0,2', '5', 'Precio por unidad × 5'],
    ['330 ml', '0,33', 'casi 3', 'Precio por unidad ÷ 0,33'],
    ['1 litro', '1', '1', 'Es el mismo']]],
  ['ej', 'Hoy la empresa vende unos <b>245.000 litros por trimestre</b> a Bs 9: cerca de Bs 2,2 millones. Si un proyecto vende 12.000 botellas de 330 ml, son 12.000 × 0,33 = <b>3.960 litros</b>.'],
  ['h', 'Los cinco segmentos'],
  ['tabla', ['Segmento', 'Tamaño', 'Suelen pagar por litro', 'Hoy'], [
    ['S1 Familias con niños', '45 %', 'Bs 10', 'Cliente tradicional, decrece'],
    ['S2 Universitarios', '15 %', 'Bs 24', 'Casi no lo atienden, crece'],
    ['S3 Oficinistas', '15 %', 'Bs 28', 'Casi no lo atienden'],
    ['S4 Deportistas y saludables', '10 %', 'Bs 32', 'Casi no lo atienden, crece rápido'],
    ['S5 Adultos mayores', '15 %', 'Bs 12', 'Cliente tradicional']]],
  ['p', 'Lo que cada segmento <b>valora</b> (sabor, nutrición, conveniencia, salud, sostenibilidad y precio) no se dice: descubrirlo con investigación es su primera tarea. El precio de la tabla es una referencia, no un tope: un producto que entrega lo que el segmento valora puede cobrar más.'],
  ['h', 'Los competidores del simulador'],
  ['lista', ['<b>Líder nacional</b>: la marca más grande, fuerte en familias y adultos mayores, con precio parecido al suyo. Si pierde clientes, baja su precio.',
    '<b>Marca regional</b>: precio bajo; copia lo que funciona.',
    '<b>Importados premium</b>: caros, saludables y prácticos; fuertes en oficinistas y deportistas.',
    '<b>Nuevos entrantes</b>: emprendimientos de bebidas vegetales que venden por aplicaciones. Vigílenlos.']],
  ['h', 'Dos bolsillos de dinero'],
  ['tabla', ['Bolsillo', 'Qué paga', 'Cuánto'], [
    ['Presupuesto de innovación', 'Investigación, proyectos, capacitación, tiempo libre, revisiones, respuestas al entorno', 'Bs 400.000 el primer año; después depende de sus resultados (entre Bs 250.000 y Bs 600.000)'],
    ['Caja de la empresa', 'Gastos comerciales (publicidad y promoción de productos), lanzamientos, inversiones, gastos fijos', 'Bs 400.000 al inicio; sube o baja con las utilidades']]],
  ['p', 'Al cierre de cada año el directorio fija el presupuesto siguiente según su índice de vitalidad y cuánto superaron a la empresa gemela. La mitad del presupuesto que no gastaron pasa al año siguiente.'],
  ['ojo', 'Si la caja se vuelve negativa, el banco da un préstamo de emergencia con interés alto (4 % por trimestre). Cuiden la caja.'],
  ['h', 'Semanas-persona'],
  ['p', 'Su equipo de innovación tiene <b>12 semanas-persona por trimestre</b> (una semana-persona es el trabajo de una persona durante una semana). Cada técnica de ideación, prueba de prototipo, piloto o capacitación consume semanas; los estudios de investigación no, porque los hace una consultora. Cada trimestre elaboran un <b>cronograma</b> en 4. Proyectos: estiman las semanas de cada actividad y en qué semanas la harán. El tiempo real varía (novedad del proyecto, iteraciones, madurez, capacitación) y, si supera lo que queda, la actividad no se ejecuta.']
]},
{ id: 'ronda', t: 'Una ronda paso a paso', r: 'La rutina de cada trimestre, de la lectura a la bitácora.', b: [
  ['p', 'Cada trimestre se juega igual. El docente <b>abre</b> el trimestre, ustedes deciden y envían, el docente <b>procesa</b> y ustedes reciben los resultados.'],
  ['pasos', ['<b>Leer la situación</b> (Situación → Situación actual): indicadores, avisos del trimestre y estado de sus proyectos.',
    '<b>Revisar lo que pasó</b> (Resultados → Resumen del trimestre) y <b>escribir qué decisión toman con cada informe</b> recibido (Resultados → Informes de investigación).',
    '<b>Abrir Decidir → Qué decidir en esta ronda</b>: es la lista de control del trimestre, con lo obligatorio y lo pendiente.',
    'Completar los pasos <b>1. Entorno</b>, <b>2. Estrategia anual</b> (solo al inicio de cada año), <b>3. Investigación</b>, <b>4. Proyectos</b> y <b>5. Productos</b>.',
    '<b>Evaluar a otros equipos</b> cuando haya conceptos asignados.',
    'Escribir la <b>6. Hipótesis</b> y <b>Enviar decisiones</b>.',
    'Cuando el docente procese el trimestre, leer los resultados y escribir la <b>bitácora</b> (Aprender → Mi bitácora).']],
  ['h', 'Lo que impide enviar'],
  ['lista', ['La hipótesis del trimestre con menos de 20 caracteres.',
    'Un informe de investigación del trimestre anterior sin la decisión que toman con él (al menos 10 caracteres).']],
  ['p', 'Lo demás no impide enviar, pero si falta (por ejemplo, la hipótesis anual o la justificación de un concepto), esa parte no se ejecuta y lo verán en "Qué pasó y por qué".'],
  ['idea', 'Repartan el trabajo: una persona en entorno e investigación, otra en proyectos, otra en productos y finanzas. Antes de enviar, revisen juntos la hipótesis y el pie de la pantalla.'],
  ['ir', [['Qué decidir en esta ronda', 'ronda']]]
]},
{ id: 'entorno', t: 'Paso 1. Entorno', r: 'Leer las señales del macro y del microentorno y decidir con qué herramientas responder.', b: [
  ['p', 'Cada trimestre llegan <b>señales</b> por dos vías: la <b>prensa</b> (gratis, la ven todos los equipos y a veces es rumor) y los <b>informes de su consultora</b> (lo que compraron en 3. Investigación). Cada señal indica su ámbito: <b>macroentorno</b> (político, económico, social, tecnológico, ecológico, legal) o <b>microentorno</b> (clientes, competidores, entrantes, sustitutos, proveedores).'],
  ['p', 'El simulador <b>no les dice qué hacer</b> ni cuál era la respuesta correcta: les entrega señales y les muestra lo que pasó. La misma señal puede ser una oportunidad para una empresa y una amenaza para otra (Jackson y Dutton, 1988).'],
  ['h', '1. Registrar cómo leen cada señal'],
  ['pasos', ['<b>¿Qué tan creíble es?</b> Real, dudosa o rumor (obligatorio).',
    '<b>¿Qué postura toman?</b> (obligatorio, respuesta graduada según la fuerza de la señal; Ansoff, 1975): <b>Ignorar</b> (no hacen nada), <b>Vigilar</b> (compran el estudio que la cubre para confirmarla), <b>Prepararse</b> (protegen a la empresa por dentro: contratos, reservas, ajustes) o <b>Actuar</b> (mueven el mercado: campaña, plan comercial, alianza, producto o precio).',
    'Si <b>vigilan</b>: elijan con qué estudio (la lista sugiere los que cubren ese ámbito) y márquenlo en 3. Investigación. Sin estudio no reciben información adicional.',
    'Si se <b>preparan</b> o <b>actúan</b>: indiquen qué significa para su empresa (oportunidad, amenaza o ambas), cuándo creen que llegará, qué impacto esperan, con qué decisión responden y por qué (una o dos frases).']],
  ['h', '2. Herramientas de la empresa'],
  ['p', 'Están disponibles <b>en cualquier trimestre</b>, haya o no una noticia. Se pagan con el <b>presupuesto operativo</b> (aparecen en el estado de resultados como "Otros gastos") y duran un tiempo. Renovar una herramienta vigente la extiende desde su vencimiento.'],
  ['tabla', ['Herramienta', 'Qué hace', 'Costo', 'Duración'], [
    ['Proveedor de leche de respaldo', 'Precio de la leche cruda pactado: si el precio de mercado sube, su costo no sube.', 'Bs 25.000', '4 trimestres'],
    ['Compra anticipada de envases importados', 'Envases al precio actual (incluye financiamiento y almacenaje): su costo de envase no sube.', 'Bs 100.000', '4 trimestres'],
    ['Rutas y distribución alternativas', 'Si se cortan las carreteras, recupera cerca del 70 % de las entregas perdidas.', 'Bs 45.000', '2 trimestres'],
    ['Adecuación de etiqueta y comunicación nutricional', 'Reduce a la mitad la pérdida de atractivo que cause una norma de etiquetado. Solo cuando existe una norma vigente o aprobada.', 'Bs 40.000', 'Permanente'],
    ['Plan comercial frente a un competidor', 'Mejora 5 % el atractivo de sus productos en el segmento elegido mientras compita allí un rival nuevo.', 'Bs 10.000', '2 trimestres'],
    ['Campaña anticipada de marca', 'Mejora 6 % el atractivo de sus productos en el segmento elegido.', 'Bs 10.000', '1 trimestre']]],
  ['p', '<b>Corporativas:</b> mientras opere un entrante (por ejemplo, una startup), pueden negociar una sola vez una <b>alianza</b> (Bs 60.000 de caja) o una <b>adquisición</b> (Bs 450.000 de caja). Si se abre una <b>licitación pública</b>, pueden postular mientras esté abierta (requisito: un producto con saludable 6 o más y nutrición 6 o más).'],
  ['idea', 'Ninguna herramienta conviene "por si acaso" todo el tiempo: sus costos están calibrados para que, en promedio, cubrirse siempre cueste lo mismo o más de lo que ahorra. Rinden a quien lee bien el entorno y contrata a tiempo.'],
  ['h', '3. Qué pasa después'],
  ['p', 'En Resultados → Resumen del trimestre verán los <b>hechos</b> y lo que tenían vigente. Por ejemplo: "La sequía elevó 8 % el precio de la leche cruda. Ustedes tenían vigente el proveedor de respaldo hasta T9: su costo de leche no subió." Si gastaron en un rumor, simplemente gastaron: nadie les dirá "acertaron" o "se equivocaron".'],
  ['p', 'Al trimestre siguiente, en <b>Su lectura del trimestre anterior</b>, verán si cada noticia se confirmó. Al cierre de cada año reciben el <b>informe de calibración</b>: compara lo que creyeron (credibilidad y plazo) con lo que ocurrió. Solo se verifica lo verificable; si era oportunidad o amenaza no se califica.'],
  ['ej', 'Señal (prensa): "Se amplía la brecha cambiaria y se retrasan las importaciones de envases." Creíble: real. Postura: prepararse. Para nosotros: amenaza (nuestros envases son importados). Plazo: 1 o 2 trimestres. Impacto: alto. Responden con: compra anticipada de envases. Por qué: si faltan divisas, subirá nuestro costo por litro.'],
  ['ir', [['Ir a 1. Entorno', 'entorno']]]
]},
{ id: 'anual', t: 'Paso 2. Estrategia anual', r: 'Cómo repartir el esfuerzo y gestionar el clima creativo.', b: [
  ['p', 'Se decide <b>al inicio de cada año</b> (T1, T5, T9, T13 y T17) y vale para los cuatro trimestres. Los demás trimestres la pantalla muestra la estrategia vigente.'],
  ['h', 'Bloque A. Estrategia y portafolio'],
  ['p', 'Son cuatro preguntas encadenadas, de lo general a lo operativo. Respóndanlas en este orden y cuiden que sean coherentes entre sí:'],
  ['pasos', ['<b>Postura</b> (Freeman y Soete, 1997): ¿cuál es nuestra actitud ante la innovación? Por ejemplo, ofensiva (ser los primeros) o imitativa (seguir a otros rápido).',
    '<b>Portafolio</b> (Nagji y Tuff, 2012): ¿dónde apostamos? Núcleo es mejorar lo actual, adyacente es llegar a clientes nuevos y transformacional es crear mercados nuevos.',
    '<b>4P</b> (Tidd y Bessant, 2021): ¿qué tipo de cambio hacemos? Puede ser en el producto, el proceso, la posición o el modelo de negocio.',
    "<b>Estructura</b> (O'Reilly y Tushman, 2004): ¿cómo nos organizamos para lograrlo? Integrados al negocio actual o con una unidad separada."]],
  ['ej', 'Coherente: postura ofensiva, 50 % núcleo / 35 % adyacente / 15 % transformacional, esfuerzo también en posición y modelo de negocio, y unidad autónoma. Incoherente: declararse ofensivos y poner 95 % en el núcleo.'],
  ['tabla', ['Decisión', 'Qué significa', 'Efecto'], [
    ['1. Postura', 'Ofensiva, defensiva, imitativa, dependiente, tradicional u oportunista.', 'El informe de coherencia revisa si actúan de acuerdo con ella.'],
    ['2. Portafolio (suman 100 %)', 'Núcleo: mejorar lo actual para clientes actuales. Adyacente: llevar lo que saben a clientes nuevos. Transformacional: crear mercados nuevos.', 'Con menos de 20 % en adyacente + transformacional no se pueden crear proyectos para S2, S3 o S4. En la Puerta, un proyecto puntúa mejor si su lugar en el portafolio recibe esfuerzo.'],
    ['3. 4P (suman 100 %)', 'Cuánto esfuerzo ponen en innovar el producto, el proceso, la posición (a quién y con qué mensaje) y el paradigma (modelo de negocio).', 'Cada ficha de concepto indica su tipo en las 4P: comparen al cierre del año si sus proyectos corresponden a esta distribución.'],
    ['4. Estructura', 'Integrada o unidad autónoma (Bs 40.000 por año).', 'La unidad autónoma protege los proyectos radicales y ayuda a responder a un disruptor.']]],
  ['h', 'Bloque B. Organización y clima creativo'],
  ['tabla', ['Decisión', 'Opciones', 'Efecto'], [
    ['Tiempo libre para proyectos propios', '0, 10, 15 o 20 % (Bs 750 por punto y trimestre)', 'Sube la motivación intrínseca y la calidad de las ideas.'],
    ['Incentivo', 'Reconocimiento (Bs 5.000/año), monetario bajo (Bs 15.000) o alto (Bs 40.000)', 'El reconocimiento refuerza la motivación; los premios altos pueden reducirla.'],
    ['Política ante el fracaso', 'Sanción, neutral o aprendizaje celebrado', 'El aprendizaje celebrado sube la autoeficacia y la seguridad psicológica.'],
    ['Composición de equipos', 'Homogénea, multifuncional o con externos', 'Más diversidad: ideas más variadas, malas y excepcionales.'],
    ['Umbral de la puerta', 'Estricto (7,0), moderado (6,0) o laxo (5,0)', 'Puntaje mínimo para que un proyecto pase al piloto.'],
    ['Capacitación en Design Thinking', 'Sí o no (Bs 25.000 y 2 semanas)', 'Sube la autoeficacia y la calidad de las ideas durante el año.']]],
  ['h', 'Bloque C. Contrato de investigación continua'],
  ['p', 'Estudios de <b>seguimiento</b> que la consultora entrega en forma periódica durante el año, con <b>15 % de descuento</b> por contrato anual. Se pagan con el presupuesto operativo (línea propia en el estado de resultados), no con el de innovación. Pueden ir en el contrato <b>todos los estudios</b>: A.1 Vigilancia (suscripción anual) y los demás una, dos o cuatro veces al año, con sus segmentos fijos todo el año. Los de seguimiento (A, C y D) se pagan con el presupuesto operativo. Los de clientes (B: encuesta, observación, usuarios extremos y usuarios líderes) se <b>reservan del presupuesto de innovación</b> al firmar. En usuarios líderes, en cada entrega eligen el proyecto activo que recibe los conceptos; si no tienen uno, la entrega se pierde.'],
  ['idea', 'El contrato no elimina la espera, la adelanta: si firman en el T1, la primera entrega llega al abrir el T2 y desde ahí cada trimestre pactado empieza con datos frescos. Es una decisión de compromiso (más barato, pero se paga aunque no lo usen) frente a flexibilidad (ad hoc, más caro por estudio, solo cuando lo necesitan).'],
  ['p', 'La empresa llega con un <b>contrato heredado</b>: C.1 Mercado cada trimestre (Bs 15.300 por trimestre, Bs 61.200 al año). Al inicio de cada año deciden mantenerlo, ampliarlo, reducirlo o cancelarlo. Antes, revisen el Año 0 en Resultados.'],
  ['h', 'Hipótesis anual (obligatoria)'],
  ['p', 'Escriban qué esperan lograr en el año y por qué esta estrategia los llevará ahí. Al cierre del año la contrastarán en la bitácora.'],
  ['ej', 'Con 30 % en adyacente y capacitación en Design Thinking lanzaremos un producto para universitarios antes de T8 y llegaremos a 5 % de cuota en S2.'],
  ['ir', [['Ir a 2. Estrategia anual', 'anual']]]
]},
{ id: 'investigacion', t: 'Paso 3. Investigación', r: 'El catálogo de la consultora: qué estudio elegir, cuánto cuesta y cómo usar el informe.', b: [
  ['p', 'Los estudios los hace una consultora. Los que encargan cada trimestre (<b>ad hoc</b>) se pagan con el presupuesto de innovación y <b>no consumen semanas-persona</b>. Pueden comprar todos los que quieran si les alcanza. Además reciben los estudios de su <b>contrato continuo</b> (ver Paso 2, Bloque C).'],
  ['p', 'El catálogo se ordena como el análisis externo (Aaker y Moorman, 2017; Porter, 1980): <b>A. Macroentorno</b>, <b>B. Clientes</b>, <b>C. Industria</b> y <b>D. Proveedores</b>. Cada estudio tiene una modalidad: <b>sindicado</b> (informe estándar que compran varias empresas, precio fijo), <b>a medida</b> (diseñado para ustedes; en los estudios por segmento el precio sube con cada segmento, de 1 a 5) o <b>suscripción</b> (pago único por 4 trimestres).'],
  ['tabla', ['Inciso', 'Estudio', 'Pregunta que responde', 'Modalidad', 'Costo'], [
    ['A.1', 'Vigilancia del entorno', '¿Qué noticias son reales y cuándo llegarán? Boletín durante 4 trimestres; las noticias llegan un trimestre antes.', 'Suscripción', 'Bs 22.000'],
    ['B.1', 'Encuesta', '¿Qué dicen valorar los clientes? Con margen de error; subestima lo que no dicen.', 'A medida', 'Bs 8.000 + 4.000 por segmento'],
    ['B.2', 'Observación etnográfica', '¿Qué hacen y qué necesitan sin decirlo? Persona, recorrido, mapa de empatía, necesidad latente.', 'A medida', 'Bs 15.000 por segmento'],
    ['B.3', 'Usuarios extremos', '¿Qué necesidad puede volverse común?', 'A medida', 'Bs 15.000'],
    ['B.4', 'Usuarios líderes (co-creación)', '¿Qué ideas proponen los clientes adelantados? 2 conceptos para un proyecto activo.', 'A medida', 'Bs 20.000'],
    ['C.1', 'Mercado', '¿Cuánto vende cada empresa y en qué segmentos? (un trimestre de retraso)', 'Sindicado', 'Bs 18.000'],
    ['C.2', 'Competidores actuales y potenciales', '¿Qué ofrece cada rival y quién se prepara para entrar o imitar?', 'Sindicado', 'Bs 14.000'],
    ['C.3', 'Posicionamiento de marcas', '¿Cómo nos perciben los clientes frente a los rivales? Mapa perceptual y curva de valor.', 'A medida', 'Bs 8.000 + 4.000 por segmento'],
    ['C.4', 'Sustitutos', '¿Qué alternativas a los lácteos ganan terreno?', 'Sindicado', 'Bs 10.000'],
    ['D.1', 'Proveedores', '¿Cómo evolucionarán la leche, los envases importados y el transporte?', 'Sindicado', 'Bs 10.000']]],
  ['p', 'Comprar todos los estudios con los 5 segmentos cuesta unos Bs 240.000 (60 % del presupuesto anual). Los precios son <b>didácticos</b>: en el mercado boliviano costarían cerca de tres veces más. Como referencia, las empresas latinoamericanas destinan entre 0,02 % y 0,4 % de sus ventas a investigación de mercados; la pantalla les muestra cuánto destinan ustedes.'],
  ['p', 'Un estudio que no puede hacerse (sin segmentos, o usuarios líderes sin proyecto) <b>no se compra ni se cobra</b>. El hallazgo principal de cada informe aparece también como señal en 1. Entorno.'],
  ['ojo', 'Los estudios se entregan <b>al trimestre siguiente</b> de la compra, y lo que revelan recién mejora sus proyectos desde ese trimestre. Si idean sin haber recibido estudios del segmento, estarían adivinando. Planifiquen: investigar primero (un trimestre) e idear después. Los conceptos de usuarios líderes también entran al proyecto al cerrar el trimestre en que los compran.'],
  ['h', 'Cómo leer un informe'],
  ['p', 'Todos los informes tienen la misma estructura: <b>pregunta</b>, <b>método y muestra</b>, <b>hallazgos</b>, <b>limitaciones</b> y <b>¿qué decisión tomamos con este dato?</b>. Ese último campo es obligatorio para enviar el trimestre siguiente.'],
  ['ej', 'Hallazgo: S2 dice valorar el precio, pero la observación muestra que no compra lácteos porque no los puede tomar con una mano en el micro. Decisión: creamos un proyecto para S2 centrado en conveniencia y fijamos un precio objetivo de Bs 20 por litro.'],
  ['idea', 'Comparen métodos sobre el mismo segmento (triangulación). Si la encuesta y la observación no coinciden, pesa más lo que el cliente hace que lo que dice. Pueden comprar todos los estudios a la vez, pero cuesten lo que cuesten salen del mismo presupuesto que los proyectos: liguen cada estudio a una decisión.'],
  ['ir', [['Ir a 3. Investigación', 'investigacion'], ['Ver mis informes', 'informes']]]
]},
{ id: 'proyectos', t: 'Paso 4. Proyectos: cómo funcionan', r: 'Las cinco fases, las decisiones en cada resultado, acelerar y detener, y el cronograma de semanas-persona.', b: [
  ['h', 'Cronograma de semanas-persona (cada trimestre)'],
  ['pasos', ['Elijan las tareas de sus proyectos (y la capacitación, si es inicio de año). Arriba aparece la tabla <b>Cronograma de semanas-persona de este trimestre</b> con cada actividad y su <b>rango de referencia</b>.', 'Para cada actividad escriban <b>su estimación</b> de semanas-persona y elijan la <b>semana de inicio y de fin</b> (1 a 12). Es obligatorio para enviar.', 'Revisen la fila <b>Carga por semana</b>: si una semana se pinta de rojo, pusieron demasiado trabajo en paralelo. Revisen también el total frente a las 12 disponibles y el máximo de la referencia.', 'Después de procesar, en Resultados → Resumen del trimestre verán <b>lo planificado frente a lo real</b> y qué actividad no se ejecutó por falta de tiempo.']],
  ['idea', 'Las personas suelen subestimar el tiempo de sus tareas (falacia de la planificación; Kahneman y Tversky, 1979). Dejen un margen. La tabla completa de tiempos de referencia está en 2. Estrategia anual → "Planificar el tiempo del equipo".'],
  ['p', 'Un proyecto lleva una necesidad del cliente hasta el mercado. Antes de los proyectos están el <b>Entorno</b> y la <b>Investigación</b>: ahí buscan señales y conocen al cliente. Después, cada proyecto recorre <b>cinco fases</b>, en el orden lógico que comparten Tidd y Bessant (2021), Brown (2019), Kelley y Kelley (2013), Sawyer y Henriksen (2024) y Amabile (1996). Todos aclaran que el orden no es obligatorio: se vuelve atrás cuando una prueba falla.'],
  ['tabla', ['Fase', 'Tareas del equipo', 'Lo que devuelve el simulador'], [
    ['1. Definir el reto', 'Elegir hallazgos de sus informes, escribir el insight, el trabajo por hacer, el reto “¿Cómo podríamos…?”, el encaje con la estrategia y el criterio de éxito.', 'Revisión del reto, aviso si no tienen estudios de contacto directo con el cliente y tipo de innovación.'],
    ['2. Idear', 'Abrir opciones (técnica, votación, ideas de afuera, fichas); fijar la regla de selección antes del test; comparar con la matriz de Pugh y elegir un concepto.', 'Devolución de cada ficha, propuestas externas, test de concepto y tipo real del concepto elegido.'],
    ['3. Prototipar y probar', 'Escribir la hipótesis y el criterio; diseñar el prototipo y probarlo con clientes simulados; iterar.', 'Informe de prueba con lo que hizo y dijo cada persona, frente a su criterio.'],
    ['4. Desarrollar y validar', 'Ficha técnica, caso de negocio, lienzo y pre-mortem para la Puerta; piloto en pocos puntos de venta con un límite de recompra fijado antes.', 'Costo real, acta del comité y resultados del piloto.'],
    ['5. Lanzar', 'Nombre, mensaje, precio, publicidad, canales; después, revisión del proyecto.', 'Resultados en el mercado, reacción de los rivales y revisión final.']]],
  ['h', 'Decidir en cada resultado'],
  ['p', 'Cuando llega un resultado (test de concepto, prueba de prototipo, acta de la Puerta o piloto), la tarjeta muestra una <b>caja de decisión</b> con su criterio fijado antes y el resultado. Eligen y explican por qué:'],
  ['tabla', ['Opción', 'Qué pasa'], [
    ['Seguir', 'Continúan en la fase: elegir el concepto, iterar o avanzar, volver a presentarse o lanzar.'],
    ['Cambiar la solución', 'Desde el test o el prototipo vuelven a Idear (conservan sus fichas); desde la Puerta o el piloto vuelven a Prototipar.'],
    ['Cambiar el segmento o el reto', 'Escriben el nuevo segmento, la evidencia, el insight y el reto. Vuelven a Idear: conservan las fichas, pero los tests, el concepto y los prototipos eran para el reto anterior y se descartan.'],
    ['Esperar', 'El proyecto no avanza ese trimestre y no consume semanas.'],
    ['Detener', 'Se cierra el proyecto. Lo invertido no se recupera.']]],
  ['p', 'Seguir cuando no se cumple su criterio, o cambiar cuando sí se cumple, es posible: queda registrado como “contra su criterio” con su explicación. El <b>registro de decisiones</b> aparece en la ficha del proyecto y en la revisión final. Cuando cambian de solución o de segmento, ese trimestre el proyecto solo cambia de rumbo; las tareas de la fase nueva empiezan el trimestre siguiente.'],
  ['p', 'Hoy el simulador procesa una fase por proyecto en cada trimestre. Sin acelerar, un proyecto tarda <b>unos 6 trimestres</b> desde que lo crean hasta que lo lanzan (menos si aceleran; más si necesitan varias versiones de prototipo, reiterar en la Puerta o cambiar de rumbo). Pueden tener hasta <b>3 proyectos activos</b> a la vez.'],
  ['h', 'Acelerar una fase'],
  ['p', 'Cuesta 50 % más en dinero y semanas y permite avanzar más rápido, pero se aprende menos (menos propuestas externas, test menos preciso, prototipo que rinde menos). Úsenlo cuando el tiempo importe más que la precisión.'],
  ['h', 'Detener un proyecto'],
  ['p', 'Detenerlo libera semanas. Lo ya invertido <b>no se recupera</b> y el comité no lo toma en cuenta: decidan mirando lo que falta invertir y lo que se espera ganar, no lo que ya gastaron.'],
  ['h', 'La ficha del proyecto'],
  ['p', 'En cada tarjeta, <b>Ver ficha completa</b> muestra todo el recorrido: reto, ideas, fichas, regla de selección, elección, informes de prueba, acta, piloto y el registro de decisiones. Es la memoria del proyecto y les servirá para la bitácora.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'definir', t: 'Fase 1. Definir el reto', r: 'De los hallazgos al insight y a un reto bien escrito.', b: [
  ['p', 'Se crea en <b>Decidir → 4. Proyectos → Nuevo proyecto</b>. El proyecto existe desde que el docente procesa el trimestre; sus tareas empiezan el trimestre siguiente.'],
  ['tabla', ['Campo', 'Qué escribir'], [
    ['Nombre y segmento', 'Un nombre de trabajo y el segmento al que sirve.'],
    ['Hallazgos', 'Uno o dos informes y una frase copiada de cada uno. Lo ideal es que al menos uno sea de <b>contacto directo</b> con el cliente: observación etnográfica o usuarios extremos.'],
    ['Insight', 'Qué descubrieron del cliente y por qué importa, con sus palabras (no la frase copiada).'],
    ['Trabajo por hacer', '<i>Cuando…</i> (la situación del cliente), <i>quiero…</i> (lo que busca), <i>para…</i> (el resultado que espera). Desde su vida, no desde el producto.'],
    ['Evidencia', 'El informe que respalda el insight y una frase copiada de él.'],
    ['Reto', 'Una pregunta que empiece con <b>¿Cómo podríamos…?</b>, que nombre al cliente y que no traiga la solución.'],
    ['Encaje con la estrategia', 'En una frase, cómo encaja el reto con su Estrategia anual y con lo que la empresa sabe hacer.'],
    ['Criterio de éxito', 'Una cifra y un plazo.'],
    ['Tecnología y modelo', '¿Necesita tecnología que hoy no tienen? ¿Cambia cómo venden o cobran?'],
    ['Portafolio', 'Núcleo, adyacente o transformacional.']]],
  ['p', 'Sintetizar es encontrar patrones en lo observado y darles sentido antes de buscar soluciones (Kelley y Kelley, 2013; Brown, 2019). Una encuesta informa qué dicen los clientes; empatizar exige ver qué hacen en su contexto.'],
  ['ej', 'Hallazgo (observación de S2): “Desayuno en el micro, con una sola mano libre.” Insight: comen en movimiento y con una mano; lo que no se pueda tomar así no les sirve. Cuando salgo a las 6:30 y no alcanzo a desayunar, quiero algo que me quite el hambre, para rendir en las clases de la mañana. Reto: ¿Cómo podríamos ayudar a los universitarios a alimentarse bien mientras se trasladan? Encaje: es adyacente; cabe en nuestra línea. Criterio: 8 % de S2 dos trimestres después del lanzamiento.'],
  ['p', 'Presionen <b>Revisar el brief</b>: el simulador marca qué está bien y qué mejorar, y les dice el <b>tipo de innovación</b> según sus respuestas: <b>rutinaria</b> (no cambia tecnología ni modelo), <b>disruptiva</b> (cambia el modelo), <b>radical</b> (cambia la tecnología) o <b>arquitectónica</b> (cambian ambos).'],
  ['ojo', 'Un reto que ya trae la solución ("¿Cómo podríamos vender una botella…?") cierra la búsqueda antes de empezar. Describan la necesidad.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'idear', t: 'Fase 2. Idear', r: 'Ideas individuales, votación, fichas de concepto e ideas de afuera.', b: [
  ['p', 'La tarea tiene cuatro pestañas dentro de la tarjeta del proyecto.'],
  ['h', '1. Mis ideas (individual)'],
  ['p', 'El equipo elige una técnica y <b>cada integrante</b> escribe sus ideas en su propio formulario. Nadie ve las ideas de los demás hasta que se abre la votación. Las ideas propias no cuestan dinero, solo semanas.'],
  ['tabla', ['Técnica', 'Cómo se usa', 'Semanas', 'Mínimo por persona', 'Conviene para'], [
    ['SCAMPER', 'Siete preguntas sobre su producto actual: sustituir, combinar, adaptar, modificar, poner otro uso, eliminar, reordenar.', '1', '4 ideas', 'Proyectos rutinarios'],
    ['Flor de loto', 'El reto al centro, ocho temas alrededor y varias ideas por tema.', '2', '6 ideas', 'Cualquier reto bien escrito'],
    ['Análisis morfológico', 'Seis parámetros (envase, base, sabor, lugar de venta, forma de pago, momento de consumo) con tres opciones cada uno; armar combinaciones.', '2', '2 combinaciones', 'Proyectos radicales o arquitectónicos']]],
  ['p', 'Guarden el borrador para que sus ideas queden registradas.'],
  ['h', '2. Votar en equipo'],
  ['p', 'Cuando todos escribieron, alguien presiona <b>Abrir la votación</b>. Las ideas aparecen mezcladas y sin autor. Cada integrante reparte <b>3 votos</b> (puede dar varios a una misma idea). Guarden y actualicen para ver los totales.'],
  ['h', '3. Fichas de concepto (hasta 3)'],
  ['lista', ['<b>Nombre</b> y <b>precio objetivo</b> en Bs por litro.',
    '<b>Concepto en una frase</b>: <i>Para [quién] que [necesidad], [producto] es [qué] que [beneficio], a diferencia de [alternativa].</i>',
    '<b>Qué mejora</b>: repartan exactamente <b>10 puntos</b> entre sabor, nutrición, conveniencia, salud, sostenibilidad y precio. Más puntos en un atributo lo hacen mejor, pero más difícil y caro de lograr.',
    '¿Tecnología nueva?, ¿cambia cómo venden o cobran?, y su tipo en las 4P.',
    '<b>Enviar al test de concepto</b> (Bs 5.000 por ficha): recomendable; sin test, la elección se hace casi a ciegas.']],
  ['h', 'Regla de selección (antes del test)'],
  ['p', 'Antes de ver el test fijen la <b>intención de compra mínima</b> que debe tener un concepto para elegirlo y, si quieren, otros criterios (deseable, factible, viable). Sin esta regla el test no se hace. Al elegir, el simulador compara el concepto elegido con su regla. Elegir entre ideas es difícil: sin criterios previos se tiende a lo conocido (Sawyer y Henriksen, 2024).'],
  ['h', 'Ideas de afuera (innovación abierta)'],
  ['tabla', ['Fuente', 'Costo', 'Semanas', 'Qué traen'], [
    ['Concurso abierto de ideas', 'Bs 8.000 + premio (bajo, medio o alto)', '2', 'Muchas propuestas variadas; varias poco viables. El premio medio suele rendir más.'],
    ['Intraemprendimiento', 'Bs 10.000', '3', 'Pocas propuestas de su personal, viables y a menudo de proceso.'],
    ['Reto con startups', 'Bs 20.000', '2', 'Pocas propuestas, a menudo con tecnología o modelo nuevos.']]],
  ['p', 'Las propuestas llegan al procesar el trimestre. Si una les sirve, usen <b>Pasar a ficha</b>.'],
  ['p', 'Con las fichas enviadas al test, el proyecto pasa a la segunda parte de Idear: comparar y elegir. Si no quieren testear, marquen <b>Pasar a Evaluar aunque no hagan el test</b>.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'evaluar', t: 'Fase 2 (cont.). Comparar y elegir un concepto', r: 'Leer el test de concepto, decidir frente a su regla, llenar la matriz de Pugh y elegir.', b: [
  ['p', 'Primero aparece la <b>caja de decisión</b> con su regla de selección y el mejor resultado del test. Decidan seguir (elegir un concepto), cambiar la solución (volver a idear), cambiar el segmento o el reto, esperar o detener.'],
  ['h', 'Lo que trae el test de concepto (por ficha)'],
  ['tabla', ['Dato', 'Cómo leerlo'], [
    ['Intención de compra declarada', 'Porcentaje que dice que seguro o probablemente la compraría. Está inflada: la compra real suele ser menor. Sirve para comparar conceptos entre sí.'],
    ['Rango de precio aceptable', 'Medidor de Van Westendorp: la zona verde va del precio en que empiezan a dudar de la calidad al precio en que les parece caro. La línea punteada es su precio objetivo.'],
    ['Clasificación de Kano', 'Básico (si falta, rechazan), de desempeño (más es mejor) o de entusiasmo (sorprende). Un concepto que no atiende un atributo básico del segmento tiene un problema.'],
    ['Lo que dijeron los clientes', 'Frases que explican el resultado.'],
    ['Calidad corregida', 'La calidad estimada con el test, de 1 a 9, con su margen de error.']]],
  ['h', 'Matriz de Pugh'],
  ['p', 'Comparen cada concepto con su <b>producto actual</b> (la referencia vale 0) en cinco criterios: ajuste con el cliente, viabilidad técnica, costo por unidad, novedad y ajuste estratégico. Pongan <b>+1</b> si es mejor, <b>0</b> si es igual y <b>−1</b> si es peor. La suma ordena los conceptos.'],
  ['ej', 'Concepto 1: ajuste +1 (64 % de intención, la más alta), viabilidad 0, costo −1 (botella más cara), novedad +1, estrategia +1. Suma +2.'],
  ['p', 'Si una marca contradice el test, el simulador les avisa con <b>revisar</b> (por ejemplo, +1 en ajuste a la ficha con menor intención, o +1 en costo con un precio fuera del rango aceptable). La matriz se llena con datos, no con gustos.'],
  ['h', 'Elegir'],
  ['lista', ['Escriban <b>por qué</b> eligen el concepto citando un dato del test (al menos 20 caracteres; sin esto la elección no se ejecuta).',
    'Pueden elegir un concepto, <b>combinar dos</b> (suma sus puntos fuertes y exige una versión más de prototipo), todavía no elegir, o <b>volver a Idear</b>.']],
  ['p', 'Al elegir, el simulador compara el tipo que declararon con el <b>tipo real</b> del concepto y les dice cuántas <b>versiones de prototipo</b> necesitarán antes de la Puerta: 1 para rutinarios y disruptivos, 2 o 3 para radicales y 3 para arquitectónicos (más si combinan o si concentran muchos puntos en un atributo).'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'prototipar', t: 'Fase 3. Prototipar y probar', r: 'Escribir la hipótesis, diseñar el prototipo y aprender de la prueba con clientes simulados.', b: [
  ['p', 'Prototipar es dar forma a la idea para <b>aprender cómo la usa el cliente</b>. Ustedes diseñan el prototipo (pueden construirlo en clase); el simulador lo pone en manos de clientes simulados del segmento y les devuelve lo que hicieron y dijeron.'],
  ['h', '1. Qué queremos aprender'],
  ['p', 'Elijan el <b>supuesto más riesgoso</b>: que puedan abrirlo y tomarlo solos (uso), que entiendan cómo se usa sin explicación (comprensión) o que encaje en su rutina diaria (rutina). Escriban la <b>pregunta</b> que el prototipo debe responder.'],
  ['ej', '¿Pueden abrirlo con una mano y sin explicación, en menos de 30 segundos?'],
  ['p', 'Antes de probar escriban su <b>hipótesis</b> (“Creemos que…”) y su <b>criterio</b>: cuántas personas, de las que prueban, deben lograrlo para seguir. Sin ellos el prototipo no se prueba. Así la prueba sirve para decidir y no solo para confirmar lo que ya pensaban (Christensen, 1997).'],
  ['ej', 'Creemos que los universitarios lo abrirán con una mano, sin ayuda, en el micro. Criterio: al menos 6 de 8.'],
  ['h', '2. Diseñar el prototipo'],
  ['tabla', ['Formato', 'Qué puede comprobar'], [
    ['Maqueta física', 'Uso, comprensión y rutina (los clientes la tocan y la usan).'],
    ['Envase falso', 'Solo comprensión (se mira pero no se abre).'],
    ['Guion gráfico', 'Solo rutina (viñetas del día del cliente).']]],
  ['ojo', 'Si el formato no puede comprobar el supuesto elegido, la versión solo trae opiniones y no mejora el producto. El simulador se los advierte en rojo.'],
  ['p', 'Elijan las características: cómo se abre, cómo se ve la forma de abrir, tamaño del envase (200 ml, 330 ml o 1 litro) y si se puede volver a cerrar. Describan el prototipo en dos líneas y, si quieren, peguen el enlace a una foto del que construyeron.'],
  ['h', '3. Prueba con clientes simulados'],
  ['tabla', ['Personas', 'Costo', 'Semanas'], [['5', 'Bs 6.000', '1'], ['8', 'Bs 8.000', '1'], ['12', 'Bs 11.000', '2']]],
  ['p', 'Elijan también dónde se prueba (en casa, en el lugar de consumo o en la tienda). Con pocas personas aparecen la mayoría de los problemas, pero el resultado varía más.'],
  ['h', 'El informe de prueba'],
  ['p', 'Muestra a cada persona: quién es, si lo logró sola, con ayuda o no pudo, cuántos segundos tardó y qué hizo o dijo. Debajo, la <b>malla receptora de información</b> ordena lo observado en cuatro cuadrantes: lo que gustó, críticas, preguntas e ideas nuevas. Al final, una conclusión sobre el supuesto.'],
  ['h', 'Siguiente paso'],
  ['lista', ['<b>Iterar</b>: escriban qué aprendieron con la versión anterior y qué cambian, y prueben una nueva versión.',
    '<b>Avanzar a Especificar y Puerta</b>: cuando el supuesto quedó confirmado y tienen las versiones exigidas.',
    '<b>Volver a Evaluar</b>: si la idea no funciona y quieren elegir otro concepto ya probado.']],
  ['p', 'Después de cada prueba, la caja de decisión compara su criterio con el resultado y registra su decisión.'],
  ['idea', 'Cambien una o dos características por versión, guiándose por la malla. Si cambian todo a la vez, no sabrán qué funcionó.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'especificar', t: 'Fase 4. Desarrollar y validar: especificar y la Puerta', r: 'Ficha técnica, caso de negocio, lienzo, pre-mortem y acta del comité.', b: [
  ['p', 'Especificar es definir cómo se fabricará el producto y cuánto costará. La Puerta es el comité que, con esa información, decide si se autoriza el piloto. Lo que viene del prototipo (tamaño y forma de abrir) queda fijo.'],
  ['h', '1. Ficha técnica'],
  ['p', 'Elijan envase, base líquida, azúcar, conservación (pasteurizada, 12 días; UHT, 90 días), etiqueta y producción (línea actual, máquina nueva con inversión de Bs 60.000 o maquila). La pantalla calcula el <b>costo por unidad</b> y por litro, la vida útil y cuántas unidades pueden producir por trimestre.'],
  ['tabla', ['Producción', 'Capacidad por trimestre', 'En botellas de 330 ml'], [['Línea actual', '30.000 litros', 'unas 90.900'], ['Máquina nueva (Bs 60.000)', '75.000 litros', 'unas 227.000'], ['Maquila tercerizada', '50.000 litros', 'unas 151.500']]],
  ['h', '2. Caso de negocio'],
  ['p', 'Escriban el <b>precio al público por unidad</b>, las <b>unidades que esperan vender por trimestre</b> y la <b>publicidad</b>. La pantalla calcula el margen por unidad, la utilidad por trimestre, la inversión que falta y en cuántos trimestres se recupera.'],
  ['p', 'La <b>clase de referencia</b> muestra cuánto vendieron otros lanzamientos en su primer trimestre (la mediana y el rango donde caen 8 de cada 10). Si su pronóstico supera a 9 de cada 10, el simulador se los advierte: es un pronóstico optimista.'],
  ['h', '3. Lienzo del modelo de negocio'],
  ['p', 'El segmento, la propuesta de valor, los costos y los ingresos se llenan solos. Ustedes eligen socios clave, actividades clave, recursos clave, relación con el cliente y canales. Si venden por app propia o por suscripción, <b>cambia el modelo de negocio</b> y con él el tipo de innovación.'],
  ['h', '4. Pre-mortem'],
  ['p', 'Imaginen que dentro de un año el producto fracasó. Elijan las <b>2 causas más probables</b> y escriban cómo las evitarían.'],
  ['h', 'Lo que pasa al procesar'],
  ['p', 'La planta piloto produce un lote y revela el <b>costo real</b> (Bs 8.000 y 2 semanas). El comité emite un <b>acta</b> con cinco criterios de 1 a 9:'],
