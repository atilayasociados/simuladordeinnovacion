# Publica la Edge Function "taller" (taller práctico «Inteligencia Artificial»). Independiente del simulador de innovación:
# sus datos viven en el esquema "taller" y no toca la función "api".
name: Publicar función del taller
on:
  push:
    branches: [taller-ia]
    paths:
      - 'supabase/functions/taller/**'
      - '.github/workflows/desplegar-taller.yml'
  workflow_dispatch:
concurrency:
  group: desplegar-taller
  cancel-in-progress: false
jobs:
  desplegar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROYECTO: xlkjssypdayyaxwjokry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar función taller
        run: npx -y supabase@latest functions deploy taller --project-ref "$PROYECTO" --no-verify-jwt --use-api --yes
      - name: Probar la función
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            r=$(curl -s -X POST "https://$PROYECTO.supabase.co/functions/v1/taller" -H 'Content-Type: application/json' -d '{"fn":"iniciar","args":[]}')
            echo "$r"
            if echo "$r" | grep -q '"r":'; then break; fi
            if [ $i = 6 ]; then exit 1; fi
          done
          echo "$r" | grep -q 'Estatuto-Organico-UAGRM-2024.pdf'
          curl -s -o /dev/null -D cabeceras.txt -X OPTIONS "https://$PROYECTO.supabase.co/functions/v1/taller" -H 'Origin: https://atilayasociados.github.io'
          grep -qi 'access-control-allow-origin' cabeceras.txt
