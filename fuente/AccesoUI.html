<style>

.ax-ok{color:var(--ax-accent2);font-size:12.5px;margin:6px 0 0;font-weight:600}.ax-bad{color:#ff7272;font-size:12.5px;margin:6px 0 0;font-weight:600}

.ax-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ax-inth{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px}
.ax-inth b{font:700 12px var(--ax-mono);letter-spacing:1.5px;color:var(--ax-accent2)}
.ax-add{background:none;border:1px solid var(--ax-accent2);color:var(--ax-accent2);border-radius:8px;padding:5px 10px;font:600 12px var(--ax-sans);cursor:pointer}

.ax-fila .ax-n{grid-column:1/-1;font:700 11px var(--ax-mono);color:var(--ax-text3);letter-spacing:1px}
.ax-x{position:absolute;top:6px;right:8px;background:none;border:0;color:#ff8a8a;font-size:15px;cursor:pointer}

.ax-pick:hover{border-color:var(--ax-accent2)}
.ax-foot{color:var(--ax-text2);font-size:11.5px;text-align:center;max-width:560px;opacity:.9}
@media (max-height:900px){.ax-wrap{padding:12px 12px 10px;gap:8px}.ax-card{padding:20px 28px}.ax-logos{margin-bottom:8px;gap:10px}.ax-logo{width:58px;height:58px;padding:6px}.ax-title{font-size:16px;letter-spacing:2px;white-space:nowrap}.ax-sub2{margin:2px 0 10px}.ax-card h2{margin:0 0 6px}.ax-card label{margin:8px 0 4px}}

<div id="ax" role="main" aria-live="polite"></div>
<script>
// ===================== Acceso v2.3 (cliente) =====================
var AXS = { logos: [], manual: '', inv: null, pend: null, reg: null, eq: null, doc: null };
var AX_PIE = 'UAGRM - Ingeniería Comercial – COM505T Innovación – Profesor Jhonny David Atila Lijerón';
function AX_$(id) { return document.getElementById(id); }
function AX_inicio() {
  document.body.classList.add('ax-on');
  AX_$('ax').innerHTML = AX_marco('<p class="ax-center" style="color:#a8c0d8">Cargando…</p>');
  call('apiAXInicio', (typeof AX_INV !== 'undefined' && AX_INV) || '').then(function (r) {
    AXS.logos = r.logos || []; AXS.manual = r.manual || ''; AXS.inv = r.invitacion;
    AX_mostrar(AXS.inv ? 'alta' : 'ingresar');
  }).catch(function (e) { AX_mostrar('ingresar'); AX_err(e); });
}
function AX_cab() {
  var lg = [0, 1, 2].map(function (i) { var s = AXS.logos[i]; var alt = ['UAGRM', 'Ciencias Económicas', 'Ingeniería Comercial'][i]; return '<div class="ax-logo">' + (s ? '<img src="' + s + '" alt="Logo ' + alt + '">' : '<span>' + alt + '</span>') + '</div>'; }).join('');
  return '<div class="ax-logos">' + lg + '</div><div class="ax-title">Simulador de Innovación</div><div class="ax-sub">Innovación</div><div class="ax-sub2">Empresas que compiten en un mismo mercado · 20 trimestres de decisiones</div>';
}
function AX_marco(cuerpo, ancho) {
  return '<div class="ax-wrap"><div class="ax-card' + (ancho ? ' ax-wide' : '') + '">' + AX_cab() + cuerpo + '</div><div class="ax-foot">' + esc(AX_PIE) + '</div></div>';
}
function AX_pw(id, ph, ac) { return '<div class="ax-pw"><input class="ax-in" type="password" id="' + id + '" placeholder="' + esc(ph || '') + '" autocomplete="' + (ac || 'current-password') + '"><button type="button" class="ax-eye" aria-label="Mostrar u ocultar la contraseña" onclick="AX_ojo(\'' + id + '\')">👁</button></div>'; }
function AX_ojo(id) { var e = AX_$(id); e.type = e.type === 'password' ? 'text' : 'password'; }
function AX_err(m) { var e = AX_$('axErr'); if (e) { e.className = 'ax-err'; e.textContent = m || ''; } }
function AX_info(m) { var e = AX_$('axErr'); if (e) { e.className = 'ax-info'; e.textContent = m || ''; } }
function AX_busy(btn, on, txt) { if (!btn) return; if (on) { btn.dataset.t = btn.textContent; btn.textContent = 'Procesando…'; btn.disabled = true; } else { btn.textContent = txt || btn.dataset.t || btn.textContent; btn.disabled = false; } }
function AX_enter(ev, fn) { if (ev.key === 'Enter') { ev.preventDefault(); fn(); } }
function AX_cerrar() { document.body.classList.remove('ax-on'); AX_$('ax').innerHTML = ''; }

function AX_mostrar(modo, msg) {
  document.body.classList.add('ax-on');
  var h = '', ancho = false;
  if (modo === 'ingresar') {
    h = '<h2>Ingresar</h2><label for="axU">Nombre de equipo · Correo del profesor</label><input class="ax-in" id="axU" autocomplete="username" oninput="AX_codVis()" onkeydown="AX_enter(event,AX_ingresar)">' +
      '<label for="axP">Contraseña</label>' + AX_pw('axP', '') +
      '<div id="axCodBox"><label for="axC">Código de simulación</label><input class="ax-in ax-code" id="axC" placeholder="INN-XXXX" autocomplete="off" oninput="this.value=this.value.toUpperCase()" onkeydown="AX_enter(event,AX_ingresar)"><p class="ax-hint">📌 Te lo da tu docente. Los docentes no lo necesitan.</p></div>' +
      '<button class="ax-btn" id="axGo" onclick="AX_ingresar()">Ingresar →</button><div id="axErr" class="ax-err"></div>' +
      '<p class="ax-center"><button class="ax-link" onclick="AX_mostrar(\'recuperar\')">¿Olvidaste tu contraseña?</button></p>' +
      '<div class="ax-div">¿Primera vez?</div><button class="ax-ghost" onclick="AX_mostrar(\'registro\')">Registrar mi equipo</button>' +
      (AXS.manual ? '<a class="ax-ghost" href="' + esc(AXS.manual) + '" target="_blank" rel="noopener">📘 Ver Manual del Estudiante</a>' : '');
  } else if (modo === 'registro') {
    ancho = true; AXS.reg = { ok: false, max: 5 };
    h = '<h2>Registrar mi equipo</h2><label for="axRn">Nombre del equipo o empresa</label><input class="ax-in" id="axRn" maxlength="40" placeholder="Ejemplo: Lácteos Andinos">' +
      '<p class="ax-hint">📌 Es el nombre con el que ingresarán y competirán.</p>' +
      '<div class="ax-2col"><div><label for="axRp">Contraseña</label>' + AX_pw('axRp', 'Mínimo 4 caracteres', 'new-password') + '</div><div><label for="axRp2">Confirmar contraseña</label>' + AX_pw('axRp2', '', 'new-password') + '</div></div>' +
      '<label for="axRc">Código de simulación</label><input class="ax-in ax-code" id="axRc" placeholder="INN-XXXX" autocomplete="off" oninput="this.value=this.value.toUpperCase();AX_validarCod()"><div id="axRcm"></div>' +
      '<div class="ax-inth"><b>INTEGRANTES DEL EQUIPO</b><button class="ax-add" id="axAdd" onclick="AX_fila()">+ Agregar integrante</button></div><div id="axFilas"></div>' +
      '<p class="ax-hint">📌 El número de registro es obligatorio; el teléfono es opcional.</p>' +
      '<div class="ax-warn">⚠ Guarda bien tu contraseña — la necesitarás en cada ronda.</div>' +
      '<button class="ax-green" id="axGo" onclick="AX_registrar()">✓ Registrar Equipo</button><div id="axErr" class="ax-err"></div>' +
      '<button class="ax-back" onclick="AX_mostrar(\'ingresar\')">← Volver</button>';
  } else if (modo === 'recuperar') {
    h = '<h2>Recuperar contraseña</h2><div class="ax-warn">Equipos: pedí a tu docente una contraseña temporal. Con ella ingresas y el sistema te pedirá crear una nueva.</div>' +
      '<label for="axRe">Docentes: tu correo</label><input class="ax-in" id="axRe" type="email" autocomplete="username" onkeydown="AX_enter(event,AX_verPregunta)"><button class="ax-btn" id="axGoP" onclick="AX_verPregunta()">Ver mi pregunta de seguridad</button>' +
      '<div id="axPreg"></div><div id="axErr" class="ax-err"></div><button class="ax-back" onclick="AX_mostrar(\'ingresar\')">← Volver</button>';
  } else if (modo === 'cambiar') {
    var min = AXS.pend && AXS.pend.tipo === 'docente' ? 6 : 4;
    h = '<h2>Crea tu contraseña</h2><p class="ax-hint" style="text-align:center">📌 Ingresaste con una contraseña temporal. Crea una nueva para continuar (mínimo ' + min + ' caracteres).</p>' +
      '<label for="axN1">Contraseña nueva</label>' + AX_pw('axN1', '', 'new-password') + '<label for="axN2">Confirmar contraseña nueva</label>' + AX_pw('axN2', '', 'new-password') +
      '<button class="ax-btn" id="axGo" onclick="AX_cambiarTemp()">Guardar y continuar →</button><div id="axErr" class="ax-err"></div><button class="ax-back" onclick="AX_mostrar(\'ingresar\')">← Volver</button>';
  } else if (modo === 'quien') {
    var P = AXS.pend || {};
    h = '<h2>¿Quién eres?</h2><p class="ax-hint" style="text-align:center">📌 ' + esc(P.equipo || 'Tu equipo') + ': elige tu nombre para que tus aportes queden registrados a tu nombre.</p>' +

  var k = ['apPaterno', 'apMaterno', 'nombres', 'registro', 'celular'], id = e.equipoId;
  var h = '<div class="inline"><label for="axEn_' + id + '">Nombre del equipo</label><input type="text" id="axEn_' + id + '" value="' + esc(e.nombre) + '" style="max-width:260px"><button class="btn sec" onclick="AX_renombrar(\'' + id + '\')">Corregir nombre</button></div>' +
    '<div class="scroll" style="margin-top:8px"><table><tr><th>Apellido paterno</th><th>Apellido materno</th><th>Nombres</th><th>Registro</th><th>Teléfono</th><th></th></tr>' +
    e.integrantes.map(function (i, n) { return '<tr>' + k.map(function (c) { return '<td><input type="text" id="axI_' + id + '_' + c + '_' + n + '" value="' + esc(i[c]) + '"></td>'; }).join('') + '<td><div class="inline"><button class="btn sec" onclick="AX_intEditar(\'' + id + '\',' + n + ',\'' + esc(i.registro) + '\')">Guardar</button><button class="btn sec" onclick="AX_intQuitar(\'' + id + '\',\'' + esc(i.registro) + '\')">Quitar</button></div></td></tr>'; }).join('') + '</table></div>';
  if (e.integrantes.length < s.maxIntegrantes) h += '<div class="grid g4" style="margin-top:8px">' + [['apPaterno', 'Apellido paterno'], ['apMaterno', 'Apellido materno'], ['nombres', 'Nombres'], ['registro', 'Registro'], ['celular', 'Teléfono (opcional)']].map(function (f) { return '<div><label>' + f[1] + '</label><input type="text" id="axIA_' + id + '_' + f[0] + '"></div>'; }).join('') + '</div><button class="btn sec" style="margin-top:6px" onclick="AX_intAgregar(\'' + id + '\')">+ Agregar integrante</button>';
  return h;
}
function AX_detalle(id) { var r = AX_$('axDet_' + id); r.style.display = r.style.display === 'none' ? '' : 'none'; }
function AX_recargarEq(m) { if (m) AX_toast(m); AX_cargarEquipos(); }
function AX_renombrar(id) { AX_eqApi('renombrar', { equipoId: id, nombre: AX_$('axEn_' + id).value }).then(function (r) { AX_recargarEq(r.mensaje); }).catch(function (e) { AX_toast(e, 'err'); }); }
function AX_claveEq(id) {
  var e = AXS.eq.equipos.filter(function (x) { return x.equipoId === id; })[0];
  AX_confirmar('Contraseña temporal', 'Se generará una contraseña temporal para ' + e.nombre + '. La actual dejará de funcionar y el equipo deberá crear una nueva al ingresar.', 'Generar', function () {
    AX_eqApi('claveTemporal', { equipoId: id }).then(function (r) { AX_mostrarClave('Equipo ' + r.equipo, r.clave, 'Entréguela en persona o por mensaje directo. No se volverá a mostrar.'); AX_cargarEquipos(); }).catch(function (x) { AX_toast(x, 'err'); });
  });
}
function AX_ocultarTemp(id) { AX_eqApi('ocultarTemp', { equipoId: id }).then(function () { AX_recargarEq('La contraseña temporal inicial ya no se mostrará.'); }).catch(function (e) { AX_toast(e, 'err'); }); }
function AX_bloq(id, v) { AX_eqApi('bloquear', { equipoId: id, valor: v }).then(function (r) { AX_recargarEq(r.mensaje); }).catch(function (e) { AX_toast(e, 'err'); }); }
function AX_elimEq(id) {
  var e = AXS.eq.equipos.filter(function (x) { return x.equipoId === id; })[0];
  AX_confirmar('Eliminar equipo', '¿Eliminar el equipo "' + e.nombre + '" y sus ' + e.integrantes.length + ' integrantes? Esta acción no se puede deshacer.', 'Eliminar', function () {
    AX_eqApi('eliminar', { equipoId: id }).then(function (r) { AX_recargarEq(r.mensaje); }).catch(function (x) { AX_toast(x, 'err'); });
  });
}
function AX_intDatos(pre) { var o = {}; ['apPaterno', 'apMaterno', 'nombres', 'registro', 'celular'].forEach(function (k) { o[k] = AX_$(pre(k)).value; }); return o; }
function AX_intEditar(id, n, reg) { var o = AX_intDatos(function (k) { return 'axI_' + id + '_' + k + '_' + n; }); o.equipoId = id; o.registroOriginal = reg; AX_eqApi('intEditar', o).then(function (r) { AX_recargarEq(r.mensaje); }).catch(function (e) { AX_toast(e, 'err'); }); }
function AX_intQuitar(id, reg) { AX_confirmar('Quitar integrante', '¿Quitar al integrante ' + reg + ' de este equipo?', 'Quitar', function () { AX_eqApi('intQuitar', { equipoId: id, registro: reg }).then(function (r) { AX_recargarEq(r.mensaje); }).catch(function (e) { AX_toast(e, 'err'); }); }); }
function AX_intAgregar(id) { var o = AX_intDatos(function (k) { return 'axIA_' + id + '_' + k; }); o.equipoId = id; AX_eqApi('intAgregar', o).then(function (r) { AX_recargarEq(r.mensaje); }).catch(function (e) { AX_toast(e, 'err'); }); }
function AX_csv() {
  var r = AXS.eq, filas = [['N', 'Equipo', 'Estado', 'Apellido paterno', 'Apellido materno', 'Nombres', 'Registro', 'Telefono']];
  r.equipos.forEach(function (e) { var est = (e.temporal ? 'contraseña temporal' : 'activo') + (e.bloqueado ? ' / edición bloqueada' : ''); e.integrantes.forEach(function (i) { filas.push([e.n, e.nombre, est, i.apPaterno, i.apMaterno, i.nombres, i.registro, i.celular]); }); if (!e.integrantes.length) filas.push([e.n, e.nombre, est, '', '', '', '', '']); });
  var csv = '﻿' + filas.map(function (f) { return f.map(function (c) { c = String(c === undefined ? '' : c); return /[",;\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
  var nom = 'equipos_' + (r.sim.sigla || r.sim.simId) + '.csv';
  try { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = nom; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { }
  var d = AX_modal('<h3>Exportar CSV</h3><p class="muted" style="color:#a8c0d8">Si la descarga no empezó (por ejemplo, dentro de Google Sites), copie este texto y péguelo en una hoja de cálculo.</p><textarea style="width:100%;min-height:160px" readonly>' + esc(csv.slice(1)) + '</textarea><div class="inline"><button class="btn sec" id="axCsvC">Copiar</button><button class="btn" id="axCsvOk">Cerrar</button></div>');
  d.querySelector('#axCsvC').onclick = function () { AX_copiar(csv.slice(1)); };
  d.querySelector('#axCsvOk').onclick = function () { d.remove(); };
}

// ---------- panel docente: Docentes (superadmin) ----------
function AX_aDocentes() { return '<div id="axDoc"><div class="card"><p class="muted">Cargando docentes…</p></div></div>'; }
function AX_cargarDocentes() { call('apiAXDocentes', TOK, 'listar').then(function (r) { AXS.doc = r; AX_pintarDocentes(); }).catch(function (e) { AX_toast(e, 'err'); }); }
function AX_pintarDocentes() {
  var r = AXS.doc;
  var h = '<div class="card"><h2>Docentes</h2><div class="scroll"><table><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Pregunta de seguridad</th><th>Acciones</th></tr>' + r.docentes.map(function (d) {
    return '<tr><td>' + esc(d.nombre) + '</td><td>' + esc(d.email) + '</td><td>' + (d.rol === 'superadmin' ? 'Superadministrador' : 'Profesor') + '</td><td>' + (d.activo ? '<span class="tag ok">activo</span>' : '<span class="tag mal">inactivo</span>') + (d.temporal ? ' <span class="tag aviso">contraseña temporal</span>' : '') + '</td><td>' + (d.tieneRespuesta ? esc(d.pregunta) : '<span class="tag aviso">sin configurar</span>') + '</td><td><div class="inline">' +
      '<button class="btn sec" onclick="AX_docPreg(\'' + d.docenteId + '\')">Pregunta</button><button class="btn sec" onclick="AX_docClave(\'' + d.docenteId + '\')">Contraseña temporal</button>' + (d.rol !== 'superadmin' ? '<button class="btn sec" onclick="AX_docApi(\'activo\',{docenteId:\'' + d.docenteId + '\',valor:' + (d.activo ? 'false' : 'true') + '})">' + (d.activo ? 'Desactivar' : 'Activar') + '</button>' : '') + '</div></td></tr>';
  }).join('') + '</table></div></div>';
  h += '<div class="card"><h2>Invitar a un docente</h2><p class="muted">El enlace sirve una sola vez y vence en 72 horas. El docente define su nombre, correo y contraseña, y responde la pregunta de seguridad que usted escriba aquí.</p><div class="grid g2"><div><label for="axIp">Pregunta de seguridad</label><input type="text" id="axIp" placeholder="Ejemplo: ¿En qué ciudad hizo su maestría?"></div><div><label for="axIr">Rol</label><select id="axIr"><option value="profesor">Profesor (solo ve sus simulaciones)</option><option value="superadmin">Superadministrador (ve todo)</option></select></div></div><div style="margin-top:10px"><button class="btn ax-verde" onclick="AX_invitar()">Generar enlace de invitación</button></div><div id="axInvL"></div></div>';
  h += '<div class="card"><h2>Invitaciones recientes</h2>' + (r.invitaciones.length ? '<div class="scroll"><table><tr><th>Código</th><th>Rol</th><th>Pregunta</th><th>Vence</th><th>Estado</th><th></th></tr>' + r.invitaciones.map(function (i) { return '<tr><td>' + esc(i.invId) + '</td><td>' + esc(i.rol) + '</td><td>' + esc(i.pregunta) + '</td><td>' + esc(i.vence ? new Date(i.vence).toLocaleString('es-BO') : '') + '</td><td>' + esc(i.estado) + '</td><td>' + (i.estado === 'pendiente' ? '<button class="btn sec" onclick="AX_docApi(\'anularInvitacion\',{invId:\'' + i.invId + '\'})">Anular</button>' : '') + '</td></tr>'; }).join('') + '</table></div>' : '<p class="muted">Sin invitaciones.</p>') + '</div>';
  AX_$('axDoc').innerHTML = h;
}
function AX_docApi(a, d) { return call('apiAXDocentes', TOK, a, d).then(function (r) { if (r.mensaje) AX_toast(r.mensaje); AX_cargarDocentes(); return r; }).catch(function (e) { AX_toast(e, 'err'); }); }
function AX_invitar() {
  call('apiAXDocentes', TOK, 'invitar', { pregunta: AX_$('axIp').value, rol: AX_$('axIr').value }).then(function (r) {
    AX_toast(r.mensaje);
    var cont = AX_$('axInvL');
    AX_cargarDocentes();
    setTimeout(function () { var c = AX_$('axInvL'); if (c) c.innerHTML = '<div class="calc" style="margin-top:10px;word-break:break-all"><b>Enlace de invitación:</b><br><span style="font-family:Space Mono,monospace">' + esc(r.enlace) + '</span><br><button class="btn sec" style="margin-top:6px" onclick="AX_copiar(\'' + esc(r.enlace) + '\')">Copiar enlace</button></div>'; }, 700);
  }).catch(function (e) { AX_toast(e, 'err'); });
}
function AX_docPreg(id) {
  var d = AXS.doc.docentes.filter(function (x) { return x.docenteId === id; })[0];
  var m = AX_modal('<h3>Pregunta de seguridad</h3><p>' + esc(d.nombre) + '</p><label>Pregunta</label><input type="text" id="axMp" value="' + esc(d.pregunta) + '"><label>Respuesta</label><input type="text" id="axMr"><div class="inline"><button class="btn sec" id="axMNo">Cancelar</button><button class="btn" id="axMSi">Guardar</button></div>');
  m.querySelector('#axMNo').onclick = function () { m.remove(); };
  m.querySelector('#axMSi').onclick = function () { var p = m.querySelector('#axMp').value, r = m.querySelector('#axMr').value; m.remove(); AX_docApi('pregunta', { docenteId: id, pregunta: p, respuesta: r }); };
}
function AX_docClave(id) {
  var d = AXS.doc.docentes.filter(function (x) { return x.docenteId === id; })[0];
  AX_confirmar('Contraseña temporal', 'Se generará una contraseña temporal para ' + d.nombre + '. Deberá cambiarla al ingresar.', 'Generar', function () {
    call('apiAXDocentes', TOK, 'claveTemporal', { docenteId: id }).then(function (r) { AX_mostrarClave(d.nombre, r.clave, 'Entréguela por un medio privado. No se volverá a mostrar.'); AX_cargarDocentes(); }).catch(function (e) { AX_toast(e, 'err'); });
  });
}

// ---------- panel docente: Mi cuenta ----------
function AX_aCuenta() { return '<div id="axCta"><div class="card"><p class="muted">Cargando…</p></div></div>'; }
function AX_cargarCuenta() {
  call('apiAXCuenta', TOK, 'ver').then(function (d) {
    AX_$('axCta').innerHTML = '<div class="card"><h2>Mi cuenta</h2><p><b>' + esc(d.nombre) + '</b> · ' + esc(d.email) + ' · ' + (d.rol === 'superadmin' ? 'Superadministrador' : 'Profesor') + '</p></div>' +
      '<div class="card"><h2>Cambiar mi contraseña</h2><div class="grid g4"><div><label for="axCa">Contraseña actual</label><input type="password" id="axCa"></div><div><label for="axCn">Nueva (mínimo 6)</label><input type="password" id="axCn"></div><div><label for="axCc">Confirmar nueva</label><input type="password" id="axCc"></div></div><div style="margin-top:10px"><button class="btn" onclick="AX_ctaClave()">Cambiar contraseña</button></div></div>' +
      '<div class="card"><h2>Pregunta de seguridad</h2><p class="muted">Sirve para recuperar la contraseña desde la pantalla de ingreso.' + (d.tieneRespuesta ? ' Pregunta actual: ' + esc(d.pregunta) : ' Aún no la configuró.') + '</p><div class="grid g4"><div><label for="axCp">Pregunta</label><input type="text" id="axCp" value="' + esc(d.pregunta) + '"></div><div><label for="axCr">Respuesta</label><input type="text" id="axCr"></div><div><label for="axCk">Contraseña actual</label><input type="password" id="axCk"></div></div><div style="margin-top:10px"><button class="btn" onclick="AX_ctaPreg()">Guardar pregunta</button></div></div>';
  }).catch(function (e) { AX_toast(e, 'err'); });
}
function AX_ctaClave() {
  var n = AX_$('axCn').value;
  if (n.length < 6) { AX_toast('La contraseña nueva debe tener al menos 6 caracteres.', 'err'); return; }
  if (n !== AX_$('axCc').value) { AX_toast('Las contraseñas no coinciden.', 'err'); return; }
  call('apiAXCambiarClave', TOK, AX_$('axCa').value, n).then(function () { AX_toast('Contraseña cambiada.'); AX_cargarCuenta(); }).catch(function (e) { AX_toast(e, 'err'); });
}
function AX_ctaPreg() { call('apiAXCuenta', TOK, 'pregunta', { pregunta: AX_$('axCp').value, respuesta: AX_$('axCr').value, clave: AX_$('axCk').value }).then(function (r) { AX_toast(r.mensaje); AX_cargarCuenta(); }).catch(function (e) { AX_toast(e, 'err'); }); }
</script>
