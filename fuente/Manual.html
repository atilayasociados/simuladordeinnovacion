    ['Tecnología y modelo', '¿Necesita tecnología que hoy no tienen? ¿Cambia cómo venden o cobran?'],
    ['Portafolio', 'Núcleo, adyacente o transformacional.']]],
  ['ej', 'Cuando salgo a las 6:30 y no alcanzo a desayunar, quiero algo que me quite el hambre, para rendir en las clases de la mañana. Reto: ¿Cómo podríamos ofrecer a los universitarios un desayuno que se tome con una mano en el micro? Criterio: 8 % de S2 dos trimestres después del lanzamiento.'],
  ['p', 'Presionen <b>Revisar el brief</b>: el simulador marca qué está bien y qué mejorar, y les dice el <b>tipo de innovación</b> según sus respuestas: <b>rutinaria</b> (no cambia tecnología ni modelo), <b>disruptiva</b> (cambia el modelo), <b>radical</b> (cambia la tecnología) o <b>arquitectónica</b> (cambian ambos).'],
  ['ojo', 'Un reto que ya trae la solución ("¿Cómo podríamos vender una botella…?") cierra la búsqueda antes de empezar. Describan la necesidad.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'idear', t: 'Fase 2. Idear', r: 'Ideas individuales, votación, fichas de concepto e ideas de afuera.', b: [
  ['p', 'La tarea tiene cuatro pestañas dentro de la tarjeta del proyecto.'],
  ['h', '1. Mis ideas (individual)'],
  ['p', 'El equipo elige una técnica y <b>cada integrante</b> escribe sus ideas en su propio formulario. Nadie ve las ideas de los demás hasta que se abre la votación. Las ideas propias no cuestan dinero, solo semanas.'],
  ['tabla', ['Técnica', 'Cómo se usa', 'Semanas', 'Mínimo por persona', 'Conviene para'], [
    ['SCAMPER', 'Siete preguntas sobre su producto actual: sustituir, combinar, adaptar, modificar, poner otro uso, eliminar, reordenar.', '1', '4 ideas', 'Proyectos rutinarios'],
    ['Flor de loto', 'El reto al centro, ocho temas alrededor y varias ideas por tema.', '2', '6 ideas', 'Cualquier reto bien escrito'],
    ['Análisis morfológico', 'Seis parámetros (envase, base, sabor, lugar de venta, forma de pago, momento de consumo) con tres opciones cada uno; armar combinaciones.', '2', '2 combinaciones', 'Proyectos radicales o arquitectónicos']]],
  ['p', 'Guarden el borrador para que sus ideas queden registradas.'],
  ['h', '2. Votar en equipo'],
  ['p', 'Cuando todos escribieron, alguien presiona <b>Abrir la votación</b>. Las ideas aparecen mezcladas y sin autor. Cada integrante reparte <b>3 votos</b> (puede dar varios a una misma idea). Guarden y actualicen para ver los totales.'],
  ['h', '3. Fichas de concepto (hasta 3)'],
  ['lista', ['<b>Nombre</b> y <b>precio objetivo</b> en Bs por porción.',
    '<b>Concepto en una frase</b>: <i>Para [quién] que [necesidad], [producto] es [qué] que [beneficio], a diferencia de [alternativa].</i>',
    '<b>Qué mejora</b>: repartan exactamente <b>10 puntos</b> entre sabor, nutrición, conveniencia, salud, sostenibilidad y precio. Más puntos en un atributo lo hacen mejor, pero más difícil y caro de lograr.',
    '¿Tecnología nueva?, ¿cambia cómo venden o cobran?, y su tipo en las 4P.',
    '<b>Enviar al test de concepto</b> (Bs 5.000 por ficha): recomendable; sin test, la fase Evaluar decide casi a ciegas.']],
  ['h', 'Ideas de afuera (innovación abierta)'],
  ['tabla', ['Fuente', 'Costo', 'Semanas', 'Qué traen'], [
    ['Concurso abierto de ideas', 'Bs 8.000 + premio (bajo, medio o alto)', '2', 'Muchas propuestas variadas; varias poco viables. El premio medio suele rendir más.'],
    ['Intraemprendimiento', 'Bs 10.000', '3', 'Pocas propuestas de su personal, viables y a menudo de proceso.'],
    ['Reto con startups', 'Bs 20.000', '2', 'Pocas propuestas, a menudo con tecnología o modelo nuevos.']]],
  ['p', 'Las propuestas llegan al procesar el trimestre. Si una les sirve, usen <b>Pasar a ficha</b>.'],
  ['p', 'El proyecto pasa a Evaluar con las fichas enviadas al test. Si no quieren testear, marquen <b>Pasar a Evaluar aunque no hagan el test</b>.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'evaluar', t: 'Fase 3. Evaluar', r: 'Leer el test de concepto, llenar la matriz de Pugh y elegir.', b: [
  ['h', 'Lo que trae el test de concepto (por ficha)'],
  ['tabla', ['Dato', 'Cómo leerlo'], [
    ['Intención de compra declarada', 'Porcentaje que dice que seguro o probablemente la compraría. Está inflada: la compra real suele ser menor. Sirve para comparar conceptos entre sí.'],
    ['Rango de precio aceptable', 'Medidor de Van Westendorp: la zona verde va del precio en que empiezan a dudar de la calidad al precio en que les parece caro. La línea punteada es su precio objetivo.'],
    ['Clasificación de Kano', 'Básico (si falta, rechazan), de desempeño (más es mejor) o de entusiasmo (sorprende). Un concepto que no atiende un atributo básico del segmento tiene un problema.'],
    ['Lo que dijeron los clientes', 'Frases que explican el resultado.'],
    ['Calidad corregida', 'La calidad estimada con el test, de 1 a 9, con su margen de error.']]],
  ['h', 'Matriz de Pugh'],
  ['p', 'Comparen cada concepto con su <b>producto actual</b> (la referencia vale 0) en cinco criterios: ajuste con el cliente, viabilidad técnica, costo por unidad, novedad y ajuste estratégico. Pongan <b>+1</b> si es mejor, <b>0</b> si es igual y <b>−1</b> si es peor. La suma ordena los conceptos.'],
  ['ej', 'Concepto 1: ajuste +1 (64 % de intención, la más alta), viabilidad 0, costo −1 (botella más cara), novedad +1, estrategia +1. Suma +2.'],
  ['p', 'Si una marca contradice el test, el simulador les avisa con <b>revisar</b> (por ejemplo, +1 en ajuste a la ficha con menor intención, o +1 en costo con un precio fuera del rango aceptable). La matriz se llena con datos, no con gustos.'],
  ['h', 'Elegir'],
  ['lista', ['Escriban <b>por qué</b> eligen el concepto citando un dato del test (al menos 20 caracteres; sin esto la elección no se ejecuta).',
    'Pueden elegir un concepto, <b>combinar dos</b> (suma sus puntos fuertes y exige una versión más de prototipo), todavía no elegir, o <b>volver a Idear</b>.']],
  ['p', 'Al elegir, el simulador compara el tipo que declararon con el <b>tipo real</b> del concepto y les dice cuántas <b>versiones de prototipo</b> necesitarán antes de la Puerta: 1 para rutinarios y disruptivos, 2 o 3 para radicales y 3 para arquitectónicos (más si combinan o si concentran muchos puntos en un atributo).'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'prototipar', t: 'Fase 4. Prototipar', r: 'Diseñar el prototipo y aprender de la prueba con clientes simulados.', b: [
  ['p', 'Prototipar es dar forma a la idea para <b>aprender cómo la usa el cliente</b>. Ustedes diseñan el prototipo (pueden construirlo en clase); el simulador lo pone en manos de clientes simulados del segmento y les devuelve lo que hicieron y dijeron.'],
  ['h', '1. Qué queremos aprender'],
  ['p', 'Elijan el <b>supuesto más riesgoso</b>: que puedan abrirlo y tomarlo solos (uso), que entiendan cómo se usa sin explicación (comprensión) o que encaje en su rutina diaria (rutina). Escriban la <b>pregunta</b> que el prototipo debe responder.'],
  ['ej', '¿Pueden abrirlo con una mano y sin explicación, en menos de 30 segundos?'],
  ['h', '2. Diseñar el prototipo'],
  ['tabla', ['Formato', 'Qué puede comprobar'], [
    ['Maqueta física', 'Uso, comprensión y rutina (los clientes la tocan y la usan).'],
    ['Envase falso', 'Solo comprensión (se mira pero no se abre).'],
    ['Guion gráfico', 'Solo rutina (viñetas del día del cliente).']]],
  ['ojo', 'Si el formato no puede comprobar el supuesto elegido, la versión solo trae opiniones y no mejora el producto. El simulador se los advierte en rojo.'],
  ['p', 'Elijan las características: cómo se abre, cómo se ve la forma de abrir, tamaño de la porción (200 ml, 330 ml o 1 litro) y si se puede volver a cerrar. Describan el prototipo en dos líneas y, si quieren, peguen el enlace a una foto del que construyeron.'],
  ['h', '3. Prueba con clientes simulados'],
  ['tabla', ['Personas', 'Costo', 'Semanas'], [['5', 'Bs 6.000', '1'], ['8', 'Bs 8.000', '1'], ['12', 'Bs 11.000', '2']]],
  ['p', 'Elijan también dónde se prueba (en casa, en el lugar de consumo o en la tienda). Con pocas personas aparecen la mayoría de los problemas, pero el resultado varía más.'],
  ['h', 'El informe de prueba'],
  ['p', 'Muestra a cada persona: quién es, si lo logró sola, con ayuda o no pudo, cuántos segundos tardó y qué hizo o dijo. Debajo, la <b>malla receptora de información</b> ordena lo observado en cuatro cuadrantes: lo que gustó, críticas, preguntas e ideas nuevas. Al final, una conclusión sobre el supuesto.'],
  ['h', 'Siguiente paso'],
  ['lista', ['<b>Iterar</b>: escriban qué aprendieron con la versión anterior y qué cambian, y prueben una nueva versión.',
    '<b>Avanzar a Especificar y Puerta</b>: cuando el supuesto quedó confirmado y tienen las versiones exigidas.',
    '<b>Volver a Evaluar</b>: si la idea no funciona.']],
  ['idea', 'Cambien una o dos características por versión, guiándose por la malla. Si cambian todo a la vez, no sabrán qué funcionó.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'especificar', t: 'Fases 5 y 6. Especificar y la Puerta', r: 'Ficha técnica, caso de negocio, lienzo, pre-mortem y acta del comité.', b: [
  ['p', 'Especificar es definir cómo se fabricará el producto y cuánto costará. La Puerta es el comité que, con esa información, decide si se autoriza el piloto. Lo que viene del prototipo (tamaño y forma de abrir) queda fijo.'],
  ['h', '1. Ficha técnica'],
  ['p', 'Elijan envase, base líquida, azúcar, conservación (pasteurizada, 12 días; UHT, 90 días), etiqueta y producción (línea actual, máquina nueva con inversión de Bs 60.000 o maquila). La pantalla calcula el <b>costo por unidad</b> y por porción, la vida útil y cuántas unidades pueden producir por trimestre.'],
  ['h', '2. Caso de negocio'],
  ['p', 'Escriban el <b>precio al público por unidad</b>, las <b>unidades que esperan vender por trimestre</b> y la <b>publicidad</b>. La pantalla calcula el margen por unidad, la utilidad por trimestre, la inversión que falta y en cuántos trimestres se recupera.'],
  ['p', 'La <b>clase de referencia</b> muestra cuánto vendieron otros lanzamientos en su primer trimestre (la mediana y el rango donde caen 8 de cada 10). Si su pronóstico supera a 9 de cada 10, el simulador se los advierte: es un pronóstico optimista.'],
  ['h', '3. Lienzo del modelo de negocio'],
  ['p', 'El segmento, la propuesta de valor, los costos y los ingresos se llenan solos. Ustedes eligen socios clave, actividades clave, recursos clave, relación con el cliente y canales. Si venden por app propia o por suscripción, <b>cambia el modelo de negocio</b> y con él el tipo de innovación.'],
  ['h', '4. Pre-mortem'],
  ['p', 'Imaginen que dentro de un año el producto fracasó. Elijan las <b>2 causas más probables</b> y escriban cómo las evitarían.'],
  ['h', 'Lo que pasa al procesar'],
  ['p', 'La planta piloto produce un lote y revela el <b>costo real</b> (Bs 8.000 y 2 semanas). El comité emite un <b>acta</b> con cinco criterios de 1 a 9:'],
  ['tabla', ['Criterio', 'Qué mira el comité'], [
    ['Atractivo para el cliente', 'El ajuste del prototipo al segmento y la calidad del concepto (mejor si pasó por el test).'],
    ['Ajuste estratégico', 'Cuánto esfuerzo da su Estrategia anual al lugar del portafolio de este proyecto.'],
    ['Viabilidad técnica', 'Costo real hasta 60 % del precio, capacidad suficiente y vida útil adecuada al canal.'],
    ['Rentabilidad estimada', 'En cuántos trimestres recupera lo que falta invertir; baja si el volumen es demasiado optimista.'],
    ['Riesgo (9 = bajo)', 'Si su pre-mortem identificó los riesgos principales y propone cómo evitarlos.']]],
  ['tabla', ['Veredicto', 'Cuándo', 'Qué hacer'], [
    ['Pasa al piloto', 'Promedio igual o mayor al umbral y ningún criterio bajo 4.', 'Preparar el piloto.'],
    ['Reiterar', 'Promedio hasta un punto bajo el umbral, o faltan versiones de prototipo.', 'Corregir lo que dice el acta y volver a presentarse, o volver a prototipar.'],
    ['Detener', 'Promedio más de un punto bajo el umbral.', 'Es una recomendación: pueden detener o corregir a fondo.']]],
  ['p', 'El umbral es el que eligieron en la Estrategia anual. Si la estructura es integrada, el proyecto es un producto nuevo y la empresa es muy radical, el comité exige un punto más.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'piloto', t: 'Fase 7. Piloto', r: 'Vender en pocos puntos para medir ventas y recompra.', b: [
  ['p', 'El piloto es una prueba de mercado: venden en pocos puntos durante un trimestre para medir con clientes cuánto se vende y, sobre todo, <b>si vuelven a comprar</b>.'],
  ['pasos', ['<b>Dónde</b>: número de puntos de venta en cada canal de su lienzo. Cada punto tiene costo (tienda Bs 300, supermercado Bs 800, kiosco Bs 400, máquina Bs 1.200, app propia Bs 2.000, delivery Bs 1.000).',
    '<b>Precio de prueba</b> por unidad y <b>apoyo</b> en el punto de venta (ninguno, afiche y exhibidor Bs 3.000, degustación los sábados Bs 8.000).',
    '<b>Unidades a producir</b> (con el costo real y la vida útil a la vista).',
    '<b>Su pronóstico de ventas</b>: se guarda antes de procesar y se compara con lo real.',
    '<b>Límite de recompra</b>: el porcentaje mínimo para decidir lanzar.']],
  ['p', 'El <b>informe del piloto</b> trae unidades vendidas, compradores nuevos, porcentaje que volvió a comprar, la diferencia con su pronóstico, ventas por canal, si sobró o faltó producto, frases de clientes y una proyección al mercado completo.'],
  ['p', 'Pueden <b>lanzar sin piloto</b>: es más rápido, pero el riesgo de fracaso es mayor.'],
  ['idea', 'Produzcan cerca de su pronóstico: si sobra, el producto vence; si falta, pierden ventas y no miden bien la demanda.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'lanzar', t: 'Fase 8. Lanzar y revisar', r: 'Salir al mercado y cerrar el proyecto con una revisión.', b: [
  ['h', 'Lanzar'],
  ['lista', ['<b>Nombre comercial</b> y <b>mensaje publicitario</b> en una frase. El mensaje debería decir, con palabras del cliente, el beneficio principal del concepto; si no, el simulador lo marca.',
    '<b>Precio por unidad</b>: la pantalla lo convierte a Bs por porción.',
    '<b>Publicidad</b> por trimestre y el <b>segmento</b> al que va dirigida.',
    '<b>Canales</b>.',
    '<b>Reemplaza a la leche saborizada</b>: solo si el proyecto mejora el producto actual; si no, conviven.',
    'Marquen <b>Confirmar el lanzamiento este trimestre</b>.']],
  ['p', 'El lanzamiento cuesta Bs 50.000 más la implementación del concepto (y la máquina, si la eligieron). Cada producto nuevo activo tiene además un costo de gestión de <b>Bs 40.000 por trimestre</b>.'],
  ['h', 'Después del lanzamiento'],
  ['p', 'Al procesar el trimestre siguiente verán unidades vendidas, participación en el segmento, utilidad y <b>canibalización</b> (ventas que salieron de su propia leche saborizada). Los rivales reaccionan: alguno puede bajar su precio y, si su producto tiene éxito, otro puede copiarlo más barato.'],
  ['h', 'Revisión después de la acción'],
  ['p', 'Cierren el proyecto comparando lo esperado con lo real (Bs 8.000). La tabla ya trae sus pronósticos y los resultados. Ustedes eligen hasta 3 causas de la diferencia, las explican con datos, clasifican el resultado (por ejemplo, un fracaso inteligente o evitable) y escriben qué harán distinto en este producto y en los próximos proyectos.'],
  ['p', 'La revisión sube la <b>madurez en gestión de la innovación</b>, como máximo un nivel por año.'],
  ['ir', [['Ir a 4. Proyectos', 'proyectos']]]
]},
{ id: 'productos', t: 'Paso 5. Productos', r: 'El negocio actual sigue vendiendo mientras innovan.', b: [
  ['p', 'Para cada producto en el mercado deciden siete variables:'],
  ['tabla', ['Variable', 'Regla', 'Efecto'], [
    ['1. Precio', 'Bs por porción; cambio máximo ±30 % por trimestre.', 'Cada segmento lo compara con lo que suele pagar.'],
    ['2. Publicidad', 'Bs por trimestre (hasta Bs 80.000).', 'Mantiene el conocimiento de marca. Con menos de Bs 10.000, la gente empieza a olvidarla.'],
    ['3. Publicidad dirigida a', 'Todo el mercado o un segmento.', 'Atrae más a ese segmento y un poco menos a los demás.'],
    ['4. Promoción', 'Entre Bs 0 y Bs 60.000.', 'Sube las ventas solo en este trimestre.'],
    ['5. Canales', 'Tiendas y supermercados están incluidos; los demás cuestan por trimestre.', 'Cada canal llega mejor a ciertos segmentos.'],
    ['6. Pronóstico de ventas', 'Porciones del trimestre.', 'Se compara con lo que vendan.'],
    ['7. Retirar', 'No se puede retirar el producto original.', 'Deja de venderse y de costar gestión.']]],
  ['tabla', ['Canal', 'Costo por trimestre'], [['Tiendas de barrio', 'Incluido'], ['Supermercados', 'Incluido'], ['Kioscos universitarios', 'Bs 6.000'], ['Máquinas expendedoras', 'Bs 9.000'], ['App propia con entrega', 'Bs 15.000'], ['App de delivery (terceros)', 'Bs 12.000']]],
  ['p', 'La publicidad y la promoción son gastos comerciales: salen de la caja, no del presupuesto de innovación.'],
  ['ir', [['Ir a 5. Productos', 'productos']]]
]},
{ id: 'pares', t: 'Evaluar a otros equipos', r: 'Calificar sin saber de quién son los conceptos de otros equipos.', b: [
  ['p', 'Cada trimestre su equipo recibe, sin saber de qué empresa son, las fichas de concepto que crearon otros equipos en el trimestre anterior. Califiquen de <b>1 (muy bajo) a 9 (muy alto)</b>:'],
  ['lista', ['<b>Novedad</b>: qué tan distinta es de lo que ya existe.', '<b>Viabilidad</b>: qué tan posible es producirla y venderla.', '<b>Claridad del concepto</b>: si se entiende para quién es y qué ofrece.']],
  ['p', 'Pueden dejar un comentario breve. Presionen <b>Guardar mis evaluaciones</b>.'],
  ['p', 'El promedio de varios evaluadores (otros equipos y el docente) ajusta la calidad de cada concepto en hasta medio punto, hacia arriba o hacia abajo, al procesar el trimestre siguiente. Lo que recibieron ustedes está en <b>Resultados → Evaluación de sus conceptos</b>.'],
  ['ojo', 'Juzguen el concepto, no a la empresa. Calificar a todos con 1 o con 9 no ayuda a nadie y el docente lo ve.'],
  ['ir', [['Evaluar a otros equipos', 'pares'], ['Evaluación de sus conceptos', 'evaluaciones']]]
]},
{ id: 'hipotesis', t: 'Paso 6. Hipótesis y envío', r: 'Escribir qué esperan y por qué, y enviar.', b: [
  ['p', 'La hipótesis es obligatoria para enviar (al menos 20 caracteres). Escríbanla <b>antes</b> de ver resultados: luego la contrastarán en la bitácora.'],
  ['lista', ['<b>¿Qué esperamos que pase y por qué?</b> Una relación causa-efecto entre su decisión y un resultado.', '<b>Resultado esperado (medible)</b>: una cifra que puedan comprobar.']],
  ['ej', 'Si observamos a los universitarios descubriremos necesidades que la encuesta no muestra y nuestras fichas de concepto tendrán una calidad corregida mayor a 6. Resultado esperado: intención de compra sobre 50 % en S2.'],
  ['ojo', '"Esperamos que nos vaya bien" no es una hipótesis: no dice por qué ni cómo comprobarlo.'],
  ['ir', [['Ir a 6. Hipótesis y envío', 'hipotesis']]]
]},
{ id: 'resultados', t: 'Leer los resultados', r: 'Resumen, informes, estados financieros e indicadores.', b: [
  ['h', 'Resumen del trimestre'],
  ['p', 'Ventas, utilidad, caja, participación, vitalidad y clima, cada uno junto a la <b>empresa gemela que no innova</b>. Debajo: cómo quedaron las empresas, <b>Qué pasó y por qué</b> (la explicación de cada resultado), el <b>informe de coherencia</b> (si sus decisiones corresponden a su estrategia), un gráfico frente a la gemela y su lectura del entorno.'],
  ['idea', 'Lean primero "Qué pasó y por qué". Ahí se explica por qué un proyecto no avanzó, por qué una elección no se ejecutó o qué hizo un competidor.'],
  ['h', 'Estados financieros e indicadores'],
  ['p', 'Estado de resultados, flujo de efectivo y balance general por trimestre (en miles de Bs), y las ventas por producto y segmento.'],
  ['tabla', ['Indicador', 'Qué mide'], [

    ['Intensidad de innovación', 'Gasto en innovación respecto de las ventas.'],
    ['Motivación intrínseca y autoeficacia creativa', 'De 0 a 1: cuánto disfruta el personal el trabajo creativo y cuánto confía en su capacidad. Mejoran la calidad de las ideas.'],
    ['Clima creativo', 'Resumen de las condiciones que favorecen la creatividad en la organización.'],
    ['Madurez en innovación', 'De 1 a 5: qué tan bien gestiona la empresa la innovación. Sube con las revisiones de proyectos.'],
    ['Acierto en noticias', 'Porcentaje de noticias que clasificaron bien.']]],
  ['ir', [['Resumen del trimestre', 'resumen'], ['Estados financieros', 'resultados']]]
]},
{ id: 'bitacora', t: 'Aprender y la bitácora', r: 'Relacionar lo que pasó con la teoría.', b: [
  ['p', 'En <b>Aprender → Temas de innovación</b> hay nueve unidades con la teoría que se aplica en cada decisión, con sus fuentes. El <b>Glosario</b> define los términos.'],
  ['p', 'La <b>bitácora</b> se escribe después de recibir los resultados de cada trimestre. Responde cuatro preguntas:'],
  ['pasos', ['¿Qué decidimos?', '¿Qué pasó?', '¿Por qué pasó? (contrastado con su hipótesis)', '¿Qué principio de innovación lo explica?']],
  ['p', 'El docente puede calificarla y dejarles un comentario, que verán debajo, en Bitácoras anteriores.'],
  ['ej', 'Decidimos observar a S2 en lugar de encuestar. La calidad de nuestras fichas subió a 6,8. Se cumplió la hipótesis: la observación reveló que S2 valora la conveniencia aunque declare el precio. Lo explica la diferencia entre necesidades declaradas y latentes.'],
  ['ir', [['Mi bitácora', 'bitacora'], ['Temas de innovación', 'temas']]]
]},
{ id: 'calendario', t: 'Los cinco años', r: 'Qué suele estar en juego cada año.', b: [

// --------- mapa pantalla → sección del manual ---------
var MANUAL_DE = { caso: 'caso', panel: 'pantalla', mercado: 'caso', equipo: 'ingreso', ronda: 'ronda', entorno: 'entorno', anual: 'anual', investigacion: 'investigacion', proyectos: 'proyectos', productos: 'productos', pares: 'pares', hipotesis: 'hipotesis', resumen: 'resultados', informes: 'investigacion', evaluaciones: 'pares', resultados: 'resultados', temas: 'bitacora', glosario: 'bitacora', bitacora: 'bitacora' };
var MSEC = 'inicio', MBUS = '', MTODO = false, MPUB = false;

function manSec(id) { for (var i = 0; i < MANUAL.length; i++) if (MANUAL[i].id === id) return MANUAL[i]; return MANUAL[0]; }
function manTexto(s) { return (s.t + ' ' + s.r + ' ' + JSON.stringify(s.b)).replace(/<[^>]+>/g, ' ').toLowerCase(); }
function manNorm(x) { return String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function manBloque(k) {
  var tipo = k[0], v = k[1];
  if (tipo === 'p') return '<p>' + v + '</p>';
  if (tipo === 'h') return '<h3>' + v + '</h3>';
  if (tipo === 'pasos') return '<ol class="man-pasos">' + v.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>';
  if (tipo === 'lista') return '<ul class="fb">' + v.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
  if (tipo === 'tabla') return '<div class="scroll"><table><tr>' + v.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>' + k[2].map(function (f) { return '<tr>' + f.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
  if (tipo === 'ojo') return '<div class="man-box man-ojo"><span class="man-lbl">Atención</span>' + v + '</div>';
  if (tipo === 'idea') return '<div class="man-box man-idea"><span class="man-lbl">Consejo</span>' + v + '</div>';
  if (tipo === 'ej') return '<div class="man-box man-ej"><span class="man-lbl">Ejemplo</span>' + v + '</div>';
  if (tipo === 'ir') return MPUB ? '' : '<div class="inline">' + v.map(function (x) { return '<button class="btn sec" onclick="irTab(\'' + x[1] + '\')">' + esc(x[0]) + ' →</button>'; }).join('') + '</div>';
  return '';
}
function manSeccionHTML(s, n) {
  return '<div class="card man-sec" id="man_' + s.id + '"><h2><span class="man-n">' + n + '</span> ' + esc(s.t) + '</h2><p class="muted">' + esc(s.r) + '</p>' + s.b.map(manBloque).join('') + '</div>';
}
function manualHTML() {
  var idx = MANUAL.map(function (s) { return s.id; }).indexOf(MSEC); if (idx < 0) idx = 0;
  var html = '<div class="card man-cab"><h2>Manual del estudiante</h2><p>Todo lo que necesitan para jugar: cómo ingresar, qué se decide en cada paso, qué devuelve el simulador y cómo leerlo. Los montos son los valores por defecto; el pie de la pantalla siempre muestra el costo real de lo que eligen.</p>' +
    '<div class="man-herr"><input type="text" id="manBus" value="' + esc(MBUS) + '" placeholder="Buscar en el manual: precio, Pugh, piloto, contraseña…" oninput="MBUS=this.value;var p=this.selectionStart;pintarManual();var e=$(\'manBus\');if(e){e.focus();e.setSelectionRange(p,p)}">' +
    '<button class="btn sec" onclick="MTODO=!MTODO;MBUS=\'\';pintarManual()">' + (MTODO ? 'Ver por secciones' : 'Ver todo') + '</button><button class="btn sec" onclick="MTODO=true;MBUS=\'\';pintarManual();setTimeout(function(){window.print()},300)">Imprimir o guardar PDF</button></div></div>';
  var q = manNorm(MBUS).trim();
  if (q) {
    var pal = q.split(/\s+/), hits = MANUAL.filter(function (s) { var tx = manNorm(manTexto(s)); return pal.every(function (w) { return tx.indexOf(w) >= 0; }); });
    html += '<div class="card"><h2>Resultados de la búsqueda</h2>' + (hits.length ? '<ul class="fb">' + hits.map(function (s) { return '<li><a href="#" onclick="MBUS=\'\';MTODO=false;MSEC=\'' + s.id + '\';pintarManual();return false"><b>' + esc(s.t) + '</b></a> · <span class="muted">' + esc(s.r) + '</span></li>'; }).join('') + '</ul>' : '<p class="muted">No se encontró. Prueben con otra palabra o revisen el Glosario.</p>') + '</div>';
    return html;
  }
  html += '<div class="man-wrap"><nav class="man-idx" aria-label="Índice del manual">' + MANUAL.map(function (s, i) { return '<button class="' + (!MTODO && i === idx ? 'on' : '') + '" onclick="MTODO=false;MSEC=\'' + s.id + '\';pintarManual();manArriba()"><span class="man-n">' + (i + 1) + '</span> ' + esc(s.t) + '</button>'; }).join('') + '</nav><div class="man-cuerpo"><select class="man-sel" aria-label="Sección del manual" onchange="MTODO=false;MSEC=this.value;pintarManual();manArriba()">' + MANUAL.map(function (s, i) { return '<option value="' + s.id + '"' + (!MTODO && i === idx ? ' selected' : '') + '>' + (i + 1) + '. ' + esc(s.t) + '</option>'; }).join('') + '</select>';
  if (MTODO) html += MANUAL.map(function (s, i) { return manSeccionHTML(s, i + 1); }).join('');
  else {
    html += manSeccionHTML(MANUAL[idx], idx + 1);
    html += '<div class="inline" style="justify-content:space-between">' + (idx > 0 ? '<button class="btn sec" onclick="MSEC=\'' + MANUAL[idx - 1].id + '\';pintarManual();manArriba()">← ' + esc(MANUAL[idx - 1].t) + '</button>' : '<span></span>') + (idx < MANUAL.length - 1 ? '<button class="btn sec" onclick="MSEC=\'' + MANUAL[idx + 1].id + '\';pintarManual();manArriba()">' + esc(MANUAL[idx + 1].t) + ' →</button>' : '') + '</div>';
  }
  return html + '</div></div>';
}
function vManual() { MPUB = false; return manualHTML(); }
function pintarManual() {
  var o = document.getElementById('manPub');
  if (o) { MPUB = true; o.querySelector('.man-pub-in').innerHTML = manualHTML(); return; }
  render();
}
function manArriba() { var o = document.getElementById('manPub'); if (o) o.scrollTop = 0; else window.scrollTo(0, 0); }
function irManual(id) { MSEC = id || 'inicio'; MBUS = ''; MTODO = false; TAB = 'manual'; render(); window.scrollTo(0, 0); }
function enlaceManual(tab) {
  var id = MANUAL_DE[tab]; if (!id) return '';
  return '<p class="man-ctx"><a href="#" onclick="irManual(\'' + id + '\');return false">📘 Manual: ' + esc(manSec(id).t) + '</a></p>';
}
// Manual sin iniciar sesión (botón de la pantalla de ingreso)
function abrirManualPublico() {
  var o = document.getElementById('manPub');
  if (!o) { o = document.createElement('div'); o.id = 'manPub'; o.innerHTML = '<div class="man-pub-bar"><b>Simulador de Innovación · Manual del estudiante</b><button class="btn sec" onclick="cerrarManualPublico()">Cerrar ✕</button></div><div class="man-pub-in"></div>'; document.body.appendChild(o); }
  document.body.classList.add('man-pub-on');
  MSEC = 'inicio'; MBUS = ''; MTODO = false; pintarManual(); o.scrollTop = 0;
}
function cerrarManualPublico() { var o = document.getElementById('manPub'); if (o) o.remove(); document.body.classList.remove('man-pub-on'); MPUB = false; }
</script>
