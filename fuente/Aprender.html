var UNIDADES = [
  { n: 1, titulo: 'La innovación como proceso estratégico', pregunta: '¿Qué tipo de innovación necesita hoy su empresa y por qué?', temas: [
    { t: '¿Qué es innovar?', x: 'Innovar es convertir ideas en valor: un producto, proceso o modelo nuevo o mejorado que llega al mercado o se usa en la organización. La diferencia con la invención es la implementación: una idea brillante que nadie adopta no es innovación.', s: 'Solo cuenta lo que se lanza o se implementa: un proyecto que no supera las puertas no genera ventas.', r: ['tidd', 'oslo'] },
    { t: 'Las 4P de la innovación', x: 'La innovación puede ocurrir en el producto (qué ofrecemos), el proceso (cómo lo hacemos), la posición (a quién y en qué contexto lo ofrecemos) y el paradigma (el modelo mental o de negocio). Las empresas suelen concentrarse en el producto y descuidan las otras tres.', s: 'Estrategia anual: la distribución del esfuerzo en las 4P decide qué tipo de ideas aparecen en sus iniciativas.', r: ['tidd'] },
    { t: 'Incremental, radical y arquitectónica', x: 'La innovación incremental mejora lo existente con bajo riesgo; la radical cambia de forma profunda la oferta o la tecnología, con más riesgo y más potencial. La innovación arquitectónica recombina componentes conocidos de una forma nueva, y suele tomar por sorpresa a las empresas establecidas.', s: 'Estrategia anual: la mezcla incremental/radical; las ideas tienen distinto nivel de novedad y riesgo.', r: ['tidd', 'hend'] },
    { t: 'El proceso de innovación como embudo', x: 'Innovar es un proceso que se gestiona: buscar señales, seleccionar las mejores opciones, implementarlas y capturar su valor. Muchas ideas entran al embudo y pocas salen; la tarea del gestor es reducir la incertidumbre en cada etapa con el menor costo posible.', s: 'Proyectos: ideación y selección → prototipo y validación → lanzamiento, con un máximo de 3 proyectos activos.', r: ['tidd'] },
    { t: 'El costo de no innovar', x: 'Todo producto recorre un ciclo de vida: introducción, crecimiento, madurez y declive. Una empresa que solo explota su producto maduro puede ser rentable a corto plazo, pero pierde relevancia cuando cambian los clientes o la tecnología.', s: 'La “empresa gemela” que no innova aparece en Resultados: compare sus ventas y utilidades con las suyas.', r: ['tidd', 'chris'] }
  ] },
  { n: 2, titulo: 'Personas, creatividad y clima', pregunta: '¿Qué condiciones de trabajo hicieron que sus ideas fueran mejores o peores?', temas: [
    { t: 'Los componentes de la creatividad', x: 'La creatividad individual surge de la combinación de tres componentes: experticia en el campo, habilidades de pensamiento creativo y motivación por la tarea. El entorno social puede potenciarlos o apagarlos.', s: 'La calidad media de las ideas depende de la motivación, la capacitación y el conocimiento de los clientes.', r: ['amab', 'sawyer'] },
    { t: 'Motivación intrínseca y recompensas', x: 'Las personas son más creativas cuando trabajan por el interés y el reto de la tarea. Las recompensas monetarias grandes y condicionadas pueden desplazar esa motivación; el reconocimiento y la autonomía tienden a reforzarla.', s: 'Estrategia anual: el tipo de incentivo. Los premios de los concursos siguen una U invertida: el premio medio suele rendir más que el alto.', r: ['amab', 'deci'] },
    { t: 'Autoeficacia y confianza creativa', x: 'La autoeficacia creativa es la creencia de una persona en su capacidad para producir ideas valiosas. Se fortalece con experiencias de logro, práctica guiada y entornos que no castigan el error; quienes la tienen proponen y se arriesgan más.', s: 'Índice de autoeficacia: sube con la capacitación en Design Thinking y con una política de aprendizaje ante el fracaso.', r: ['kelley', 'tier'] },
    { t: 'Clima creativo y seguridad psicológica', x: 'El clima es lo que las personas perciben sobre cómo se trabaja: libertad, recursos, apoyo de la dirección, tiempo y tolerancia al error. Cuando el equipo siente que puede equivocarse sin ser castigado, experimenta y aprende más.', s: 'Estrategia anual: tiempo libre, política ante el fracaso e incentivos definen el índice de clima creativo.', r: ['keys', 'edm'] },
    { t: 'Diversidad y equipos multifuncionales', x: 'Los equipos que combinan conocimientos distintos generan ideas más variadas y detectan antes los problemas de implementación. La diversidad aumenta la dispersión de las ideas: hay más ideas malas, pero también más ideas excepcionales.', s: 'Estrategia anual: composición homogénea, multifuncional o con miembros externos.', r: ['sawyer', 'tidd'] }
  ] },
  { n: 3, titulo: 'Descubrir oportunidades', pregunta: '¿Qué aprendieron de sus clientes que no sabían al empezar?', temas: [
    { t: 'Necesidades declaradas y latentes', x: 'Lo que los clientes dicen que quieren no siempre coincide con lo que valoran al decidir. Las necesidades latentes son aquellas que no expresan, a veces porque no imaginan que puedan resolverse; son una fuente importante de innovación.', s: 'La encuesta muestra pesos declarados; la observación revela los pesos reales y las necesidades latentes.', r: ['brown', 'kelley'] },
    { t: 'Observación y empatía', x: 'El Design Thinking parte de comprender a las personas en su contexto: observar qué hacen, qué improvisan y dónde se frustran. La empatía permite descubrir problemas que ninguna encuesta preguntó.', s: 'Investigación: observación y etnografía cuesta más y toma más semanas, pero mejora la calidad del insight.', r: ['brown'] },
    { t: 'Usuarios líderes y extremos', x: 'Los usuarios líderes enfrentan hoy necesidades que el mercado tendrá mañana y a menudo ya crearon soluciones propias. Los usuarios extremos (los que usan mucho o casi nada un producto) muestran con claridad problemas que en el usuario promedio pasan desapercibidos.', s: 'Investigación: usuarios líderes aportan ideas de alta calidad; usuarios extremos revelan una tendencia futura.', r: ['vh86', 'vh05'] },
    { t: 'Definir bien el problema', x: 'La calidad de una solución depende de cómo se formuló el problema. Reformular, es decir, preguntar “¿cómo podríamos…?” desde la necesidad del usuario y no desde el producto, abre opciones que el planteamiento inicial ocultaba.', s: 'Al crear un proyecto eligen la base (mejorar el producto actual o uno nuevo) y el segmento objetivo.', r: ['brown', 'sawyer'] },
    { t: 'Vigilancia del entorno: señales y ruido', x: 'Las oportunidades y amenazas se anuncian con señales débiles en la periferia: cambios regulatorios, tecnologías, nuevos competidores. El reto es distinguir las señales del ruido y actuar antes que los demás.', s: 'Entorno: clasificar noticias como oportunidad, amenaza o ruido; la vigilancia tecnológica anticipa noticias reales.', r: ['day', 'tidd'] }
  ] },
  { n: 4, titulo: 'Estrategia de innovación', pregunta: '¿Su estrategia anual fue coherente con su mandato y con lo que sabían del mercado?', temas: [
    { t: 'Cuatro decisiones encadenadas', x: 'La estrategia de innovación del año responde cuatro preguntas, de lo general a lo operativo. 1) Postura (Freeman y Soete, 1997): ¿cuál es nuestra actitud ante la innovación? Por ejemplo, ofensiva (ser los primeros) o imitativa (seguir a otros rápido). 2) Portafolio (Nagji y Tuff, 2012): ¿dónde apostamos? Núcleo es mejorar lo actual, adyacente es llegar a clientes nuevos y transformacional es crear mercados nuevos. 3) 4P (Tidd y Bessant, 2021): ¿qué tipo de cambio hacemos? Puede ser en el producto, el proceso, la posición o el modelo de negocio. 4) Estructura (O\'Reilly y Tushman, 2004): ¿cómo nos organizamos para lograrlo? Integrados al negocio actual o con una unidad separada. Las cuatro deben ser coherentes: una postura ofensiva con casi todo el esfuerzo en el núcleo, o apuestas transformacionales sin una estructura que las proteja, se contradicen.', s: 'Es el Bloque A de la Estrategia anual: respóndanlo en este orden y revisen su coherencia en el informe de coherencia.', r: ['freeman', 'nagji', 'tidd', 'oreilly'] },
    { t: 'Estrategia de innovación', x: 'Una estrategia de innovación define qué tipo de innovación persigue la empresa, cómo crea valor para los clientes y cómo lo captura, y cómo asigna recursos entre opciones. Sin ella, los proyectos compiten sin criterio y el esfuerzo se dispersa.', s: 'Estrategia anual: las decisiones del bloque A deben ser coherentes entre sí y con el mandato.', r: ['pisano', 'tidd'] },
    { t: 'El portafolio de innovación', x: 'Conviene distribuir el esfuerzo entre iniciativas del núcleo (mejorar lo actual para los clientes actuales), adyacentes (llevar lo que se sabe a nuevos mercados) y transformacionales (crear algo nuevo para mercados nuevos). El equilibrio depende de la industria y de la situación de la empresa.', s: 'La combinación de incremental/radical y clientes actuales/segmentos nuevos forma su portafolio.', r: ['nagji'] },
    { t: 'Postura frente a la innovación', x: 'Freeman y Soete describen seis posturas que puede adoptar una empresa: ofensiva (busca llegar primero con lo nuevo y para eso investiga y desarrolla por delante de los demás), defensiva (no quiere ser la primera, pero sí no quedarse atrás: mejora rápido lo que otros abren), imitativa (copia lo que ya funciona con menor costo), dependiente (innova solo cuando un cliente o socio se lo pide), tradicional (casi no cambia su producto) y oportunista (aprovecha nichos que otros no ven). Ninguna es correcta por sí sola: lo que importa es que las decisiones sean coherentes con la postura elegida.', s: 'Estrategia anual: eligen su postura y el informe de coherencia les avisa si sus decisiones la contradicen (por ejemplo, una postura ofensiva sin investigación).', r: ['freeman', 'tidd'] },
    { t: 'Explorar y explotar', x: 'Las organizaciones deben explotar lo que ya saben hacer para generar caja y, a la vez, explorar nuevas posibilidades para el futuro. Explotar da resultados seguros y rápidos; explorar es incierto y lento, y por eso tiende a quedar relegado.', s: 'Proyectos incrementales dan caja pronto; los radicales tardan más y fallan más, pero son los que renuevan el portafolio.', r: ['march'] },
    { t: 'Asignación de recursos', x: 'En las empresas establecidas los recursos van a lo que piden los clientes actuales y a lo que promete márgenes conocidos. Por eso las oportunidades nuevas, pequeñas al inicio, reciben poco apoyo aunque sean estratégicas.', s: 'Presupuesto de innovación y semanas-persona son limitados; el presupuesto del año siguiente depende de sus resultados.', r: ['chris', 'tidd'] },
    { t: 'Mandato y tolerancia al riesgo', x: 'La dirección define cuánto riesgo acepta y qué problemas considera prioritarios. Ese marco cambia cuáles ideas son “buenas”: la misma idea puede ser excelente para un directorio ambicioso y mala para uno conservador.', s: 'Su mandato pondera novedad, riesgo, tiempo, costo y ajuste para calcular la calidad de cada idea.', r: ['tidd'] }
  ] },
  { n: 5, titulo: 'Generar, seleccionar y desarrollar', pregunta: '¿Eligieron la mejor idea disponible? ¿Qué evidencia tenían para hacerlo?', temas: [
    { t: 'Fuentes y modos de innovación', x: 'Las ideas pueden venir de especialistas internos, de intraemprendedores, de comunidades abiertas o de redes de socios (proveedores, startups, universidades). La innovación abierta propone aprovechar el conocimiento externo en lugar de depender solo del laboratorio propio.', s: 'Proyectos: ocho iniciativas con distinto número, calidad media y dispersión de ideas.', r: ['chesb', 'terw'] },
    { t: 'Cantidad, calidad y la idea extraordinaria', x: 'Lo que importa no es la calidad promedio de las ideas sino la calidad de la mejor. Generar más ideas y con mayor variedad aumenta la probabilidad de encontrar una excepcional, siempre que luego se sepa reconocerla.', s: 'Las iniciativas de comunidad generan muchas ideas dispersas; las de especialistas, pocas y más parejas.', r: ['giro', 'terw'] },
    { t: 'Definir: el brief y el trabajo por hacer', x: 'Un proyecto empieza con un problema bien planteado. El “trabajo por hacer” describe qué progreso busca el cliente en una situación concreta (cuando…, quiero…, para…). El reto “¿Cómo podríamos…?” formula la necesidad sin traer la solución, y el insight debe apoyarse en evidencia de la investigación.', s: 'Proyectos → Definir: brief con trabajo por hacer, evidencia, reto revisado automáticamente, criterio de éxito y las dos preguntas de Pisano.', r: ['chris16', 'brown', 'pisano'] },
    { t: 'Técnicas para idear: SCAMPER, flor de loto y análisis morfológico', x: 'SCAMPER aplica siete preguntas a un producto existente y da sobre todo mejoras incrementales. La flor de loto rodea el reto con ocho temas y desarrolla ideas en cada uno: aumenta cantidad y variedad. El análisis morfológico divide el producto en parámetros y combina opciones: produce combinaciones nuevas, muchas poco viables. Conviene idear primero en forma individual y luego votar en grupo.', s: 'Proyectos → Idear: cada integrante llena la plantilla de la técnica con su PIN; el equipo vota y arma fichas de concepto.', r: ['eberle', 'michalko', 'zwicky'] },
    { t: 'Ficha y test de concepto', x: 'Un concepto describe qué es el producto, para quién y por qué es mejor que la alternativa. El test de concepto lo muestra a clientes y mide la intención de compra, que siempre exagera la compra real, el rango de precio aceptable (medidor de Van Westendorp) y el tipo de cada atributo según Kano: básico, de desempeño o de entusiasmo.', s: 'Proyectos → fichas de concepto con 10 puntos y precio objetivo; el test devuelve intención, curvas de precio, Kano y frases de clientes.', r: ['moore', 'vanw', 'kano', 'jamieson'] },
    { t: 'Elegir con la matriz de Pugh', x: 'La matriz de Pugh compara cada concepto con una referencia, criterio por criterio: +1 si es mejor, 0 si es igual, −1 si es peor. La suma ordena las alternativas, pero también importan los −1 en criterios críticos y la posibilidad de combinar las fortalezas de dos conceptos.', s: 'Proyectos → Evaluar: matriz con cinco criterios, justificación con datos, opción de combinar y comparación entre el tipo declarado y el tipo real.', r: ['pugh', 'ulrich'] },
    { t: 'Prototipar: una pregunta hecha con las manos', x: 'Prototipar es dar forma tangible a una idea para aprender, no para impresionar: rápido, tosco y barato. Se parte del supuesto más riesgoso y se elige un formato que permita observarlo: una maqueta física muestra cómo se usa; un envase falso, si se entiende; un guion gráfico, si encaja en el día del cliente. Con 5 a 8 personas aparecen la mayoría de los problemas de uso. La malla receptora ordena lo observado en lo que gustó, críticas, preguntas e ideas nuevas.', s: 'Proyectos → Prototipar: supuesto, pregunta, formato, características del prototipo y prueba con clientes simulados que devuelve un informe por persona y la malla receptora.', r: ['brown', 'kelley', 'houde', 'nielsen', 'dschool'] },
    { t: 'Especificar y pasar la Puerta', x: 'Especificar es escribir la receta exacta del producto: materiales, proceso, costo por unidad, vida útil y capacidad. En la Puerta un comité revisa con criterios conocidos el atractivo para el cliente, el ajuste estratégico, la viabilidad técnica, la rentabilidad y el riesgo, y decide si sigue, se corrige o se detiene. Dos herramientas reducen el optimismo: la clase de referencia, que compara el pronóstico con lanzamientos parecidos, y el pre-mortem, que imagina el fracaso antes de que ocurra. Lo ya gastado no cuenta para decidir.', s: 'Proyectos → Especificar y Puerta: ficha técnica, caso de negocio, clase de referencia, lienzo, pre-mortem y acta del comité.', r: ['ulrich', 'cooper', 'lovallo', 'klein', 'staw'] },
    { t: 'El lienzo del modelo de negocio', x: 'El lienzo describe en nueve bloques cómo un negocio crea, entrega y cobra valor: segmento, propuesta de valor, canales, relación con el cliente, ingresos, recursos, actividades, socios y costos. Compararlo con el negocio actual muestra si la innovación cambia el modelo de negocio, que es una de las dos preguntas del mapa de Pisano.', s: 'Proyectos → Especificar: cuatro bloques automáticos, cinco que elige el equipo y comparación con el negocio actual.', r: ['oster', 'pisano'] },
    { t: 'Piloto, lanzamiento y canibalización', x: 'El piloto vende en pocos puntos durante poco tiempo para medir cuánto se vende y si el cliente vuelve a comprar: la recompra dice más que la primera compra. El lanzamiento es la apuesta completa en producción, comunicación y distribución. Un producto nuevo puede quitarle ventas a uno propio (canibalización) y provocar la reacción de los rivales.', s: 'Proyectos → Piloto y Lanzar: puntos de venta, producción, pronóstico, límite de recompra, mensaje, canales y resultados del primer trimestre.', r: ['kotler', 'cooper'] },
    { t: 'Revisión después de la acción y tipos de fracaso', x: 'La revisión después de la acción responde cuatro preguntas: qué esperábamos, qué pasó, por qué hubo diferencia y qué haremos distinto. No todos los fracasos son iguales: algunos son evitables, otros vienen de la complejidad y otros son experimentos que dejan aprendizaje.', s: 'Proyectos → Revisión: tabla esperado frente a real, causas, clasificación del resultado y compromisos para el próximo proyecto.', r: ['garvin', 'edm11'] },
    { t: 'Selección y puertas (stage-gate)', x: 'El sistema de etapas y puertas divide el desarrollo en fases separadas por evaluaciones. En cada puerta se decide continuar, corregir o detener con criterios explícitos, para no seguir invirtiendo en proyectos débiles.', s: 'Estrategia anual: umbral de la puerta (estricto, moderado o laxo). El puntaje combina calidad, factibilidad y viabilidad.', r: ['cooper'] },
    { t: 'Prototipar e iterar', x: 'Un prototipo es una forma barata de aprender: hace tangible la idea para probarla con usuarios. Los prototipos simples permiten iterar rápido al principio; los de alta fidelidad sirven cuando ya se sabe qué construir.', s: 'Proyectos: fidelidad del prototipo (baja, media, alta) y número de iteraciones por trimestre.', r: ['brown', 'kelley'] },
    { t: 'Validar y pilotear antes de escalar', x: 'Experimentar temprano reduce el costo de equivocarse: se prueban los supuestos más riesgosos con el mínimo producto necesario y se aprende antes de comprometer la inversión grande.', s: 'Validar ideas reduce el error de su calidad observada; el piloto reduce la probabilidad de fracaso al lanzar.', r: ['thomke', 'ries'] }
  ] },
  { n: 6, titulo: 'Mercado y competencia', pregunta: '¿Por qué ganaron o perdieron participación en cada segmento?', temas: [
    { t: 'Segmentación y propuesta de valor', x: 'Un mercado está formado por grupos con necesidades, disposición a pagar y hábitos distintos. Elegir a qué segmento servir y con qué propuesta de valor es una decisión estratégica, no solo comercial.', s: 'Cinco segmentos con tamaño, crecimiento y preferencias propias; cada proyecto apunta a uno.', r: ['kotler'] },
    { t: 'Cómo eligen los consumidores', x: 'Los modelos de atracción explican la participación de mercado como la proporción entre lo atractivo que es un producto (sus atributos, su precio, su presencia) y lo atractivo de todas las alternativas, incluida la opción de no comprar.', s: 'Su cuota en cada segmento depende de los atributos, el precio, los canales y el conocimiento de marca frente a los competidores.', r: ['coonak'] },
    { t: 'Precio y elasticidad', x: 'La elasticidad mide cuánto cambia la demanda cuando cambia el precio. Los segmentos sensibles al precio castigan las subidas; los segmentos que valoran otros atributos aceptan precios más altos si perciben más valor.', s: 'Productos: el precio afecta de forma distinta a cada segmento.', r: ['kotler'] },
    { t: 'Reacción competitiva e imitación', x: 'Los competidores no se quedan quietos: ajustan precios, mejoran productos y copian lo que funciona. La ventaja de una innovación dura lo que tardan los demás en imitarla.', s: 'Los competidores reaccionan a sus resultados; la marca regional puede lanzar clones de sus productos exitosos.', r: ['tidd', 'teece86'] },
    { t: 'Oportunidades y amenazas en movimiento', x: 'El análisis del entorno no es una foto fija: regulaciones, costos, tecnologías y competidores cambian con el tiempo. Lo que hoy es una amenaza puede convertirse en oportunidad para quien se anticipe.', s: 'Las noticias de cada trimestre anuncian eventos (regulación, divisas, licitaciones, sostenibilidad) que afectan el mercado.', r: ['day', 'tidd'] }
  ] },
  { n: 7, titulo: 'Captura de valor', pregunta: '¿Quién se quedó con el valor que crearon: ustedes, los imitadores o los canales?', temas: [
    { t: 'El modelo de negocio', x: 'El modelo de negocio describe cómo la empresa crea, entrega y captura valor: a qué clientes sirve, con qué propuesta, por qué canales y con qué fuentes de ingreso y estructura de costos. Innovar en el modelo puede valer más que innovar en el producto.', s: 'Al lanzar eligen modelo (venta o suscripción), canales y precio.', r: ['oster', 'teece10'] },
    { t: 'Apropiabilidad', x: 'Crear valor no garantiza capturarlo. La capacidad de apropiarse de los beneficios depende de la protección (patentes, secreto, marcas), de la facilidad de imitación y del control de activos complementarios como la distribución o la producción.', s: 'Lanzamiento: protección (ninguna, secreto o patente) retrasa la imitación de la marca regional.', r: ['teece86'] },
    { t: 'Difusión de las innovaciones', x: 'Los productos nuevos se adoptan de forma gradual: primero unos pocos innovadores y luego la mayoría, impulsada por la imitación y la recomendación. La velocidad depende de la ventaja percibida, la compatibilidad, la simplicidad y la comunicación.', s: 'El conocimiento de marca de un producto nuevo crece trimestre a trimestre según la comunicación.', r: ['rogers', 'bass'] },
    { t: 'Canales y lanzamiento', x: 'Un buen producto puede fracasar si no llega al lugar donde su cliente compra. Los canales tienen costo y alcanzan mejor a unos segmentos que a otros, por lo que deben elegirse según el cliente objetivo.', s: 'Canales: tiendas, supermercados, kioscos universitarios, máquinas expendedoras, app propia y apps de delivery.', r: ['kotler'] },
    { t: 'Escalar y costear', x: 'Pasar del piloto a la producción en volumen exige inversión y cambia la estructura de costos. Un margen atractivo en el prototipo puede desaparecer si el costo unitario o los gastos de gestión del nuevo producto no se controlan.', s: 'Cada producto nuevo tiene costo por litro, inversión de escalamiento y costo fijo trimestral de gestión.', r: ['tidd'] }
  ] },
  { n: 8, titulo: 'Innovación disruptiva', pregunta: '¿Vieron venir al disruptor? ¿Qué hicieron y qué deberían haber hecho?', temas: [
    { t: 'Innovación sostenedora y disruptiva', x: 'La innovación sostenedora mejora los productos en lo que los mejores clientes ya valoran. La disruptiva llega con un producto inferior en esas dimensiones, pero más simple, barato o accesible, y atrae a clientes que el líder no atiende.', s: 'La startup de bebidas vegetales entra con atributos distintos a los que valora su cliente tradicional.', r: ['chris'] },
    { t: 'Entrada por abajo y mercados nuevos', x: 'Los disruptores suelen empezar en la gama baja o con no consumidores, donde el líder no quiere competir. Desde ahí mejoran año tras año hasta que su producto es suficientemente bueno para los clientes principales.', s: 'El disruptor mejora cada trimestre y luego invade segmentos tradicionales.', r: ['chrisr'] },
    { t: 'El dilema del innovador', x: 'Las empresas establecidas fracasan ante la disrupción no por incompetencia, sino por hacer lo “correcto”: escuchar a sus mejores clientes y priorizar los márgenes altos. Su red de valor las lleva a ignorar los mercados pequeños donde nace la amenaza.', s: 'Reaccionar tarde es tentador porque, al principio, el disruptor casi no afecta sus ventas.', r: ['chris'] },
    { t: 'Respuestas ante la disrupción', x: 'Las opciones incluyen crear una unidad independiente que compita con las reglas del nuevo mercado, aliarse con el disruptor o adquirirlo. Cada una tiene costo, riesgo y efectos distintos sobre la organización principal.', s: 'Entorno: alianza o adquisición de la startup; Estrategia anual: unidad autónoma.', r: ['chris', 'chrisr'] },
    { t: 'La organización ambidiestra', x: 'Una organización ambidiestra separa las unidades que exploran de las que explotan, con estructuras, procesos y culturas propias, pero las integra en la dirección para compartir recursos y visión.', s: 'La unidad autónoma protege a los proyectos radicales de la lógica de la línea principal.', r: ['oreilly', 'march'] }
  ] },
  { n: 9, titulo: 'Evaluación y aprendizaje', pregunta: '¿Qué harían distinto si empezaran de nuevo, y qué principio lo explica?', temas: [
    { t: 'Medir la innovación', x: 'Medir permite gestionar. Indicadores como el índice de vitalidad (ventas de productos recientes sobre ventas totales) y la intensidad de innovación (gasto en innovación sobre ventas) muestran si la empresa se renueva y cuánto invierte para lograrlo.', s: 'Resultados: índice de vitalidad e intensidad de innovación por trimestre.', r: ['tidd', 'oslo'] },
    { t: 'El valor financiero de innovar', x: 'Una innovación vale lo que aportan sus flujos futuros descontados, no lo que gana en el primer trimestre. El valor terminal reconoce que una empresa con un portafolio renovado seguirá generando resultados después del horizonte analizado.', s: 'El valor de la empresa combina utilidades descontadas y valor terminal al final de T20.', r: ['brealey'] },
    { t: 'Leer los estados financieros de la innovación', x: 'Los gastos de innovación reducen la utilidad de hoy para crear ingresos mañana. Los desarrollos en curso y los intangibles aparecen en el balance, y la caja indica si la empresa puede sostener su apuesta.', s: 'Resultados: estado de resultados, flujo de efectivo y balance general trimestrales.', r: ['brealey', 'tidd'] },
    { t: 'Madurez en gestión de la innovación', x: 'Las capacidades para innovar se construyen: rutinas de búsqueda, selección, desarrollo y aprendizaje que mejoran con la práctica y la revisión sistemática de los proyectos, exitosos o fallidos.', s: 'Revisión post-proyecto: analizar un proyecto terminado eleva la madurez.', r: ['tidd'] },
    { t: 'Evaluar ideas entre pares', x: 'La creatividad de una idea se puede juzgar de forma confiable cuando varias personas que conocen el tema la califican por separado, sin ponerse de acuerdo, y se promedian sus notas: es la técnica de evaluación consensuada. Para que el juicio sea útil conviene usar criterios explícitos, como la novedad, la viabilidad y la claridad o especificidad de la idea. Cuando dos evaluadores difieren mucho, conviene revisar si entendieron lo mismo.', s: 'Decidir → Evaluar a otros equipos: califican de forma anónima los conceptos de otros dos equipos; el promedio ajusta la calidad hasta ±0,5. Lo que dijeron de los suyos está en Resultados → Evaluación de sus conceptos.', r: ['amab82', 'dean06'] },
    { t: 'El debriefing', x: 'En una simulación se aprende sobre todo en la reflexión que viene después de jugar. El debriefing es esa conversación guiada: qué pasó, por qué pasó y qué haríamos distinto. Sin ella, la experiencia queda como un juego ganado o perdido; con ella, se convierte en principios que se pueden usar en una empresa real.', s: 'Al cierre de cada año el docente proyecta una guía con los datos del curso (validación, pronósticos, tipos de innovación, investigación) y tres preguntas para discutir.', r: ['crook'] },
    { t: 'Aprender de la experiencia', x: 'Se aprende cuando la experiencia se convierte en reflexión, se conceptualiza y se vuelve a probar. Escribir hipótesis antes de decidir y contrastarlas después con los resultados es la forma de pasar del “nos fue bien” al “sabemos por qué”.', s: 'Hipótesis de cada ronda y bitácora: qué decidimos, qué pasó, por qué pasó y qué principio lo explica.', r: ['kolb', 'schon'] }
  ] }
];

function cita(k) {
  var r = REFS[k].replace(/<[^>]+>/g, ''), anio = (r.match(/\((\d{4})\)/) || [0, 's. f.'])[1], au = r.split(' (')[0].replace(/\.$/, '');
  if (/^OECD/.test(au)) return 'OECD y Eurostat, ' + anio;
  var ap = au.replace(/&/g, ',').split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x && !/^[A-Z][A-Z.\s]*$/.test(x); });
  return (ap.length === 1 ? ap[0] : ap.length === 2 ? ap[0] + ' y ' + ap[1] : ap[0] + ' et al.') + ', ' + anio;
}

  u.temas.forEach(function (t, i) {
    t.r.forEach(function (k) { if (refs.indexOf(k) < 0) refs.push(k); });
    html += '<div class="card tema"><h3>' + u.n + '.' + (i + 1) + ' ' + esc(t.t) + '</h3><p>' + esc(t.x) + '</p><p><b>En el simulador:</b> ' + esc(t.s) + '</p><p class="muted">Fuente: ' + t.r.map(cita).join('; ') + '</p></div>';
  });
  html += '<h3>Pregunta para la bitácora</h3><p>' + esc(u.pregunta) + '</p><h3>Referencias</h3>' + refs.map(function (k) { return REFS[k]; }).sort().map(function (r) { return '<p class="ref">' + r + '</p>'; }).join('') +
    '<div class="inline" style="justify-content:space-between;margin-top:10px">' + (u.n > 1 ? '<button class="btn sec" onclick="UABIERTA=' + (u.n - 1) + ';render();window.scrollTo(0,0)">← Unidad ' + (u.n - 1) + '</button>' : '<span></span>') + (u.n < 9 ? '<button class="btn sec" onclick="UABIERTA=' + (u.n + 1) + ';render();window.scrollTo(0,0)">Unidad ' + (u.n + 1) + ' →</button>' : '') + '</div></div>';
  return html;
}
var GFILTRO = '';
function vGlosario() {
  var f = GFILTRO.toLowerCase();
  var L = GLOSARIO.filter(function (g) { return !f || (g[0] + ' ' + g[1]).toLowerCase().indexOf(f) >= 0; });
  return '<div class="card"><h2>Glosario de términos</h2><label>Buscar un término</label><input type="text" id="gbus" value="' + esc(GFILTRO) + '" oninput="GFILTRO=this.value;var p=this.selectionStart;render();var e=$(\'gbus\');e.focus();e.setSelectionRange(p,p)" placeholder="Por ejemplo: disrupción, prototipo, vitalidad">' +
    '<dl class="glos">' + (L.length ? L.map(function (g) { return '<dt>' + esc(g[0]) + '</dt><dd>' + esc(g[1]) + '</dd>'; }).join('') : '<dd class="muted">No se encontró el término.</dd>') + '</dl><p class="muted">' + GLOSARIO.length + ' términos.</p></div>';
}
</script>
