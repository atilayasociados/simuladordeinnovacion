<style>
/* ===================== Estilo SimNeuro (paleta Atila y Asociados: gris, verde, naranja y amarillo; fondo grafito) ===================== */
body{font-family:'Sora',Arial,Helvetica,sans-serif}
header{background:#2A2C2E;border-bottom:4px solid #44D62C;color:#fff}
:is(body.ax-doc,body.ax-est)>header{background:#2A2C2E;border-bottom:4px solid #44D62C}
:is(body.ax-doc,body.ax-est)>header h1,header h1{font-family:'Sora',Arial,sans-serif;letter-spacing:0;font-weight:700}
.hbrand{display:flex;align-items:center;gap:12px;min-width:0}
.hlogos{display:inline-flex;gap:4px;background:#fff;border-radius:8px;padding:3px 6px;flex:none}
.hlogos img{height:30px;width:auto;display:block}
.hlogos:empty{display:none}
/* menú en dos niveles */
:is(body.ax-doc,body.ax-est) nav{background:#2E3032;border-bottom:1px solid #5A5C5E;gap:8px;padding:10px 16px}
:is(body.ax-doc,body.ax-est) nav button{display:inline-flex;align-items:center;gap:8px;font:700 15px 'Sora',Arial,sans-serif;color:#F2F3F3;border:1px solid transparent;border-radius:10px;padding:9px 16px;background:transparent}
:is(body.ax-doc,body.ax-est) nav button:hover{background:#3A3C3E}
:is(body.ax-doc,body.ax-est) nav button.on{background:#44D62C;border-color:#44D62C;color:#1F2022}
.sn-i{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px}
body.ax-est .subnav{gap:10px;margin:0 0 14px}
body.ax-est .subnav button{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid #6E7072;border-radius:999px;padding:8px 16px;color:#F2F3F3;font:600 14px 'Sora',Arial,sans-serif}
body.ax-est .subnav button.on{border-color:#44D62C;color:#7EE868;background:rgba(68,214,44,.10)}
/* encabezado de cada pantalla y recorrido */
.sn-hero{display:flex;gap:14px;align-items:center;background:#555759;background-image:linear-gradient(120deg,rgba(255,255,255,.08),rgba(255,255,255,0) 60%);box-shadow:inset 6px 0 0 #44D62C;color:#fff;border-radius:10px;padding:14px 18px;margin:0 0 12px}
.sn-hero .pic{width:56px;height:56px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#44D62C;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(68,214,44,.45)}
.sn-hero .pic .sn-i{width:28px;height:28px}
.sn-hero>div{min-width:0}
.sn-hero small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9BE38C;font-weight:700}
.sn-hero h2{margin:2px 0 2px;font-size:20px;color:#fff}
.sn-hero p{margin:0;font-size:13.5px;color:#E3E4E5}
.sn-jour{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.sn-jour a{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid #5A5C5E;color:#C9CBCC;text-decoration:none;font-size:13px;font-weight:600}
.sn-jour a.cur{border-color:#44D62C;color:#1F2022;background:#44D62C}
.sn-jour b{width:18px;height:2px;background:#5A5C5E;display:inline-block}
/* tu siguiente paso */
.sn-nxt{display:flex;gap:12px;align-items:flex-start;background:#2C4A2A;border:1px solid #44D62C;border-radius:10px;padding:12px 14px;margin:16px 0 0}
.sn-nxt .ic{color:#44D62C;flex:none;margin-top:2px}.sn-nxt .ic .sn-i{width:24px;height:24px}
.sn-nxt small{display:block;color:#8FE37F;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sn-nxt b{display:block;font-size:1rem;margin-top:2px;color:#fff}
.sn-nxt p{margin:4px 0 0;font-size:.9rem;color:#E3E4E5}
.sn-nxt>div{min-width:0}
.sn-btn{display:inline-block;margin-top:8px;background:#44D62C;color:#1F2022!important;font-weight:700;border-radius:8px;padding:7px 12px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;font-size:14px}
/* recuadros de ayuda: estilo «en palabras sencillas» */
:is(body.ax-doc,body.ax-est) .ayuda{background:rgba(255,206,0,.10);color:#F2F3F3;border-left:4px solid #FFCE00}
:is(body.ax-doc,body.ax-est) .ayuda a,:is(body.ax-doc,body.ax-est) a{color:#8FE37F}

body.ax-est footer.acciones{background:#2A2C2E;border-top:1px solid #5A5C5E;box-shadow:0 -2px 10px rgba(0,0,0,.35);color:#F2F3F3}

body.ax-est .ent-acc{background:#46484A;border-left-color:#44D62C}
body.ax-est .ent-g{background:#3A3C3E;border-color:#5A5C5E}body.ax-est .ent-g legend,body.ax-est .ent-acc-t{color:#9BE38C}
body.ax-est .ent-not{border-bottom-color:#5A5C5E}
body.ax-est .como{color:#E3E4E5}
body.ax-est .enl-ef a{background:#3A3C3E;border-color:#5A5C5E;color:#9BE38C}
body.ax-est table.crono td.cw.on{background:#44D62C}body.ax-est table.crono tr.carga td.cw{background:#46484A}body.ax-est table.crono tr.carga td.cw.sobre{background:#FF4C00;color:#fff}
body.ax-est .inv-proy,body.ax-est .okc{color:#8FE37F}
body.ax-est li.aviso-l{color:#FFCE00}
body.ax-est p.err,body.ax-est span.err{color:#FF8A5C}
body.ax-est th.sub-g{background:#46484A;color:#F2F3F3}
body.ax-est th.a0,body.ax-est td.a0{background:#333537;color:#C9CBCC}
body.ax-est .paso-a{border-top-color:#5A5C5E}
/* zonas donde decide el equipo: se mantienen en ámbar para distinguirlas, con texto oscuro */
body.ax-est{--dec:#FFE9A6;--dec-borde:#FFCE00;--dec-zona:rgba(255,206,0,.08)}
body.ax-est #app input[data-p]:not([type=checkbox]):not([type=radio]),body.ax-est #app input[data-campo],body.ax-est #app input[data-cron],body.ax-est #app select[data-p],body.ax-est #app select[data-campo],body.ax-est #app select[data-cron],body.ax-est #app textarea[data-p],body.ax-est #app input[id^="np"],body.ax-est #app select[id^="np"],body.ax-est #app textarea[id^="np"]{color:#1F2022}

body.ax-est #app input[data-p]:disabled,body.ax-est #app select[data-p]:disabled,body.ax-est #app textarea[data-p]:disabled{background:#46484A;color:#C9CBCC;border-color:#5A5C5E}

body.ax-est .tarea{color:#F2F3F3}
body.ax-est .leyenda-dec{color:#C9CBCC}

:is(body.ax-doc,body.ax-est) .card h2{font-family:'Sora',Arial,sans-serif;letter-spacing:0;color:#9BE38C;font-size:17px}
:is(body.ax-doc,body.ax-est) .card h3{color:#F2F3F3}
:is(body.ax-doc,body.ax-est) main .msg{top:70px}
body.ax-est main * .msg{position:static;top:auto;right:auto;max-width:none;box-shadow:none;margin:10px 0 0;z-index:auto}
body.ax-est footer .muted[style*="b42318"]{color:#FF8A5C!important}
body.ax-est footer .muted{color:#C9CBCC}
@media (max-width:600px){.sn-jour{display:none}.hlogos img{height:22px}:is(body.ax-doc,body.ax-est) nav button{padding:8px 11px;font-size:14px}.sn-hero{padding:12px}.sn-hero .pic{width:44px;height:44px}.sn-hero h2{font-size:17px}}

// ===================== Estilo SimNeuro: iconos, encabezado de pantalla, recorrido y «Tu siguiente paso» =====================
function SN_ico(n) { return '<svg class="sn-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (SN_P[n] || SN_P.compass) + '</svg>'; }
var SN_GICO = { sit: 'compass', dec: 'pen', res: 'chart', apr: 'grad' };
var SN_SICO = { inicio: 'bag', informes: 'radio', equipo: 'user', comite: 'users', proyectos: 'bulb', productos: 'cart', compraEstudio: 'eye', trimestre: 'trend', estados: 'clip', resMercado: 'target', aprender: 'book' };
var SN_AICO = { simulaciones: 'gear', partida: 'repeat', equipos: 'users', vida: 'trend', ranking: 'chart', resultados: 'target', docentes: 'school', cuenta: 'key' };
// Orden de trabajo de un trimestre: [pantalla, qué es, título del siguiente paso, qué hacer, pantalla a la que lleva]
var SN_PASOS = [
  ['inicio', 'Conozcan su empresa láctea, su presupuesto de innovación del año y cómo se juega.', 'Revisen el entorno', 'En Situación → Entorno lean las noticias que afectan a todas las empresas y el informe del macroentorno.', 'informes'],
  ['informes', 'Noticias e informe del macroentorno que afectan a todas las empresas.', 'Revisen su equipo', 'En Situación → Mi equipo confirmen quiénes integran el equipo.', 'equipo'],
  ['equipo', 'Integrantes del equipo y contraseña.', 'Armen el comité de innovación', 'En Decisión → Comité definan quiénes integran el comité y qué porcentaje de su tiempo dedican.', 'comite'],
  ['comite', 'Quiénes integran el comité y qué porcentaje de su tiempo dedican a innovar.', 'Planifiquen sus proyectos', 'En Decisión → Proyectos escriban la idea, el producto propuesto, la hoja de costos y el Gantt de cada proyecto.', 'proyectos'],
  ['proyectos', 'La idea, el producto propuesto, la hoja de costos, el Gantt y las compuertas de cada proyecto.', 'Decidan sobre sus productos', 'En Decisión → Productos fijen el precio, los canales, la publicidad y la producción semanal.', 'productos'],
  ['productos', 'Precio, canales, publicidad y producción semanal de cada producto en el mercado.', 'Decidan si compran el estudio de mercado', 'Es opcional y de pago. Después, abajo, toquen «Enviar decisiones».', 'compraEstudio'],
  ['compraEstudio', 'Estudio de mercado y competencia de pago (opcional).', 'Envíen sus decisiones', 'Abajo toquen «Enviar decisiones». Cuando el docente procese el trimestre, vean lo que pasó en Resultados → Trimestre.', 'trimestre'],

  ['estados', 'Estados financieros de la empresa.', 'Revisen los estudios de mercado', 'En Resultados → Estudio de mercado lean los estudios que recibieron.', 'resMercado'],
  ['resMercado', 'Estudios de mercado que recibieron.', 'Repasen los conceptos', 'En Aprender → Unidades de aprendizaje revisen los conceptos de innovación que usa el simulador.', 'aprender'],
  ['aprender', 'Los conceptos de innovación que usa el simulador, con su fuente.', 'Preparen el siguiente trimestre', 'Vuelvan a Decisión → Comité y ajusten sus decisiones con lo que aprendieron.', 'comite']
];
function SN_paso(t) { for (var i = 0; i < SN_PASOS.length; i++) if (SN_PASOS[i][0] === t) return i; return -1; }
function SN_nombre(t) { var n = t; VR_MENU.forEach(function (m) { m[2].forEach(function (x) { if (x[0] === t) n = x[1]; }); }); return n; }
function SN_hero(t) {
  var m = VR_menuDe(t), i = SN_paso(t);
  var jour = '<div class="sn-jour" role="navigation" aria-label="Recorrido del trimestre">' + VR_MENU.map(function (g, k) { return (k ? '<b aria-hidden="true"></b>' : '') + '<a href="#" class="' + (g[0] === m[0] ? 'cur' : '') + '"' + (g[0] === m[0] ? ' aria-current="step"' : '') + ' onclick="VR_ir(\'' + g[0] + '\');return false">' + SN_ico(SN_GICO[g[0]]) + esc(g[1]) + '</a>'; }).join('') + '</div>';
  return '<div class="sn-hero"><div class="pic">' + SN_ico(SN_SICO[t]) + '</div><div><small>' + esc(m[1]) + (i >= 0 ? ' · Paso ' + (i + 1) + ' de ' + SN_PASOS.length : '') + '</small><h2>' + esc(SN_nombre(t)) + '</h2>' + (i >= 0 ? '<p>' + esc(SN_PASOS[i][1]) + '</p>' : '') + '</div></div>';

  var i = SN_paso(t); if (i < 0) return '';

}
