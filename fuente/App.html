<script>
// ===================== Simulador de Innovación — cliente =====================
var TOK = null, ROL = null, V = null, D = null, TAB = 'panel', ADM = null, ATAB = 'partida', estTimer = null, EST = null;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function bs(n) { return 'Bs ' + Math.round(Number(n) || 0).toLocaleString('es-BO'); }
function kbs(n) { return Math.round((Number(n) || 0) / 1000).toLocaleString('es-BO'); }
function pct(n) { return (n === null || n === undefined || n === '') ? '—' : (Number(n).toFixed(1) + ' %'); }
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ko) { google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { ko(e && e.message ? e.message : String(e)); })[fn].apply(null, args); });
}
function aviso(txt, tipo) { var d = document.createElement('div'); d.className = 'msg ' + (tipo || 'ok'); d.textContent = txt; $('app').prepend(d); setTimeout(function () { d.remove(); }, 9000); window.scrollTo(0, 0); }
function getP(o, path) { return path.split('.').reduce(function (a, k) { return a && a[k] !== undefined ? a[k] : undefined; }, o); }
function setP(o, path, v) { var ks = path.split('.'), a = o; for (var i = 0; i < ks.length - 1; i++) { if (typeof a[ks[i]] !== 'object' || a[ks[i]] === null) a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length - 1]] = v; }

// ---------- ingreso: ver AccesoUI.html (v2.3) ----------
function pantallaLogin(modo) {
  if (TOK) { try { call('apiAXSalir', TOK).catch(function () { }); } catch (e) { } }
  if (typeof vigilarApertura === 'function') vigilarApertura(false);
  TOK = null; ROL = null; V = null; ADM = null; SIMID = null;
  document.body.classList.remove('ax-doc');
  $('nav').style.display = 'none'; $('pie').style.display = 'none'; $('meta').innerHTML = ''; $('titulo').textContent = 'Simulador de Innovación'; $('app').innerHTML = '';
  AX_mostrar(modo || 'ingresar');
}

// ---------- equipo ----------
function cargar() {
  $('app').innerHTML = '<p class="muted">Cargando…</p>';
  call('apiEstado', TOK).then(function (v) {
    V = v; D = v.borrador ? JSON.parse(JSON.stringify(v.borrador)) : {};
    delete D._estado; delete D._fecha;
    prepararBorrador();
    if (TAB === 'inicio') TAB = V.estado.hist.length ? 'panel' : 'caso';
    render(); estimar();
  }).catch(function (e) { $('app').innerHTML = '<div class="msg err">' + esc(e) + '</div>'; if (/sesión/.test(e)) setTimeout(pantallaLogin, 1500); });
}
// Mientras el trimestre está cerrado, revisa cada 30 s si el docente ya lo abrió y actualiza sola.
var VIGIA = null;
function vigilarApertura(activar) {
  if (!activar) { if (VIGIA) { clearInterval(VIGIA); VIGIA = null; } return; }
  if (VIGIA) return;
  VIGIA = setInterval(function () {
    if (!TOK || ROL === 'docente' || document.hidden) return;
    call('apiEstado', TOK).then(function (v) {
      if (!V || v.partida.estado !== 'abierto' || (v.partida.t === V.partida.t && V.partida.estado === 'abierto')) return;
      vigilarApertura(false); V = v; D = v.borrador ? JSON.parse(JSON.stringify(v.borrador)) : {}; delete D._estado; delete D._fecha;
      prepararBorrador(); render(); estimar(); aviso('El docente abrió el trimestre ' + v.partida.t + ': ya pueden decidir.', 'ok');
    }).catch(function () { });
  }, 30000);
}
function prepararBorrador() {
  D.noticias = D.noticias || {}; D.proyectos = D.proyectos || {}; D.productos = D.productos || {}; D.respuestas = D.respuestas || {}; D.acciones = D.acciones || {}; D.decInformes = D.decInformes || {};
  (V.estado.informes || []).forEach(function (i) { if (i.requiere && i.t === V.partida.t - 1 && D.decInformes[i.id] === undefined && i.decision) D.decInformes[i.id] = i.decision; });
  D.investigacion = D.investigacion || { metodos: [], segmentos: [] };
  D.investigacion.metodos = D.investigacion.metodos || []; D.investigacion.segmentos = D.investigacion.segmentos || [];
  D.nuevosProyectos = D.nuevosProyectos || [];
  D._ini = D._ini || {};
  var O = V.estado.org;
  // La estrategia anual empieza en blanco: la decide el equipo (puede copiar la del año anterior).
  if (V.flags.anualEditable && !D.anual) D.anual = { p4: { producto: '', proceso: '', posicion: '', paradigma: '' }, nucleo: '', adyacente: '', transf: '', postura: '', estructura: '', tiempoLibre: '', incentivo: '', politica: '', composicion: '', capacitacion: '', umbral: '', hipotesis: '' };
  V.estado.productos.forEach(function (p) {
    if (!D.productos[p.id]) D.productos[p.id] = { precio: p.precio, comunicacion: p.comunicacion || 0, segPub: p.segPub || 'todos', promo: 0, pronostico: '', canales: p.canales.slice(), retirar: false };
    var dp = D.productos[p.id]; if (dp.segPub === undefined) dp.segPub = p.segPub || 'todos'; if (dp.promo === undefined) dp.promo = 0;
  });
  V.estado.proyectos.forEach(function (p) {
    if (p.estado !== 'activo') return;
    var a = D.proyectos[p.id] = D.proyectos[p.id] || {};
    a.validar = a.validar || [];
    if (!a.prototipo) a.prototipo = { fidelidad: 'baja', iteraciones: p.etapa === 'prototipo' ? 1 : 0 };
    if (!a.lanzar) a.lanzar = { nombre: p.ideaSel ? p.ideaSel.nombre : p.nombre, precio: '', canales: [], proteccion: 'ninguna', comunicacion: 20000 };
  });
  if (typeof prepararBorrador2 === 'function') prepararBorrador2();
}
function decisionLimpia() {
  var d = JSON.parse(JSON.stringify(D));
  Object.keys(d.proyectos).forEach(function (pid) {
    var a = d.proyectos[pid];
    a.iniciativas = Object.keys((D._ini || {})[pid] || {}).map(function (id) { return { id: id, premio: D._ini[pid][id] }; });
    if (!a.lanzarOn) delete a.lanzar; else if (a.lanzar && (!a.lanzar.canales || !a.lanzar.canales.length)) a.lanzar.canales = null;
    if (!a.prototipo || !(Number(a.prototipo.iteraciones) > 0)) delete a.prototipo;
    if (!a.seleccionar) delete a.seleccionar;
    delete a.lanzarOn;
  });
  if (!V.flags.anualEditable) delete d.anual;
  delete d._ini;
  if (typeof limpiar2 === 'function') limpiar2(d);
  return d;
}
function estimar() {
  clearTimeout(estTimer);
  estTimer = setTimeout(function () {
    if (!V || V.partida.finalizada) return;
    call('apiEstimar', TOK, decisionLimpia()).then(function (e) { EST = e; pie(); }).catch(function () { });
  }, 500);
}
function guardar(enviar) {
  call('apiGuardar', TOK, decisionLimpia(), enviar).then(function (e) {
    EST = e; pie(); aviso(enviar ? 'Decisiones enviadas. Puedes seguir modificándolas hasta que el docente cierre el trimestre.' : 'Borrador guardado.');
    V.borrador = { _estado: e.estado }; pie();
  }).catch(function (e) { aviso(e, 'err'); });
}
function pie() {
  if (!V || V.partida.finalizada || ROL !== 'equipo' || menuDe(TAB)[0] !== 'decidir' || V.partida.estado !== 'abierto') { $('pie').style.display = 'none'; return; }
  $('pie').style.display = 'flex';
  var abierto = V.partida.estado === 'abierto';
  var e = EST || { costo: 0, semanas: 0, saldo: V.estado.saldo, semanasDisp: V.cat.general.semanasTrimestre, avisos: [] };
  var est = V.borrador && V.borrador._estado ? '<span class="tag ' + (V.borrador._estado === 'enviado' ? 'ok' : 'aviso') + '">' + esc(V.borrador._estado) + '</span>' : '<span class="tag">sin guardar</span>';
  $('pie').innerHTML = '<div class="est">Costo estimado de innovación: <b>' + bs(e.costo) + '</b> de ' + bs(e.saldo) + ' · Semanas-persona: <b>' + e.semanas + '</b> de ' + e.semanasDisp + ' ' + est +
    (e.avisos && e.avisos.length ? '<div class="avisos">⚠ ' + e.avisos.map(esc).join('<br>⚠ ') + '</div>' : '') + '</div>' +
    '<div class="inline">' + (abierto ? '<button class="btn sec" onclick="guardar(false)">Guardar borrador</button><button class="btn" onclick="guardar(true)">Enviar decisiones</button>' : '<span class="tag aviso">Trimestre cerrado por el docente</span>') +
    '<button class="btn sec" onclick="cargar()">Actualizar</button></div>';
}

var MENUS = [
  ['situacion', 'Situación', [['caso', 'El caso'], ['panel', 'Situación actual'], ['mercado', 'Mercado y competencia'], ['equipo', 'Mi equipo']]],
  ['decidir', 'Decidir', [['ronda', 'Qué decidir en esta ronda'], ['entorno', '1. Entorno'], ['anual', '2. Estrategia anual'], ['investigacion', '3. Investigación'], ['proyectos', '4. Proyectos'], ['productos', '5. Productos'], ['pares', 'Evaluar a otros equipos'], ['hipotesis', '6. Hipótesis y envío']]],
  ['resultados', 'Resultados', [['resumen', 'Resumen del trimestre'], ['informes', 'Informes de investigación'], ['evaluaciones', 'Evaluación de sus conceptos'], ['resultados', 'Estados financieros e indicadores']]],
  ['aprender', 'Aprender', [['manual', 'Manual del estudiante'], ['temas', 'Temas de innovación'], ['glosario', 'Glosario'], ['bitacora', 'Mi bitácora']]]
];
function menuDe(t) { for (var i = 0; i < MENUS.length; i++) for (var j = 0; j < MENUS[i][2].length; j++) if (MENUS[i][2][j][0] === t) return MENUS[i]; return MENUS[0]; }
function irTab(t) { TAB = t; render(); window.scrollTo(0, 0); }
function render() {
  var p = V.partida, M = menuDe(TAB);
  $('titulo').textContent = p.nombre || 'Simulador de Innovación';
  $('meta').innerHTML = '<span>' + esc(V.usuario.nombre) + ' · ' + esc(V.equipo.nombre) + '</span><span>' + esc(p.sigla || '') + '</span><span>' + (p.finalizada ? 'Partida terminada' : 'Trimestre ' + p.t + ' de ' + p.total + ' (año ' + (Math.floor((p.t - 1) / 4) + 1) + ')') + '</span><span>' + (p.estado === 'abierto' ? 'Abierto' : 'Cerrado') + '</span><span>Presupuesto: ' + bs(V.estado.saldo) + '</span><button class="btn-manual" onclick="irManual(MANUAL_DE[TAB] || \'inicio\')" title="Abrir el Manual del estudiante">📘 Manual</button><a href="#" style="color:#fff" onclick="pantallaLogin();return false">Salir</a>';
  $('nav').style.display = 'block';
  $('nav').innerHTML = '<div class="menu">' + MENUS.map(function (m) { return '<button class="' + (M[0] === m[0] ? 'on' : '') + '" onclick="irTab(\'' + m[2][0][0] + '\')">' + m[1] + '</button>'; }).join('') + '</div>' +
    '<div class="sub">' + M[2].map(function (t) { return '<button class="' + (TAB === t[0] ? 'on' : '') + '" onclick="irTab(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('') + '</div>';
  var f = { caso: vCaso, panel: vPanel, mercado: vMercado, equipo: vEquipo, ronda: vRonda, entorno: vEntorno, anual: vAnual, investigacion: vInvestigacion, proyectos: vProyectos2, productos: vProductos, hipotesis: vHipotesis, resumen: vResumen, informes: vInformes, pares: P4_vPares, evaluaciones: P4_vEvaluaciones, resultados: vResultados, temas: vTemas, glosario: vGlosario, bitacora: vBitacora, manual: vManual }[TAB] || vCaso;
  var cerrado = M[0] === 'decidir' && (V.partida.estado !== 'abierto' || p.finalizada);
  vigilarApertura(V.partida.estado !== 'abierto' && !p.finalizada);
  var html = cerrado ? vDecidirCerrado() : f();
  if (M[0] === 'decidir' && TAB !== 'ronda' && !cerrado) {
    var L = M[2], k = L.map(function (t) { return t[0]; }).indexOf(TAB);
    html += '<div class="inline" style="justify-content:space-between">' + (k > 1 ? '<button class="btn sec" onclick="irTab(\'' + L[k - 1][0] + '\')">← ' + L[k - 1][1] + '</button>' : '<span></span>') + (k < L.length - 1 ? '<button class="btn sec" onclick="irTab(\'' + L[k + 1][0] + '\')">' + L[k + 1][1] + ' →</button>' : '') + '</div>';
  }
  if (typeof enlaceManual === 'function' && TAB !== 'manual') html = enlaceManual(cerrado ? 'ronda' : TAB) + html;
  $('app').innerHTML = html;
  if (TAB === 'bitacora') cargarBitacora(); if (TAB === 'equipo') cargarMiEquipo();
  if (TAB === 'pares' && !cerrado) P4_cargarPares(); if (TAB === 'evaluaciones') P4_cargarMias();
  pie();
}

// enlaces de formularios
document.addEventListener('change', function (ev) {
  var el = ev.target; if (!D || ROL !== 'equipo') return;
  if (el.dataset.p) {
    var v = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value);
    setP(D, el.dataset.p, v);
  } else if (el.dataset.arr) {
    var arr = getP(D, el.dataset.arr); if (!Array.isArray(arr)) { arr = []; setP(D, el.dataset.arr, arr); }
    var i = arr.indexOf(el.value);
    if (el.checked && i < 0) arr.push(el.value); if (!el.checked && i >= 0) arr.splice(i, 1);
    if (el.dataset.max && arr.length > Number(el.dataset.max)) { arr.splice(arr.indexOf(el.value), 1); el.checked = false; aviso('Máximo ' + el.dataset.max + ' opciones.', 'err'); }
  } else if (el.dataset.ini) {
    var pid = el.dataset.ini, id = el.value; D._ini[pid] = D._ini[pid] || {};
    if (el.checked) { if (Object.keys(D._ini[pid]).length >= 3) { el.checked = false; aviso('Máximo 3 iniciativas por proyecto y trimestre.', 'err'); return; } D._ini[pid][id] = 'medio'; }
    else delete D._ini[pid][id];
  } else if (el.dataset.premio) {
    var pr = el.dataset.premio.split('|'); D._ini[pr[0]] = D._ini[pr[0]] || {}; if (D._ini[pr[0]][pr[1]] !== undefined) D._ini[pr[0]][pr[1]] = el.value;
  } else if (el.dataset.not) { D.noticias[el.dataset.not] = el.value; }
  else if (el.dataset.resp) { D.respuestas[el.dataset.resp] = el.value; }
  else return;
  if (el.dataset.rerender) render();
  estimar();
});
function inp(path, tipo, attrs) { var v = getP(D, path); return '<input type="' + (tipo || 'text') + '" data-p="' + path + '" value="' + esc(v === undefined ? '' : v) + '" ' + (attrs || '') + '>'; }
function sel(path, opts, attrs) { var v = getP(D, path); return '<select data-p="' + path + '" ' + (attrs || '') + '>' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(v) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>'; }
function chkB(path, txt, attrs) { return '<label class="chk"><input type="checkbox" data-p="' + path + '"' + (getP(D, path) ? ' checked' : '') + ' ' + (attrs || '') + '><span>' + txt + '</span></label>'; }
function chkA(path, val, txt, max) { var a = getP(D, path) || []; return '<label class="chk"><input type="checkbox" data-arr="' + path + '" value="' + esc(val) + '"' + (a.indexOf(val) >= 0 ? ' checked' : '') + (max ? ' data-max="' + max + '"' : '') + '><span>' + txt + '</span></label>'; }
function txtA(path, ph) { return '<textarea data-p="' + path + '" placeholder="' + esc(ph || '') + '">' + esc(getP(D, path) || '') + '</textarea>'; }
function segNom(id) { var s = V.cat.segmentos.filter(function (x) { return x.id === id; })[0]; return s ? s.id + ' ' + s.nombre : id; }
function canNom(id) { var c = V.cat.canales.filter(function (x) { return x.id === id; })[0]; return c ? c.nombre : id; }
function ultimo() { var h = V.estado.hist; return h.length ? h[h.length - 1] : null; }

// ---------- Panel ----------
function vPanel() {
  var h = ultimo(), O = V.estado.org, html = '';
  if (V.partida.finalizada) html += '<div class="card"><h2>Partida terminada</h2><p>Revisa tus resultados finales en la pestaña Resultados y completa tu bitácora.</p></div>';
  html += '<div class="card"><h2>Mandato del directorio</h2><p><b>' + esc(V.equipo.mandato.nombre) + '.</b> ' + esc(V.equipo.mandato.texto) + '</p></div>';
  html += '<div class="grid g4">' + [
    ['Ventas último trimestre', h ? bs(h.ventas) : '—'], ['Utilidad neta', h ? bs(h.utilidadNeta) : '—'], ['Caja', h ? bs(h.caja) : bs(400000)],
    ['Participación de mercado', h ? pct(h.cuotaTotal) : pct(11.2 / nEmp())], ['Índice de vitalidad', h ? pct(h.vitalidad) : '0 %'], ['Clima creativo', h ? h.clima : '—'],
    ['Presupuesto disponible', bs(V.estado.saldo)], ['Madurez en innovación', O.madurez + ' de 5']
  ].map(function (k) { return '<div class="kpi"><div class="v">' + k[1] + '</div><div class="l">' + k[0] + '</div></div>'; }).join('') + '</div>';
  html += '<div class="card" style="margin-top:14px"><h2>Este trimestre</h2><ul class="fb">' + avisosRonda().map(function (a) { return '<li>' + a + '</li>'; }).join('') + '</ul><div class="inline"><button class="btn" onclick="irTab(\'ronda\')">Ir a Decidir</button>' + (h ? '<button class="btn sec" onclick="irTab(\'resumen\')">Ver qué pasó el trimestre anterior</button>' : '') + '</div></div>';
  html += '<div class="card"><h2>Tus productos</h2>' + tablaProductos() + '</div>';
  var act = V.estado.proyectos.filter(function (p) { return p.estado === 'activo'; });
  html += '<div class="card"><h2>Tus proyectos de innovación</h2>' + (act.length ? '<table><tr><th>Proyecto</th><th>Segmento</th><th>Etapa</th><th class="n">Iteraciones</th></tr>' + act.map(function (p) { return '<tr><td>' + esc(p.nombre) + '</td><td>' + esc(segNom(p.segmento)) + '</td><td>' + esc((ETAPAS.filter(function (e) { return e[0] === p.etapa; })[0] || [0, p.etapa])[1]) + '</td><td class="n">' + p.iter + '</td></tr>'; }).join('') + '</table>' : '<p class="muted">No tienes proyectos activos. Puedes crearlos en Decidir → 4. Proyectos.</p>') + '</div>';
  return html;
}
function tablaProductos() {
  var ps = V.estado.productos, A = V.cat.attrs;
  return '<div class="scroll"><table><tr><th>Producto</th>' + Object.keys(A).map(function (k) { return '<th class="n">' + A[k] + '</th>'; }).join('') + '<th class="n">Precio</th><th class="n">Costo</th><th>Canales</th><th>Modelo</th><th class="n">Conocimiento de marca</th></tr>' +
    ps.map(function (p) { return '<tr><td>' + esc(p.nombre) + (p.desde > V.partida.t - 1 && !p.legado ? ' <span class="tag">nuevo</span>' : '') + '</td>' + Object.keys(A).map(function (k) { return '<td class="n">' + Number(p.attrs[k]).toFixed(1) + '</td>'; }).join('') + '<td class="n">' + Number(p.precio).toFixed(2) + '</td><td class="n">' + Number(p.costUnit).toFixed(2) + '</td><td>' + p.canales.map(canNom).join(', ') + '</td><td>' + (p.modelo === 'suscripcion' ? 'Suscripción' : 'Venta') + '</td><td class="n">' + Math.round(p.AW * 100) + ' %</td></tr>'; }).join('') + '</table></div><p class="muted">Atributos en escala 0–10. Precio y costo en Bs por litro.</p>';
}
function grafico() {
  var H = V.estado.hist; if (!H.length) return '';
  var W = 700, Hh = 200, pad = 40, ser = [['Ventas', H.map(function (h) { return h.ventas; }), '#1F3864'], ['Ventas sin innovar', H.map(function (h) { return h.twin.ventas; }), '#9AA5B8'], ['Utilidad neta', H.map(function (h) { return h.utilidadNeta; }), '#1E7B46'], ['Utilidad sin innovar', H.map(function (h) { return h.twin.utilidadNeta; }), '#A7D3B8']];
  var all = [].concat.apply([], ser.map(function (s) { return s[1]; })), mx = Math.max.apply(null, all.concat([1])), mn = Math.min.apply(null, all.concat([0]));
  var n = Math.max(2, H.length), x = function (i) { return pad + i * (W - pad - 10) / (n - 1); }, y = function (v) { return Hh - 20 - (v - mn) * (Hh - 40) / (mx - mn || 1); };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" width="100%" role="img" aria-label="Gráfico de ventas y utilidad"><line x1="' + pad + '" y1="' + y(0) + '" x2="' + (W - 10) + '" y2="' + y(0) + '" stroke="#ccc"/>';
  ser.forEach(function (s) { svg += '<polyline fill="none" stroke="' + s[2] + '" stroke-width="2" ' + (/sin/.test(s[0]) ? 'stroke-dasharray="4 3"' : '') + ' points="' + s[1].map(function (v, i) { return x(i) + ',' + y(v); }).join(' ') + '"/>'; });
  H.forEach(function (h, i) { svg += '<text x="' + x(i) + '" y="' + (Hh - 4) + '" text-anchor="middle">T' + h.t + '</text>'; });
  svg += '<text x="2" y="' + (y(mx) + 4) + '">' + kbs(mx) + 'k</text><text x="2" y="' + (y(0) + 4) + '">0</text></svg>';
  return svg + '<div class="inline muted">' + ser.map(function (s) { return '<span><span style="display:inline-block;width:12px;height:3px;background:' + s[2] + ';vertical-align:middle"></span> ' + s[0] + '</span>'; }).join(' ') + '</div>';
}

// ---------- Entorno ----------
function vEntorno() {
  var g = V.cat.general;
  var AC = V.cat.accionesEntorno || [];
  var html = '<div class="card"><h2>Noticias del trimestre</h2><p>Para cada noticia decidan tres cosas: <b>qué es</b> (oportunidad, amenaza o ruido), <b>qué postura toman</b> (ignorar, vigilar o actuar) y, si actúan, <b>qué acción</b> eligen y por qué. Algunas noticias son ruido. Las marcadas como "anticipada" llegan antes gracias a su vigilancia.</p>' +

// ---------- Mercado y competencia ----------
function vMercado() {
  var E = V.estado, html = '<div class="card"><h2>Empresas de la industria</h2>' + tablaEmpresas() + '<p class="muted">Las ventas y la participación de las otras empresas del curso no son públicas: se conocen con el "Estudio de la industria" y lo que ofrecen, con el "Análisis de competidores" (Decidir → 3. Investigación).</p></div>';
  html += '<div class="card"><h2>Lo que sabemos de cada segmento</h2><div class="scroll"><table><tr><th>Segmento</th><th class="n">Tamaño del mercado</th><th class="n">Crecimiento por trimestre</th><th class="n">Precio de referencia (Bs por litro)</th><th>Conocimiento (calidad del insight)</th><th>Pesos observados</th></tr>' +
    V.cat.segmentos.map(function (s) {
      var k = E.conocimiento.pesos[s.id], iq = E.iq[s.id] || 0;
      var pes = k ? Object.keys(k.pesos).map(function (a) { return (a === 'precio' ? 'Precio' : V.cat.attrs[a]) + ' ' + k.pesos[a]; }).join(', ') + ' <span class="muted">(' + esc(k.metodo) + ', T' + k.t + ')</span>' : '<span class="muted">Sin investigar</span>';
      var lat = E.conocimiento.latentes && E.conocimiento.latentes[s.id] ? '<br><span class="tag ok">Necesidad latente: ' + E.conocimiento.latentes[s.id].join(', ') + '</span>' : '';
      return '<tr><td>' + esc(s.id + ' ' + s.nombre) + (s.nuevo ? ' <span class="tag">nuevo para la empresa</span>' : '') + '</td><td class="n">' + Math.round(s.part * 100) + ' %</td><td class="n">' + (s.g * 100).toFixed(0) + ' %</td><td class="n">Bs ' + s.pref.toFixed(2) + '</td><td><div class="bar"><i style="width:' + Math.round(iq * 100) + '%"></i></div><span class="muted">' + Math.round(iq * 100) + ' %</span></td><td>' + pes + lat + '</td></tr>';
    }).join('') + '</table></div>' + (E.conocimiento.tendencia ? '<p><b>Tendencia:</b> ' + esc(E.conocimiento.tendencia) + '</p>' : '') + '</div>';
  var infs = (E.informes || []).filter(function (i) { return i.datos; });
  ['industria', 'competidores', 'percepcion'].forEach(function (mid) {
    var u = infs.filter(function (i) { return i.metodo === mid; }).sort(function (a, b) { return b.t - a.t; })[0];
    if (u) html += '<div class="card"><h2>' + esc(u.nombre) + ' (T' + u.t + ')</h2>' + hallazgos(u) + '<p class="muted">Dato de T' + u.t + (u.t < V.partida.t - 2 ? ': tiene más de un trimestre de antigüedad.' : '.') + ' Informe completo en Resultados → Informes de investigación.</p></div>';
  });
  if (E.conocimiento.competidores && E.conocimiento.competidores.lista) {
    var C = E.conocimiento.competidores;
    html += '<div class="card"><h2>Competidores (análisis de T' + C.t + ')</h2><table><tr><th>Competidor</th>' + Object.keys(V.cat.attrs).map(function (a) { return '<th class="n">' + V.cat.attrs[a] + '</th>'; }).join('') + '<th class="n">Precio</th></tr>' +
      C.lista.map(function (c) { return '<tr><td>' + esc(c.nombre) + '</td>' + Object.keys(V.cat.attrs).map(function (a) { return '<td class="n">' + Number(c.attrs[a]).toFixed(1) + '</td>'; }).join('') + '<td class="n">' + c.precio.toFixed(2) + '</td></tr>'; }).join('') + '</table></div>';
  }
  html += '<div class="card"><h2>Canales de venta</h2><table><tr><th>Canal</th><th class="n">Costo de presencia por trimestre</th></tr>' + V.cat.canales.map(function (c) { return '<tr><td>' + esc(c.nombre) + '</td><td class="n">' + (c.costo ? bs(c.costo) : 'Incluido') + '</td></tr>'; }).join('') + '</table><p class="muted">Cada canal llega mejor a ciertos segmentos. Descubrir esa afinidad es parte de tu investigación.</p></div>';
  html += '<div class="card"><h2>Tus productos frente al mercado</h2>' + tablaProductos() + '</div>';
  return html;
}

// ---------- Proyectos ----------
var ETAPAS = [['ideacion', 'Ideación y selección'], ['prototipo', 'Prototipo y validación'], ['lanzado', 'Lanzado']];
var ENFOQUES = {
  incremental: ['Incremental', 'Mejorar el producto actual para sus clientes (nuevo sabor, envase, menos azúcar). Menos riesgo, resultados más rápidos.'],
  radical: ['Radical', 'Crear un producto nuevo y distinto, con nuevas características o un nuevo modelo. Más riesgo y más potencial.'],
  disruptiva: ['Disruptiva', 'Un producto más simple, práctico y barato para quienes hoy no compran o compran poco (por ejemplo, universitarios u oficinistas), que luego puede crecer hacia los demás.']
};
var FASES_DT = [['Empatizar', 'Investigación del segmento (paso 3)'], ['Definir', 'El reto "¿Cómo podríamos…?"'], ['Idear', 'Iniciativas para generar ideas'], ['Evaluar', 'Validar ideas y elegir una'], ['Prototipar', 'Iteraciones de prototipo'], ['Implementar', 'Piloto y lanzamiento']];
function vProyectos() {
  var E = V.estado, g = V.cat.general, O = E.org, html = '';
  var act = E.proyectos.filter(function (p) { return p.estado === 'activo'; });
  html += '<div class="card"><h2>Cómo funciona un proyecto de innovación</h2><p>Cada proyecto sigue las fases del <b>Design Thinking</b> y avanza un poco cada trimestre:</p><div class="etapas">' + FASES_DT.map(function (f, i) { return '<span class="hecho" title="' + esc(f[1]) + '">' + (i + 1) + '. ' + f[0] + '</span>'; }).join('') + '</div>' +
    '<ol><li><b>Empatizar:</b> investiguen el segmento en el paso 3.</li><li><b>Definir:</b> al crear el proyecto escriben el reto y eligen el tipo de innovación.</li><li><b>Idear:</b> eligen hasta 3 iniciativas (talleres, concursos, startups) que generan ideas; las verán al recibir los resultados.</li><li><b>Evaluar:</b> validan las ideas más prometedoras y eligen una.</li><li><b>Prototipar:</b> iteran el prototipo; cada iteración mejora el producto.</li><li><b>Implementar:</b> si supera la puerta, hacen un piloto y lo lanzan.</li></ol>' +
    ayuda('Un proyecto completo suele tomar de 3 a 5 trimestres.', 5, 'Design') + '</div>';
  html += '<div class="card"><h2>Su gestión de la creatividad hoy</h2><div class="grid g4">' + [['Motivación intrínseca', Number(O.MI).toFixed(2)], ['Autoeficacia creativa', Number(O.AE).toFixed(2)], ['Diversidad del equipo', Number(O.DIV).toFixed(2)], ['Madurez en innovación', O.madurez + ' de 5']].map(function (k) { return '<div class="kpi"><div class="v" style="font-size:18px">' + k[1] + '</div><div class="l">' + k[0] + '</div></div>'; }).join('') + '</div>' +
    ayuda('La calidad de las ideas que generen depende de estos índices: con más motivación y autoeficacia las ideas son mejores; con más diversidad, más variadas. Se gestionan en la Estrategia anual (tiempo libre, incentivos, política ante el fracaso, composición y capacitación). Escala de 0 a 1.', 2) + '</div>';
  html += '<div class="card"><h2>Nuevo proyecto</h2><p class="muted">Máximo ' + g.maxProyectos + ' proyectos activos. Tienen ' + act.length + '.</p>' +
    '<div class="grid g2"><div><label>Nombre del proyecto</label><input type="text" id="npNom" placeholder="Ejemplo: Desayuno rápido universitario"></div><div><label>Segmento objetivo</label><select id="npSeg">' + V.cat.segmentos.map(function (s) { return '<option value="' + s.id + '">' + esc(s.id + ' ' + s.nombre) + '</option>'; }).join('') + '</select></div></div>' +
    '<label>Reto de diseño: ¿Cómo podríamos…?</label><input type="text" id="npReto" placeholder="Ejemplo: ¿Cómo podríamos ofrecer a los universitarios un desayuno nutritivo que puedan tomar camino a clases?">' +
    ayuda('Definan el problema desde la necesidad del cliente, no desde el producto. Un buen reto orienta toda la búsqueda de ideas.', 3, 'Insight') +
    '<label>Tipo de innovación que buscan</label>' + Object.keys(ENFOQUES).map(function (k, i) { return '<label class="chk"><input type="radio" name="npEnf" value="' + k + '"' + (i === 0 ? ' checked' : '') + '><span><b>' + ENFOQUES[k][0] + ':</b> ' + esc(ENFOQUES[k][1]) + '</span></label>'; }).join('') +
    ayuda('El tipo orienta qué ideas aparecerán. La disrupción no se "declara": se logra entrando por donde los líderes no atienden y mejorando después.', 1, 'Disrupción') +
    '<div style="margin-top:8px"><button class="btn sec" onclick="agregarProyecto()">Agregar proyecto</button></div>' +
    (D.nuevosProyectos.length ? '<p>Se crearán al procesar el trimestre: ' + D.nuevosProyectos.map(function (n, i) { return '<span class="tag">' + esc(n.nombre) + ' · ' + n.segmento + ' · ' + (ENFOQUES[n.enfoque] || ['?'])[0] + ' <a href="#" onclick="D.nuevosProyectos.splice(' + i + ',1);render();estimar();return false">×</a></span>'; }).join(' ') + '</p>' : '') +
    '<p class="muted">Un proyecto nuevo empieza en la fase Idear. Pueden elegir sus iniciativas recién en el trimestre siguiente, cuando el proyecto ya exista.</p></div>';
  if (!E.proyectos.length) html += '<div class="card"><p class="muted">Todavía no tienen proyectos.</p></div>';
  E.proyectos.slice().reverse().forEach(function (p) { html += tarjetaProyecto(p); });
  var term = E.proyectos.filter(function (p) { return p.estado !== 'activo' && !p.revisado; });
  if (term.length) html += '<div class="card"><h2>Revisión post-proyecto</h2>' + ayuda('Analizar qué funcionó y qué no en un proyecto terminado eleva la madurez en gestión de la innovación (máximo un nivel por año). Costo ' + bs(g.costoRevision) + ', 2 semanas.', 9) + sel('revision', [['', 'No hacer revisión']].concat(term.map(function (p) { return [p.id, p.nombre]; }))) + '</div>';
  return html;
}
function agregarProyecto() {
  var nom = $('npNom').value.trim(), reto = $('npReto').value.trim(), enf = (document.querySelector('input[name="npEnf"]:checked') || {}).value || 'incremental';
  if (!nom) { aviso('Escriban un nombre para el proyecto.', 'err'); return; }
  if (reto.length < 15) { aviso('Escriban el reto de diseño: "¿Cómo podríamos…?" (al menos 15 caracteres).', 'err'); return; }
  D.nuevosProyectos.push({ nombre: nom, base: enf === 'incremental' ? 'P0' : 'nuevo', enfoque: enf, reto: reto, segmento: $('npSeg').value }); render(); estimar();
}

function tarjetaProyecto(p) {
  var pid = p.id, a = D.proyectos[pid] || {}, umb = V.cat.umbrales[V.estado.org.umbral];
  var idx = ETAPAS.map(function (e) { return e[0]; }).indexOf(p.etapa);
  var html = '<div class="card proj"><h2>' + esc(p.nombre) + ' <span class="tag">' + (ENFOQUES[p.enfoque] ? 'Innovación ' + ENFOQUES[p.enfoque][0].toLowerCase() : (p.base === 'nuevo' ? 'Producto nuevo' : 'Mejora del producto actual')) + '</span> <span class="tag">' + esc(segNom(p.segmento)) + '</span> ' + (p.estado !== 'activo' ? '<span class="tag ' + (p.etapa === 'lanzado' ? (p.falla ? 'aviso' : 'ok') : 'mal') + '">' + (p.etapa === 'lanzado' ? (p.falla ? 'Lanzado con bajo desempeño' : 'Lanzado') : 'Detenido') + '</span>' : '') + '</h2>';
  html += '<div class="etapas">' + ETAPAS.map(function (e, i) { return '<span class="' + (i === idx ? 'on' : (i < idx || p.etapa === 'lanzado' ? 'hecho' : '')) + '">' + e[1] + '</span>'; }).join('') + '</div>';
  if (p.reto) html += '<p><b>Reto:</b> ' + esc(p.reto) + '</p>';
  if (p.estado === 'activo') html += '<p class="ayuda"><b>Qué hacer ahora:</b> ' + (p.etapa === 'ideacion' ? (p.pool.length ? 'Fase Evaluar. Revisen las ideas: la calidad sin validar tiene un margen de error de ±1,5; validen las más prometedoras (' + bs(V.cat.general.costoValidacion) + ' c/u) y elijan una. Si ninguna convence, generen más ideas.' : 'Fase Idear. Elijan hasta 3 iniciativas para generar ideas. Las comunitarias dan muchas ideas de calidad variable; los especialistas, pocas y más parejas.') : 'Fase Prototipar. Iteren el prototipo para subir su calidad; cuando el puntaje supere la puerta, hagan un piloto y luego lancen.') + ' <a href="#" onclick="irAprender(5);return false">Aprender: unidad 5 →</a></p>';
  if (p.ideaSel) html += '<p><b>Idea elegida:</b> ' + esc(p.ideaSel.nombre) + ' <span class="muted">(' + esc(p.ideaSel.tipo) + ', novedad ' + p.ideaSel.novedad + '/5, riesgo ' + p.ideaSel.riesgo + '/9). ' + esc(p.ideaSel.efectos || '') + '</span></p>';
  if (p.iter > 0) html += '<div class="grid g4">' + [['Iteraciones', p.iter + ' de 4'], ['Calidad observada del prototipo', p.calObs], ['Factibilidad', p.fact], ['Viabilidad', p.viab], ['Puntaje de puerta', p.puerta + ' (umbral ' + umb + ')']].map(function (k) { return '<div class="kpi"><div class="v" style="font-size:16px">' + k[1] + '</div><div class="l">' + k[0] + '</div></div>'; }).join('') + '</div>';
  if (p.piloto) html += '<p>Piloto (T' + p.piloto.t + '): con buena difusión alcanzaría cerca de <b>' + p.piloto.cuotaEstimada + ' %</b> de cuota en ' + p.segmento + '.</p>';
  if (p.pool.length) {
    html += '<h3>Ideas del proyecto (' + p.pool.length + ')</h3><div class="scroll"><table><tr><th>Idea</th><th>Tipo (4P)</th><th>Novedad</th><th>Fuente</th><th class="n">Calidad observada (1–9)</th><th>Validada</th>' + (p.etapa === 'ideacion' && p.estado === 'activo' ? '<th>Validar</th><th>Elegir</th>' : '') + '</tr>' +
      p.pool.slice().sort(function (x, y) { return y.qObs - x.qObs; }).map(function (it) {
        return '<tr><td><b>' + esc(it.nombre) + '</b><br><span class="muted">' + esc(it.desc) + (it.validada ? '<br>' + esc(it.efectos) : '') + '</span></td><td>' + esc(it.tipo) + '</td><td>' + (it.novedad <= 2 ? 'Incremental' : (it.novedad >= 4 ? 'Radical' : 'Intermedia')) + ' (' + it.novedad + '/5)</td><td>' + esc(it.fuente) + '</td><td class="n">' + Number(it.qObs).toFixed(1) + (it.validada ? '' : ' ±1,5') + '</td><td>' + (it.validada ? '<span class="tag ok">sí</span>' : '—') + '</td>' +
          (p.etapa === 'ideacion' && p.estado === 'activo' ? '<td>' + (it.validada ? '' : '<input type="checkbox" data-arr="proyectos.' + pid + '.validar" value="' + it.pid + '"' + ((a.validar || []).indexOf(it.pid) >= 0 ? ' checked' : '') + '>') + '</td><td><input type="radio" name="sel_' + pid + '" data-p="proyectos.' + pid + '.seleccionar" value="' + it.pid + '"' + (a.seleccionar === it.pid ? ' checked' : '') + '></td>' : '') + '</tr>';
      }).join('') + '</table></div>';
  }
  if (p.estado !== 'activo') return html + '</div>';
  var g = V.cat.general;
  if (p.etapa === 'ideacion') {
    html += '<h3>Generar ideas (hasta 3 iniciativas)</h3>' + ayuda('Cada iniciativa es una forma real de gestionar la creatividad: con especialistas internos, con emprendedores de la propia empresa, abriendo la convocatoria a la comunidad o trabajando con socios externos (innovación abierta). En los concursos, un premio medio suele dar mejores resultados que uno alto.', 5, 'abierta') + '<div class="scroll"><table><tr><th></th><th>Iniciativa</th><th>Modo</th><th>Qué obtienen</th><th class="n">Costo</th><th class="n">Semanas</th><th>Premio</th></tr>' +
      V.cat.iniciativas.map(function (ini) {
        var on = D._ini[pid] && D._ini[pid][ini.id] !== undefined;
        return '<tr><td><input type="checkbox" data-ini="' + pid + '" value="' + ini.id + '"' + (on ? ' checked' : '') + '></td><td>' + esc(ini.nombre) + '</td><td>' + esc(ini.modo) + '</td><td>' + ini.n0 + ' ideas, ' + (ini.mu0 >= 6 ? 'calidad alta' : (ini.mu0 >= 5 ? 'calidad media' : 'calidad baja')) + ', ' + (ini.s0 >= 1.5 ? 'muy variadas' : (ini.s0 >= 1.1 ? 'algo variadas' : 'parejas')) + '</td><td class="n">' + bs(ini.costo) + '</td><td class="n">' + ini.sem + '</td><td>' + (ini.premio ? '<select data-premio="' + pid + '|' + ini.id + '">' + ['bajo', 'medio', 'alto'].map(function (pr) { return '<option value="' + pr + '"' + ((on ? D._ini[pid][ini.id] === pr : pr === 'medio') ? ' selected' : '') + '>' + pr + ' (+' + bs(V.cat.premios[pr].costo) + ')</option>'; }).join('') + '</select>' : '—') + '</td></tr>';
      }).join('') + '</table></div>';
    if (p.pool.length) html += '<p class="muted">Validar cuesta ' + bs(g.costoValidacion) + ' por idea (2 semanas por lote). Puedes elegir una idea marcada o:</p>' + '<label class="chk"><input type="radio" name="sel_' + pid + '" data-p="proyectos.' + pid + '.seleccionar" value="mejorValidada"' + (a.seleccionar === 'mejorValidada' ? ' checked' : '') + '> Elegir automáticamente la mejor idea validada (después de validar este trimestre)</label>' + '<label class="chk"><input type="radio" name="sel_' + pid + '" data-p="proyectos.' + pid + '.seleccionar" value=""' + (!a.seleccionar ? ' checked' : '') + '> Todavía no elegir</label>';
    if (p.pool.length) html += '<h3>Si eliges una idea, iniciar el prototipo en este mismo trimestre</h3>' + protoForm(pid, true);
  }
  if (p.etapa === 'prototipo') {
    html += '<h3>Más iteraciones del prototipo</h3>' + protoForm(pid, false);
    html += '<div class="grid g2"><div>' + chkB('proyectos.' + pid + '.piloto', 'Hacer un piloto este trimestre (' + bs(g.costoPiloto) + ', 4 semanas). Reduce el riesgo de fracaso y acelera la adopción.') + '</div><div>' + chkB('proyectos.' + pid + '.detener', '<span style="color:#B42318">Detener el proyecto</span>') + '</div></div>';
    html += chkB('proyectos.' + pid + '.lanzarOn', '<b>Lanzar al mercado</b> (' + bs(g.costoLanzamiento) + ' + costo de implementación de la idea' + (p.base === 'nuevo' ? '; inversión de escalamiento ' + bs(g.capexEscalamiento) + ' de caja' : '') + ')', 'data-rerender="1"');
    if (a.lanzarOn) {
      html += '<div class="grid g4"><div><label>Nombre comercial</label>' + inp('proyectos.' + pid + '.lanzar.nombre') + '</div><div><label>Precio (Bs por litro)</label>' + inp('proyectos.' + pid + '.lanzar.precio', 'number', 'step=0.1 min=2') + '</div><div><label>Protección</label>' + sel('proyectos.' + pid + '.lanzar.proteccion', [['ninguna', 'Ninguna'], ['velocidad', 'Velocidad de mercado'], ['secreto', 'Secreto industrial'], ['patente', 'Patente (' + bs(g.costoPatente) + ', solo novedad ≥ 4)'], ['activos', 'Activos complementarios']]) + '</div><div><label>Comunicación por trimestre (Bs)</label>' + inp('proyectos.' + pid + '.lanzar.comunicacion', 'number', 'min=0 max=80000 step=1000') + '</div></div>' +
        '<label>Canales (si no eliges, se usan los del producto actual)</label><div class="inline">' + V.cat.canales.map(function (c) { return chkA('proyectos.' + pid + '.lanzar.canales', c.id, esc(c.nombre) + (c.costo ? ' (' + bs(c.costo) + '/trim.)' : '')); }).join('') + '</div>' +
        '<p class="muted">Cada producto nuevo activo tiene un costo de gestión de ' + bs(g.costoGestionProducto) + ' por trimestre.</p>';
    }
  }
  return html + '</div>';
}
function protoForm(pid, opcional) {
  var F = V.cat.fidelidades;
  return '<div class="grid g4"><div><label>Fidelidad</label>' + sel('proyectos.' + pid + '.prototipo.fidelidad', Object.keys(F).map(function (k) { return [k, F[k].nombre + ' — ' + bs(F[k].costo) + ', ' + F[k].sem + ' sem. por iteración, máx. ' + F[k].max]; })) + '</div><div><label>Iteraciones este trimestre</label>' + sel('proyectos.' + pid + '.prototipo.iteraciones', (opcional ? [[0, 'Ninguna']] : []).concat([[1, '1'], [2, '2'], [3, '3']])) + '</div></div>';
}

// ---------- Productos ----------
function vProductos() {
  var g = V.cat.general;
  var html = '<div class="card"><h2>Negocio actual: mientras innovan, la empresa sigue vendiendo</h2><p>Cada trimestre deciden 7 variables por producto. La publicidad mantiene el conocimiento de la marca: con menos de Bs 10.000 por trimestre, la gente empieza a olvidarla.</p>' + tablaProductos() + '</div>';
  V.estado.productos.forEach(function (p) {
    var pref = 'productos.' + p.id;
    var ph = (p.pronHist || []).slice(-1)[0];
    html += '<div class="card"><h2>' + esc(p.nombre) + '</h2><div class="grid g4">' +
      '<div><label>1. Precio (Bs por litro; cambio máximo ±30 %)</label>' + inp(pref + '.precio', 'number', 'step=0.1') + '</div>' +
      '<div><label>2. Publicidad por trimestre (Bs)</label>' + inp(pref + '.comunicacion', 'number', 'min=0 max=80000 step=1000') + '</div>' +
      '<div><label>3. Publicidad dirigida a</label>' + sel(pref + '.segPub', [['todos', 'Todo el mercado']].concat(V.cat.segmentos.map(function (s) { return [s.id, s.id + ' ' + s.nombre]; }))) + '</div>' +
      '<div><label>4. Promoción en el punto de venta (Bs, 0 a ' + kbs(g.promoMax) + ' mil)</label>' + inp(pref + '.promo', 'number', 'min=0 max=' + g.promoMax + ' step=1000') + '</div></div>' +
      ayuda('La publicidad dirigida a un segmento atrae más a ese segmento y un poco menos a los demás. La promoción (degustaciones, exhibidores, descuentos) sube las ventas solo en este trimestre. Ambas son gastos comerciales: no salen del presupuesto de innovación.', 0) +

  return '<div class="card"><h2>Bitácora del trimestre ' + t + '</h2><label>¿Qué decidimos?</label><textarea id="b1"></textarea><label>¿Qué pasó?</label><textarea id="b2"></textarea><label>¿Por qué pasó? (contrasta con tu hipótesis)</label><textarea id="b3"></textarea><label>¿Qué principio de innovación lo explica?</label><textarea id="b4"></textarea><div style="margin-top:10px"><button class="btn" onclick="guardarBitacora()">Guardar bitácora</button></div></div><div class="card"><h2>Bitácoras anteriores</h2><div id="blist" class="muted">Cargando…</div></div>' + decisionesInvestigacion();

function decisionesInvestigacion() {
  var L = (V.estado.informes || []).filter(function (i) { return i.requiere && i.decision; }).sort(function (a, b) { return b.t - a.t; });

    $('blist').innerHTML = L.length ? L.sort(function (a, b) { return b.trimestre - a.trimestre; }).map(function (b) { return '<div style="border-bottom:1px solid #eee;padding:6px 0"><b>T' + b.trimestre + '</b>' + (b.nota !== '' && b.nota !== undefined ? ' <span class="tag ok">Nota: ' + esc(b.nota) + '</span>' : '') + (b.autor ? ' <span class="muted">por ' + esc(b.autor) + '</span>' : '') + '<br>' + esc(b.porque) + '<br><i>' + esc(b.principio) + '</i>' + (b.comentario ? '<br><span class="tag">Docente: ' + esc(b.comentario) + '</span>' : '') + '</div>'; }).join('') : 'Sin registros.';

// ---------- archivar, respaldo, restaurar y eliminar ----------
function SIM_get(id) { return SIMS.lista.filter(function (s) { return s.simId === id; })[0]; }
function SIM_archivar(id) {
  var s = SIM_get(id);
  AX_confirmar('Archivar "' + s.nombre + '"', 'Los equipos ya no podrán ingresar y la simulación pasará a la lista de archivadas. Sus datos se conservan y puede desarchivarla cuando quiera.', '📦 Archivar', function () { adm('archivar', { simId: id }); });
}
function SIM_backup(id) {
  aviso('Preparando el respaldo…');
  return call('apiAdmin', TOK, 'respaldo', { simId: id }).then(function (r) {
    var f = 'respaldo_' + String(r.simulacion.codigo).replace(/[^A-Za-z0-9-]/g, '') + '_' + String(r.creado).slice(0, 10) + '.json';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(r)], { type: 'application/json' })); a.download = f;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    aviso('Respaldo descargado: ' + f + ' (' + r.simulacion.equipos + ' equipos). Guárdelo en un lugar seguro: contiene nombres y registros de los estudiantes.', 'ok');
    return true;
  }).catch(function (e) { aviso(e, 'err'); return false; });
}
function SIM_eliminar(id) {
  var s = SIM_get(id);
  var d = AX_modal('<h3>Eliminar "' + esc(s.nombre) + '"</h3><p>Se borrarán <b>definitivamente</b> la simulación, sus ' + s.equipos + ' equipos, ' + s.integrantes + ' estudiantes, decisiones, resultados, bitácoras y evaluaciones. <b>No se puede deshacer.</b></p><p>Si cree que la necesitará después, descargue antes un respaldo: podrá restaurarla con él.</p><div class="inline"><button class="btn sec" id="simDB">💾 Descargar respaldo primero</button></div><label for="simDC" style="margin-top:10px">Para confirmar, escriba el código <span class="ax-codigo">' + esc(s.codigo) + '</span></label><input type="text" id="simDC" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px"><div class="inline" style="margin-top:10px"><button class="btn sec" id="simDNo">Cancelar</button><button class="btn ax-rojo peligro" id="simDSi" disabled>✕ Eliminar definitivamente</button></div>');
  var inp = d.querySelector('#simDC'), si = d.querySelector('#simDSi'); inp.focus();
  var norm = function (x) { return String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  inp.oninput = function () { si.disabled = norm(inp.value) !== norm(s.codigo); };
  d.querySelector('#simDB').onclick = function () { SIM_backup(id); };
  d.querySelector('#simDNo').onclick = function () { d.remove(); };
  si.onclick = function () { var v = inp.value; d.remove(); if (SIMID === id) SIMID = null; adm('eliminarSimulacion', { simId: id, confirmar: v }); };
}
function SIM_restaurar() {
  var f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json';
  f.onchange = function () {
    var file = f.files && f.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      var R = null; try { R = JSON.parse(rd.result); } catch (e) { }
      if (!R || R.tipo !== 'simulador-innovacion-respaldo' || !R.simulacion) { aviso('El archivo elegido no es un respaldo del Simulador de Innovación.', 'err'); return; }

      var d = AX_modal('<h3>Restaurar una simulación</h3><p><b>' + esc(S.nombre) + '</b> · ' + esc(S.sigla || '') + '<br>Código: <span class="ax-codigo">' + esc(S.codigo) + '</span> · Trimestre ' + esc(S.trimestre) + ' · ' + S.equipos + ' equipos · ' + S.integrantes + ' estudiantes<br><span class="muted">Respaldo del ' + esc(String(R.creado).slice(0, 10)) + '</span></p><p>' + (existe ? 'Esta simulación todavía existe: se creará una <b>copia</b> con el nombre "(restaurada)" y, si el código está en uso, uno nuevo. La original no se modifica.' : 'Se recreará la simulación con sus equipos, contraseñas, decisiones y resultados tal como estaban en el respaldo.') + ' Quedará con el acceso cerrado.</p><div class="inline"><button class="btn sec" id="simRNo">Cancelar</button><button class="btn" id="simRSi">📂 Restaurar</button></div>');

      d.querySelector('#simRSi').onclick = function () { d.remove(); aviso('Restaurando…'); adm('restaurarSimulacion', { respaldo: R }, false).then(function (r) { if (r && r.simId) SIMID = r.simId; cargarAdmin(); }); };
    };
    rd.readAsText(file);
  };
  f.click();
}

  call('apiAdmin', TOK, 'resultados', { simId: SIMID }).then(function (L) {
    if (!L.length) { $('rc').innerHTML = 'Sin resultados.'; return; }
    var cols = ['equipo', 'trimestre', 'ventas', 'utilidadNeta', 'caja', 'cuotaTotal', 'vitalidad', 'clima', 'madurez', 'gastoInnovacion', 'ventasSinInnovar', 'utilidadSinInnovar'];
    $('rc').innerHTML = '<div class="scroll"><table><tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>' + L.sort(function (a, b) { return a.trimestre - b.trimestre || String(a.equipo).localeCompare(b.equipo); }).map(function (r) { return '<tr>' + cols.map(function (c) { return '<td class="n">' + esc(typeof r[c] === 'number' && Math.abs(r[c]) > 999 ? Math.round(r[c]).toLocaleString('es-BO') : r[c]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
  });
}
function aBitacoras() { return '<div class="card"><h2>Bitácoras</h2><div id="bc" class="muted">Cargando…</div></div>'; }
function cargarBitacorasClase() {
  call('apiAdmin', TOK, 'bitacoras', { simId: SIMID }).then(function (L) {
    if (!L.length) { $('bc').innerHTML = 'Sin bitácoras.'; return; }
    var nom = {}; ADM.equipos.forEach(function (e) { nom[e.equipoId] = e.nombre; });
    $('bc').innerHTML = L.sort(function (a, b) { return b.trimestre - a.trimestre; }).map(function (b) {
      return '<div style="border-bottom:1px solid #eee;padding:8px 0"><b>' + esc(nom[b.equipoId] || b.equipoId) + ' · T' + b.trimestre + '</b><br><b>Decidimos:</b> ' + esc(b.decidimos) + '<br><b>Pasó:</b> ' + esc(b.paso) + '<br><b>Por qué:</b> ' + esc(b.porque) + '<br><b>Principio:</b> ' + esc(b.principio) +
        '<div class="inline" style="margin-top:6px"><input type="number" id="nt' + b._row + '" value="' + esc(b.nota) + '" placeholder="Nota" style="max-width:90px"><input type="text" id="cm' + b._row + '" value="' + esc(b.comentario) + '" placeholder="Comentario"><button class="btn sec" onclick="adm(\'calificarBitacora\',{row:' + b._row + ',nota:$(\'nt' + b._row + '\').value,comentario:$(\'cm' + b._row + '\').value},false)">Guardar</button></div></div>';
    }).join('');
  });
}
