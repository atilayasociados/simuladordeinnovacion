<script>
// ===================== Simulador de Innovación — cliente =====================
var TOK = null, ROL = null, V = null, D = null, TAB = 'panel', ADM = null, ATAB = 'partida', estTimer = null, EST = null;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function bs(n) { return 'Bs ' + Math.round(Number(n) || 0).toLocaleString('es-BO'); }
function kbs(n) { return Math.round((Number(n) || 0) / 1000).toLocaleString('es-BO'); }
function pct(n) { return (n === null || n === undefined || n === '') ? '—' : (Number(n).toFixed(1) + ' %'); }
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ko) { google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { ko(e && e.message ? e.message : String(e)); })[fn].apply(null, args); });
}
function aviso(txt, tipo) { var d = document.createElement('div'); d.className = 'msg ' + (tipo || 'ok'); d.textContent = txt; $('app').prepend(d); setTimeout(function () { d.remove(); }, 9000); window.scrollTo(0, 0); }
function getP(o, path) { return path.split('.').reduce(function (a, k) { return a && a[k] !== undefined ? a[k] : undefined; }, o); }
function setP(o, path, v) { var ks = path.split('.'), a = o; for (var i = 0; i < ks.length - 1; i++) { if (typeof a[ks[i]] !== 'object' || a[ks[i]] === null) a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length - 1]] = v; }

// ---------- ingreso: ver AccesoUI.html (v2.3) ----------
function pantallaLogin(modo) {
  if (TOK) { try { call('apiAXSalir', TOK).catch(function () { }); } catch (e) { } }
  if (typeof vigilarApertura === 'function') vigilarApertura(false);
  TOK = null; ROL = null; V = null; ADM = null; SIMID = null;
  document.body.classList.remove('ax-doc');
  $('nav').style.display = 'none'; $('pie').style.display = 'none'; $('meta').innerHTML = ''; $('titulo').textContent = 'Simulador de Innovación'; $('app').innerHTML = '';
  AX_mostrar(modo || 'ingresar');
}

// ---------- equipo ----------
function cargar() {
  $('app').innerHTML = '<p class="muted">Cargando…</p>';
  call('apiEstado', TOK).then(function (v) {
    V = v; D = v.borrador ? JSON.parse(JSON.stringify(v.borrador)) : {};
    delete D._estado; delete D._fecha;
    prepararBorrador();
    if (TAB === 'inicio') TAB = V.estado.hist.length ? 'panel' : 'caso';
    render(); estimar();
  }).catch(function (e) { $('app').innerHTML = '<div class="msg err">' + esc(e) + '</div>'; if (/sesión/.test(e)) setTimeout(pantallaLogin, 1500); });
}
// Mientras el trimestre está cerrado, revisa cada 30 s si el docente ya lo abrió y actualiza sola.
var VIGIA = null;
function vigilarApertura(activar) {
  if (!activar) { if (VIGIA) { clearInterval(VIGIA); VIGIA = null; } return; }
  if (VIGIA) return;
  VIGIA = setInterval(function () {
    if (!TOK || ROL === 'docente' || document.hidden) return;
    call('apiEstado', TOK).then(function (v) {
      if (!V || v.partida.estado !== 'abierto' || (v.partida.t === V.partida.t && V.partida.estado === 'abierto')) return;
      vigilarApertura(false); V = v; D = v.borrador ? JSON.parse(JSON.stringify(v.borrador)) : {}; delete D._estado; delete D._fecha;
      prepararBorrador(); render(); estimar(); aviso('El docente abrió el trimestre ' + v.partida.t + ': ya pueden decidir.', 'ok');
    }).catch(function () { });
  }, 30000);
}
function prepararBorrador() {
  D.senales = D.senales || {}; D.herramientas = D.herramientas || {}; D.cronograma = D.cronograma || {}; D.proyectos = D.proyectos || {}; D.productos = D.productos || {}; D.decInformes = D.decInformes || {};
  (V.estado.informes || []).forEach(function (i) { if (i.requiere && i.t === V.partida.t - 1 && D.decInformes[i.id] === undefined && i.decision) D.decInformes[i.id] = i.decision; });
  D.investigacion = D.investigacion || { metodos: [], segmentos: [] };
  D.investigacion.metodos = D.investigacion.metodos || []; D.investigacion.segs = D.investigacion.segs || {};
  D.nuevosProyectos = D.nuevosProyectos || [];
  D._ini = D._ini || {};
  var O = V.estado.org;
  // La estrategia anual empieza en blanco: la decide el equipo (puede copiar la del año anterior).
  if (V.flags.anualEditable && !D.anual) D.anual = { p4: { producto: '', proceso: '', posicion: '', paradigma: '' }, nucleo: '', adyacente: '', transf: '', postura: '', estructura: '', tiempoLibre: '', incentivo: '', politica: '', composicion: '', capacitacion: '', umbral: '', hipotesis: '' };
  V.estado.productos.forEach(function (p) {
    if (!D.productos[p.id]) D.productos[p.id] = { precio: p.precio, comunicacion: p.comunicacion || 0, segPub: p.segPub || 'todos', promo: 0, pronostico: '', canales: p.canales.slice(), retirar: false };
    var dp = D.productos[p.id]; if (dp.segPub === undefined) dp.segPub = p.segPub || 'todos'; if (dp.promo === undefined) dp.promo = 0;
  });
  V.estado.proyectos.forEach(function (p) {
    if (p.estado !== 'activo') return;
    var a = D.proyectos[p.id] = D.proyectos[p.id] || {};
    a.validar = a.validar || [];
    if (!a.prototipo) a.prototipo = { fidelidad: 'baja', iteraciones: p.etapa === 'prototipo' ? 1 : 0 };
    if (!a.lanzar) a.lanzar = { nombre: p.ideaSel ? p.ideaSel.nombre : p.nombre, precio: '', canales: [], proteccion: 'ninguna', comunicacion: 20000 };
  });
  if (typeof prepararBorrador2 === 'function') prepararBorrador2();
}
function decisionLimpia() {
  var d = JSON.parse(JSON.stringify(D));
  // investigación: segmentos propios por estudio; 'segmentos' (unión) solo por compatibilidad con servidores anteriores
  if (d.investigacion) {
    var sg = d.investigacion.segs = d.investigacion.segs || {}, u = [];
    ['encuesta', 'observacion', 'percepcion'].forEach(function (m) { if (!Array.isArray(sg[m])) sg[m] = []; sg[m].forEach(function (x) { if (u.indexOf(x) < 0) u.push(x); }); });
    d.investigacion.segmentos = u.slice(0, 2);
  }
  // herramientas: solo las marcadas; señales: solo las registradas
  var hh = {}; Object.keys(d.herramientas || {}).forEach(function (k) { var x = d.herramientas[k]; if (x && x.on) hh[k] = { seg: x.seg || '' }; }); d.herramientas = hh;
  Object.keys(d.senales || {}).forEach(function (k) { var r = d.senales[k]; if (!r || (!r.cred && !r.postura)) delete d.senales[k]; });
  delete d.noticias; delete d.respuestas; delete d.acciones;
  Object.keys(d.proyectos).forEach(function (pid) {
    var a = d.proyectos[pid];
    a.iniciativas = Object.keys((D._ini || {})[pid] || {}).map(function (id) { return { id: id, premio: D._ini[pid][id] }; });
    if (!a.lanzarOn) delete a.lanzar; else if (a.lanzar && (!a.lanzar.canales || !a.lanzar.canales.length)) a.lanzar.canales = null;
    if (!a.prototipo || !(Number(a.prototipo.iteraciones) > 0)) delete a.prototipo;
    if (!a.seleccionar) delete a.seleccionar;
    delete a.lanzarOn;
  });
  if (!V.flags.anualEditable) delete d.anual;
  delete d._ini;
  if (typeof limpiar2 === 'function') limpiar2(d);
  return d;
}
function estimar() {
  clearTimeout(estTimer);
  estTimer = setTimeout(function () {
    if (!V || V.partida.finalizada) return;
    call('apiEstimar', TOK, decisionLimpia()).then(function (e) { var antes = CRONO_KEYS.join('|'); EST = e; pie(); if (TAB === 'proyectos' && (e.actividades || []).map(function (a) { return a.concepto; }).join('|') !== antes) pintarCrono(); }).catch(function () { });
  }, 500);
}
function guardar(enviar) {
  call('apiGuardar', TOK, decisionLimpia(), enviar).then(function (e) {
    EST = e; pie(); aviso(enviar ? 'Decisiones enviadas. Puedes seguir modificándolas hasta que el docente cierre el trimestre.' : 'Borrador guardado.');
    V.borrador = { _estado: e.estado }; pie();
  }).catch(function (e) { aviso(e, 'err'); });
}
function pie() {
  if (!V || V.partida.finalizada || ROL !== 'equipo' || menuDe(TAB)[0] !== 'decidir' || V.partida.estado !== 'abierto') { $('pie').style.display = 'none'; return; }
  $('pie').style.display = 'flex';
  var abierto = V.partida.estado === 'abierto';
  var e = EST || { costo: 0, semanas: 0, saldo: V.estado.saldo, semanasDisp: V.cat.general.semanasTrimestre, avisos: [] };
  var est = V.borrador && V.borrador._estado ? '<span class="tag ' + (V.borrador._estado === 'enviado' ? 'ok' : 'aviso') + '">' + esc(V.borrador._estado) + '</span>' : '<span class="tag">sin guardar</span>';
  var falt = 0, sinP = 0; (V.noticias || []).forEach(function (n) { var r = (D.senales || {})[n.id] || {}; if (!r.cred || !r.postura) falt++; else if ((r.postura === 'preparar' || r.postura === 'actuar') && String(r.porque || '').trim().length < 10) sinP++; });
  var avC = []; if (falt) avC.push('1. Entorno: ' + falt + ' señal(es) sin credibilidad o sin postura.'); if (sinP) avC.push('1. Entorno: escriban por qué atienden ' + sinP + ' señal(es).');
  Object.keys(D.herramientas || {}).forEach(function (k) { var x = D.herramientas[k], h = herrDe(k); if (x && x.on && h && h.seg && !x.seg) avC.push('Herramienta "' + h.nombre + '": elijan el segmento.'); });
  (V.noticias || []).forEach(function (n) { var r = (D.senales || {})[n.id] || {}; if (r.postura === 'vigilar' && (!r.estudio || !estudioCubierto(r.estudio))) avC.push('1. Entorno: vigilan una señal sin un estudio que la cubra; no recibirán información adicional.'); });
  if (e.actividades && e.actividades.length) { var zc = cronoEstado(); if (zc.faltan) avC.push('4. Proyectos: completen el cronograma de semanas-persona (' + zc.faltan + ' actividad(es) sin estimar).'); if (zc.plan > zc.cap) avC.push('Cronograma: planificaron ' + zc.plan + ' semanas-persona y tienen ' + zc.cap + '.'); }
  e = JSON.parse(JSON.stringify(e)); e.avisos = avC.filter(function (x, i) { return avC.indexOf(x) === i; }).concat(e.avisos || []);
  var op = e.operativo || {}, opTxt = (op.herramientas || op.contrato) ? '<br><span class="muted">Gasto operativo del trimestre: herramientas ' + bs(op.herramientas || 0) + ' · contrato de investigación ' + bs(op.contrato || 0) + '</span>' : '';
  $('pie').innerHTML = '<div class="est">Costo estimado de innovación: <b>' + bs(e.costo) + '</b> de ' + bs(e.saldo) + ' · Semanas-persona de referencia: <b>' + e.semanas + '</b> de ' + e.semanasDisp + ' (lo real puede variar) ' + est + opTxt +
    (e.avisos && e.avisos.length ? '<div class="avisos">⚠ ' + e.avisos.map(esc).join('<br>⚠ ') + '</div>' : '') + '</div>' +
    '<div class="inline">' + (abierto ? '<button class="btn sec" onclick="guardar(false)">Guardar borrador</button><button class="btn" onclick="guardar(true)">Enviar decisiones</button>' : '<span class="tag aviso">Trimestre cerrado por el docente</span>') +
    '<button class="btn sec" onclick="cargar()">Actualizar</button></div>';
}

var MENUS = [
  ['situacion', 'Situación', [['caso', 'El caso'], ['panel', 'Situación actual'], ['mercado', 'Mercado y competencia'], ['equipo', 'Mi equipo']]],
  ['decidir', 'Decidir', [['ronda', 'Qué decidir en esta ronda'], ['entorno', '1. Entorno'], ['anual', '2. Estrategia anual'], ['investigacion', '3. Investigación'], ['proyectos', '4. Proyectos'], ['productos', '5. Productos'], ['pares', 'Evaluar a otros equipos'], ['hipotesis', '6. Hipótesis y envío']]],
  ['resultados', 'Resultados', [['resumen', 'Resumen del trimestre'], ['informes', 'Informes de investigación'], ['evaluaciones', 'Evaluación de sus conceptos'], ['resultados', 'Estados financieros e indicadores']]],
  ['aprender', 'Aprender', [['manual', 'Manual del estudiante'], ['temas', 'Temas de innovación'], ['glosario', 'Glosario'], ['bitacora', 'Mi bitácora']]]
];
function menuDe(t) { for (var i = 0; i < MENUS.length; i++) for (var j = 0; j < MENUS[i][2].length; j++) if (MENUS[i][2][j][0] === t) return MENUS[i]; return MENUS[0]; }
function irTab(t) { TAB = t; render(); window.scrollTo(0, 0); }
/** Abre Resultados → Estados financieros y baja a la sección pedida. */
function irEstados(ancla) { TAB = 'resultados'; render(); setTimeout(function () { var e = $(ancla); if (e) { e.scrollIntoView({ behavior: 'smooth', block: 'start' }); window.scrollBy(0, -140); } else window.scrollTo(0, 0); }, 60); }
/** Tarjeta de análisis interno: dónde ver los estados financieros y resumen del Año 0. */
function tarjetaAnalisisInterno(breve) {
  var H0 = V.estado.hist0 || [], H = V.estado.hist || [];
  var enl = '<div class="enl-ef"><a href="#" onclick="irEstados(\'ef-resultados\');return false">📊 Estado de resultados →</a><a href="#" onclick="irEstados(\'ef-balance\');return false">🏦 Balance general →</a><a href="#" onclick="irEstados(\'ef-flujo\');return false">💵 Flujo de efectivo →</a><a href="#" onclick="irEstados(\'ef-indicadores\');return false">📈 Mercado e indicadores →</a></div>';
  var txt = '<p>Antes de decidir, revisen la situación de su empresa en <b>Resultados → Estados financieros e indicadores</b>. Desde el T1 ven el <b>Año 0</b> (columnas T-3 a T0, en gris): los cuatro trimestres anteriores a la partida, con la empresa tal como la reciben' + (H.length ? '; después, cada trimestre jugado' : '') + '.</p>';
  if (breve || !H0.length) return '<div class="card"><h2>Antes de decidir: analicen su empresa</h2>' + txt + enl + '</div>';
  function sum(k) { return H0.reduce(function (a, h) { return a + (Number(h[k]) || 0); }, 0); }
  var ven = sum('ventas');
  var filas = [['Ventas', sum('ventas')], ['Costo de ventas', -sum('costoVentas')], ['<b>Utilidad bruta</b>', sum('utilidadBruta')], ['Gastos operativos fijos', -sum('gastosFijos')], ['Gastos comerciales', -sum('gastosComerciales')], ['Investigación de mercados continua (contrato)', -sum('investigacionContinua')], ['Gastos de innovación', -sum('gastosInnovacion')], ['Otros gastos', -sum('otrosGastos')], ['Intereses', -sum('intereses')], ['Impuesto (IUE 25 %)', -sum('impuesto')], ['<b>Utilidad neta</b>', sum('utilidadNeta')]];
  return '<div class="card"><h2>Antes de decidir: analicen su empresa</h2>' + txt +
    '<h3>Estado de resultados del Año 0 (suma de T-3 a T0)</h3><div class="scroll"><table><tr><th>Concepto</th><th class="n">Miles de Bs</th><th class="n">% de las ventas</th></tr>' + filas.map(function (f) { return '<tr><th>' + f[0] + '</th><td class="n">' + kbs(f[1]) + '</td><td class="n">' + (ven ? (Math.round(1000 * f[1] / ven) / 10 || 0).toLocaleString('es-BO', { maximumFractionDigits: 1 }) + ' %' : '—') + '</td></tr>'; }).join('') + '</table></div>' +
    '<p class="muted">Caja al cierre del T0: ' + bs(400000) + '. La investigación de mercados del Año 0 corresponde al contrato heredado (C.1 Mercado cada trimestre); al inicio de cada año deciden si lo mantienen (2. Estrategia anual, Bloque C).</p>' + enl + '</div>';
}
function render() {
  var p = V.partida, M = menuDe(TAB);
  $('titulo').textContent = p.nombre || 'Simulador de Innovación';
  $('meta').innerHTML = '<span>' + esc(V.usuario.nombre) + ' · ' + esc(V.equipo.nombre) + '</span><span>' + esc(p.sigla || '') + '</span><span>' + (p.finalizada ? 'Partida terminada' : 'Trimestre ' + p.t + ' de ' + p.total + ' (año ' + (Math.floor((p.t - 1) / 4) + 1) + ')') + '</span><span>' + (p.estado === 'abierto' ? 'Abierto' : 'Cerrado') + '</span><span>Presupuesto: ' + bs(V.estado.saldo) + '</span><button class="btn-manual" onclick="irManual(MANUAL_DE[TAB] || \'inicio\')" title="Abrir el Manual del estudiante">📘 Manual</button><a href="#" style="color:#fff" onclick="pantallaLogin();return false">Salir</a>';
  $('nav').style.display = 'block';
  $('nav').innerHTML = '<div class="menu">' + MENUS.map(function (m) { return '<button class="' + (M[0] === m[0] ? 'on' : '') + '" onclick="irTab(\'' + m[2][0][0] + '\')">' + m[1] + '</button>'; }).join('') + '</div>' +
    '<div class="sub">' + M[2].map(function (t) { return '<button class="' + (TAB === t[0] ? 'on' : '') + '" onclick="irTab(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('') + '</div>';
  var f = { caso: vCaso, panel: vPanel, mercado: vMercado, equipo: vEquipo, ronda: vRonda, entorno: vEntorno, anual: vAnual, investigacion: vInvestigacion, proyectos: vProyectos2, productos: vProductos, hipotesis: vHipotesis, resumen: vResumen, informes: vInformes, pares: P4_vPares, evaluaciones: P4_vEvaluaciones, resultados: vResultados, temas: vTemas, glosario: vGlosario, bitacora: vBitacora, manual: vManual }[TAB] || vCaso;
  var cerrado = M[0] === 'decidir' && (V.partida.estado !== 'abierto' || p.finalizada);
  vigilarApertura(V.partida.estado !== 'abierto' && !p.finalizada);
  var html = cerrado ? vDecidirCerrado() : f();
  if (M[0] === 'decidir' && TAB !== 'ronda' && !cerrado) {
    var L = M[2], k = L.map(function (t) { return t[0]; }).indexOf(TAB);
    html += '<div class="inline" style="justify-content:space-between">' + (k > 1 ? '<button class="btn sec" onclick="irTab(\'' + L[k - 1][0] + '\')">← ' + L[k - 1][1] + '</button>' : '<span></span>') + (k < L.length - 1 ? '<button class="btn sec" onclick="irTab(\'' + L[k + 1][0] + '\')">' + L[k + 1][1] + ' →</button>' : '') + '</div>';
  }
  if (typeof enlaceManual === 'function' && TAB !== 'manual') html = enlaceManual(cerrado ? 'ronda' : TAB) + html;
  $('app').innerHTML = html;
  if (TAB === 'bitacora') cargarBitacora(); if (TAB === 'equipo') cargarMiEquipo();
  if (TAB === 'pares' && !cerrado) P4_cargarPares(); if (TAB === 'evaluaciones') P4_cargarMias();
  pie();
}

// enlaces de formularios
document.addEventListener('change', function (ev) {
  var el = ev.target; if (!D || ROL !== 'equipo') return;
  if (el.dataset.p) {
    var v = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value);
    setP(D, el.dataset.p, v);
  } else if (el.dataset.arr) {
    var arr = getP(D, el.dataset.arr); if (!Array.isArray(arr)) { arr = []; setP(D, el.dataset.arr, arr); }
    var i = arr.indexOf(el.value);
    if (el.checked && i < 0) arr.push(el.value); if (!el.checked && i >= 0) arr.splice(i, 1);
    if (el.dataset.max && arr.length > Number(el.dataset.max)) { arr.splice(arr.indexOf(el.value), 1); el.checked = false; aviso('Máximo ' + el.dataset.max + ' opciones.', 'err'); }
  } else if (el.dataset.cron !== undefined) {
    var ck = CRONO_KEYS[Number(el.dataset.cron)]; if (!ck) return;
    D.cronograma = D.cronograma || {}; var cc = D.cronograma[ck] = D.cronograma[ck] || {};
    cc[el.dataset.campo] = el.value === '' ? '' : Number(el.value);
    if (cc.ini && cc.fin && cc.fin < cc.ini) cc.fin = cc.ini;
    pintarCrono(); pie(); return;
  } else if (el.dataset.ini) {
    var pid = el.dataset.ini, id = el.value; D._ini[pid] = D._ini[pid] || {};
    if (el.checked) { if (Object.keys(D._ini[pid]).length >= 3) { el.checked = false; aviso('Máximo 3 iniciativas por proyecto y trimestre.', 'err'); return; } D._ini[pid][id] = 'medio'; }
    else delete D._ini[pid][id];
  } else if (el.dataset.premio) {
    var pr = el.dataset.premio.split('|'); D._ini[pr[0]] = D._ini[pr[0]] || {}; if (D._ini[pr[0]][pr[1]] !== undefined) D._ini[pr[0]][pr[1]] = el.value;
  } else return;
  if (el.dataset.rerender || (el.dataset.arr && (el.dataset.arr.indexOf('investigacion.segs.') === 0 || el.dataset.arr.indexOf('anual.contrato.') === 0))) render();
  estimar();
});
function inp(path, tipo, attrs) { var v = getP(D, path); return '<input type="' + (tipo || 'text') + '" data-p="' + path + '" value="' + esc(v === undefined ? '' : v) + '" ' + (attrs || '') + '>'; }
function sel(path, opts, attrs) { var v = getP(D, path); return '<select data-p="' + path + '" ' + (attrs || '') + '>' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(v) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>'; }
function chkB(path, txt, attrs) { return '<label class="chk"><input type="checkbox" data-p="' + path + '"' + (getP(D, path) ? ' checked' : '') + ' ' + (attrs || '') + '><span>' + txt + '</span></label>'; }
function chkA(path, val, txt, max) { var a = getP(D, path) || []; return '<label class="chk"><input type="checkbox" data-arr="' + path + '" value="' + esc(val) + '"' + (a.indexOf(val) >= 0 ? ' checked' : '') + (max ? ' data-max="' + max + '"' : '') + '><span>' + txt + '</span></label>'; }
function txtA(path, ph) { return '<textarea data-p="' + path + '" placeholder="' + esc(ph || '') + '">' + esc(getP(D, path) || '') + '</textarea>'; }
function segNom(id) { var s = V.cat.segmentos.filter(function (x) { return x.id === id; })[0]; return s ? s.id + ' ' + s.nombre : id; }
function canNom(id) { var c = V.cat.canales.filter(function (x) { return x.id === id; })[0]; return c ? c.nombre : id; }
function ultimo() { var h = V.estado.hist; return h.length ? h[h.length - 1] : null; }

// ---------- Panel ----------

function tarjetaTiempo() {
  var T = V.cat.tiemposRef || [], cap = V.cat.general.semanasTrimestre || 12, f = function (x) { return String(x).replace('.', ','); };
  return '<div class="card" id="planTiempo"><h2>Planificar el tiempo del equipo: semanas-persona</h2>' +
    '<p>Además del dinero, el equipo tiene un límite de <b>tiempo</b>: <b>' + cap + ' semanas-persona por trimestre</b>. Una semana-persona es el trabajo de una persona durante una semana. La operación normal (producir, vender, comprar) ya está cubierta por los gastos fijos; estas semanas son el tiempo que la empresa puede sacarle a su gente para innovar sin descuidar la operación.</p>' +
    '<p><b>Ejemplo:</b> la jefa de marketing, un ingeniero de planta y un supervisor de ventas dedican un tercio de su tiempo al proyecto durante las 12 semanas del trimestre: 3 × 4 = 12 semanas-persona. Si eligen talleres de ideas (3), prototipos (4), validación (2) y capacitación (2), suman 11. Si además quieren un piloto (4), ya no alcanza: deben postergarlo, quitar otra actividad o descuidar la operación.</p>' +
    '<p><b>Cada trimestre</b>, en <b>4. Proyectos</b>, elaboran el <b>cronograma</b>: para cada actividad elegida estiman sus semanas-persona y en qué semanas del trimestre la harán. Al procesar, el simulador compara lo planificado con lo real. Si una actividad requiere más tiempo del que queda, <b>no se ejecuta</b> y el proyecto se atrasa.</p>' +
    '<h3>Tiempos de referencia</h3><div class="scroll"><table><tr><th>Fase</th><th>Actividad</th><th class="n">Referencia</th><th class="n">Rango habitual</th></tr>' + T.map(function (x) { return '<tr><td>' + esc(x.fase) + '</td><td>' + esc(x.actividad) + '</td><td class="n">' + f(x.ref) + '</td><td class="n">' + f(x.min) + ' a ' + f(x.max) + '</td></tr>'; }).join('') + '</table></div>' +
    '<p class="muted">El tiempo real de cada actividad varía dentro del rango (y a veces por encima de lo estimado) según: la <b>novedad</b> del proyecto (más novedoso, más tiempo), las <b>iteraciones</b> y si <b>aceleran</b> la fase (+50 %), la <b>madurez en innovación</b> (cada nivel ahorra media semana) y la <b>capacitación</b> vigente (10 % menos). Las personas tienden a subestimar el tiempo de sus tareas, la llamada falacia de la planificación (Kahneman y Tversky, 1979; Buehler, Griffin y Ross, 1994): dejen un margen.</p></div>';
}

// ---------- Investigación ----------
function costoEstudio(m, n) { return m.porSeg ? (m.base || 0) + m.porSeg * Math.max(1, n || 1) : m.costo; }
var VECES_ = { 4: 'cada trimestre', 2: 'dos veces al año (1.º y 3.º trimestre)', 1: 'una vez al año (1.º trimestre)' };
function costoContratoTrim(K, t) { var tot = 0, d = V.cat.descuentoContrato || 0; Object.keys(K).forEach(function (mid) { if (!entregaK(t, K[mid].veces)) return; var m = V.cat.metodos.filter(function (x) { return x.id === mid; })[0]; if (m) tot += costoEstudio(m, (K[mid].segs || []).length) * (1 - d); }); return Math.round(tot); }
function costoContratoAnual(K) { var tot = 0; for (var q = 1; q <= 4; q++) tot += costoContratoTrim(K, q); return tot; }
function contratoTexto(K) {
  var ks = Object.keys(K); if (!ks.length) return 'Sin contrato de investigación continua.';
  return ks.map(function (mid) { return metNom(mid) + ' ' + (mid === 'vigilancia' ? '(suscripción anual)' : VECES_[K[mid].veces]) + (K[mid].segs ? ' en ' + K[mid].segs.join(', ') : ''); }).join('; ') + '.';
}
function gastoInvAnio() {
  var t = V.partida.t, a0 = Math.floor((t - 1) / 4) * 4 + 1, inv = 0, ven = 0;
  (V.estado.hist || []).forEach(function (h) { if (h.t >= a0) { inv += (h.investigacionContinua || 0) + (h.gastoInv || 0); ven += h.ventas || 0; } });
  if (!ven) (V.estado.hist0 || []).forEach(function (h) { inv += (h.investigacionContinua || 0); ven += h.ventas || 0; });
  return ven ? 100 * inv / ven : null;
}

    ayuda('<b>Modalidades:</b> <b>sindicado</b> (informe estándar que compran varias empresas: precio fijo, cubre todo el mercado), <b>a medida</b> (diseñado para ustedes: en los estudios por segmento, el precio sube con cada segmento que agregan, de 1 a 5) y <b>suscripción</b> (pago único por 4 trimestres). Los precios son <b>didácticos</b>: en el mercado boliviano estos estudios costarían cerca de tres veces más.', 3, 'latente') +

  var act = E.proyectos.filter(function (p) { return p.estado === 'activo'; });

    '<ol><li><b>Empatizar:</b> investiguen el segmento en el paso 3.</li><li><b>Definir:</b> al crear el proyecto escriben el reto y eligen el tipo de innovación.</li><li><b>Idear:</b> eligen hasta 3 iniciativas (talleres, concursos, startups) que generan ideas; las verán al recibir los resultados.</li><li><b>Evaluar:</b> validan las ideas más prometedoras y eligen una.</li><li><b>Prototipar:</b> iteran el prototipo; cada iteración mejora el producto.</li><li><b>Implementar:</b> si supera la puerta, hacen un piloto y lo lanzan.</li></ol>' +

  if (p.piloto) html += '<p>Piloto (T' + p.piloto.t + '): con buena difusión alcanzaría cerca de <b>' + p.piloto.cuotaEstimada + ' %</b> de cuota en ' + p.segmento + '.</p>';
  if (p.pool.length) {
    html += '<h3>Ideas del proyecto (' + p.pool.length + ')</h3><div class="scroll"><table><tr><th>Idea</th><th>Tipo (4P)</th><th>Novedad</th><th>Fuente</th><th class="n">Calidad observada (1–9)</th><th>Validada</th>' + (p.etapa === 'ideacion' && p.estado === 'activo' ? '<th>Validar</th><th>Elegir</th>' : '') + '</tr>' +

    '<div class="card"><h2>Control del trimestre</h2><div class="inline"><button class="btn sec" onclick="adm(\'abrir\')">Abrir trimestre</button><button class="btn sec" onclick="adm(\'cerrar\')">Cerrar trimestre</button><button class="btn" onclick="if(confirm(\'¿Procesar el trimestre ' + p.t + ' para todos los equipos de esta simulación?\'))adm(\'procesar\')">Procesar trimestre ' + p.t + '</button><button class="btn sec" onclick="if(confirm(\'¿Deshacer el último trimestre procesado?\'))adm(\'retroceder\')">Deshacer último procesamiento</button></div>' +
    '<p class="muted">Flujo sugerido: los equipos se registran con el código → cierre el registro → abra el T1 → los equipos envían → cierre → procese (abre el siguiente trimestre) → debriefing.</p></div>' +
    '<div class="card"><h2>Reiniciar simulación</h2><p class="muted">Borra decisiones, estados, resultados y bitácoras de esta simulación. Conserva equipos e integrantes.</p><div class="inline"><input type="text" id="conf" placeholder="Escriba REINICIAR" style="max-width:220px"><label class="chk"><input type="checkbox" id="nsem"> Nueva semilla</label><button class="btn peligro" onclick="adm(\'reiniciar\',{confirmar:$(\'conf\').value,nuevaSemilla:$(\'nsem\').checked})">Reiniciar</button></div></div>';
}
function aRanking() { return '<div class="card"><h2>Ranking y debriefing</h2><div id="rk" class="muted">Cargando…</div></div>'; }
function cargarRanking() {
  call('apiAdmin', TOK, 'ranking', { simId: SIMID }).then(function (r) {
    if (!r.filas.length) { $('rk').innerHTML = 'Aún no hay trimestres procesados.'; return; }
    $('rk').innerHTML = '<p>Indicadores al cierre de T' + r.t + '. Puntaje: valor 30 %, vitalidad 20 %, cuota en segmentos en crecimiento 15 %, resiliencia ante la disrupción 15 %, madurez 10 %, clima 10 % (normalizados en la clase).</p><div class="scroll"><table><tr><th>#</th><th>Equipo</th><th class="n">Puntaje</th><th class="n">Valor de la empresa (miles)</th><th class="n">Valor sin innovar</th><th class="n">Utilidad acumulada</th><th class="n">Utilidad sin innovar</th><th class="n">ROI de innovación</th><th class="n">Vitalidad media</th><th class="n">Cuota S2/S4</th><th class="n">Resiliencia (Δ cuota T13–T16)</th><th class="n">Madurez</th><th class="n">Clima</th></tr>' +
      r.filas.map(function (d, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(d.nombre) + '</td><td class="n"><b>' + d.puntaje + '</b></td><td class="n">' + kbs(d.valor) + '</td><td class="n">' + kbs(d.valorSinInnovar) + '</td><td class="n">' + kbs(d.utilidadAcum) + '</td><td class="n">' + kbs(d.utilidadSinInnovar) + '</td><td class="n">' + d.roi + '</td><td class="n">' + pct(d.vitalidad) + '</td><td class="n">' + pct(d.cuotaCrecimiento) + '</td><td class="n">' + d.resiliencia + '</td><td class="n">' + d.madurez + '</td><td class="n">' + d.clima + '</td></tr>'; }).join('') + '</table></div><p class="muted">Preguntas para el debriefing: ¿qué decisiones explican la diferencia entre el primero y el último? ¿Quién recuperó primero la inversión frente a la empresa que no innovó? ¿Qué equipo leyó mejor las señales del disruptor?</p>';
  }).catch(function (e) { $('rk').innerHTML = esc(e); });
}
function aResultados() { return '<div class="card"><h2>Resultados de la clase por trimestre</h2><div id="rc" class="muted">Cargando…</div><p class="muted">Los mismos datos están en la hoja "Resultados" para exportarlos.</p></div>'; }
function cargarResultadosClase() {
  call('apiAdmin', TOK, 'resultados', { simId: SIMID }).then(function (L) {
    if (!L.length) { $('rc').innerHTML = 'Sin resultados.'; return; }
    var cols = ['equipo', 'trimestre', 'ventas', 'utilidadNeta', 'caja', 'cuotaTotal', 'vitalidad', 'clima', 'madurez', 'gastoInnovacion', 'ventasSinInnovar', 'utilidadSinInnovar'];
    $('rc').innerHTML = '<div class="scroll"><table><tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>' + L.sort(function (a, b) { return a.trimestre - b.trimestre || String(a.equipo).localeCompare(b.equipo); }).map(function (r) { return '<tr>' + cols.map(function (c) { return '<td class="n">' + esc(typeof r[c] === 'number' && Math.abs(r[c]) > 999 ? Math.round(r[c]).toLocaleString('es-BO') : r[c]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
  });
}
function aBitacoras() { return '<div class="card"><h2>Bitácoras</h2><div id="bc" class="muted">Cargando…</div></div>'; }
function cargarBitacorasClase() {
  call('apiAdmin', TOK, 'bitacoras', { simId: SIMID }).then(function (L) {
    if (!L.length) { $('bc').innerHTML = 'Sin bitácoras.'; return; }
    var nom = {}; ADM.equipos.forEach(function (e) { nom[e.equipoId] = e.nombre; });
    $('bc').innerHTML = L.sort(function (a, b) { return b.trimestre - a.trimestre; }).map(function (b) {
      return '<div style="border-bottom:1px solid #eee;padding:8px 0"><b>' + esc(nom[b.equipoId] || b.equipoId) + ' · T' + b.trimestre + '</b><br><b>Decidimos:</b> ' + esc(b.decidimos) + '<br><b>Pasó:</b> ' + esc(b.paso) + '<br><b>Por qué:</b> ' + esc(b.porque) + '<br><b>Principio:</b> ' + esc(b.principio) +
        '<div class="inline" style="margin-top:6px"><input type="number" id="nt' + b._row + '" value="' + esc(b.nota) + '" placeholder="Nota" style="max-width:90px"><input type="text" id="cm' + b._row + '" value="' + esc(b.comentario) + '" placeholder="Comentario"><button class="btn sec" onclick="adm(\'calificarBitacora\',{row:' + b._row + ',nota:$(\'nt' + b._row + '\').value,comentario:$(\'cm' + b._row + '\').value},false)">Guardar</button></div></div>';
    }).join('');
  });
}

</script>
